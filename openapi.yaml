        - lang: curl
          label: cURL
          source: |
            curl -X POST "https://api.modernedi.com/v1/mapped-outputs/7e8276c1d55988a4bf7fbf9f8c2d87187a24bd316dfed84bbf64397b8d5b6e4a/ack" \
