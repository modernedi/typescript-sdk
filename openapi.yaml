      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  headers:
    XRequestId:
      description: Correlation id for this request. Log it when contacting ModernEDI support.
      schema:
        type: string
      example: req_01HZ9TRK7B0YQW2V4RMNC9B60A
    RetryAfter:
      description: Number of seconds the client should wait before retrying this operation.
      schema:
        type: string
      example: '60'
    ConfigurationApplyRetryAfter:
      description: Number of seconds the client should wait before polling this committed configuration apply operation.
      schema:
        type: string
      example: '15'
    IdempotencyReplayed:
      description: |
        The value is `true` when the tenant AS2 runtime returned a stored idempotent result.
      schema:
        type: string
        enum:
          - 'true'
    ReplayIdempotencyReplayed:
      description: |
        `true` when this response was loaded from a previous successful replay with the same key and request.
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
    ConfigurationApplyIdempotencyReplayed:
      description: |
        `true` when this response replays the stored operation for the same authenticated-API-key idempotency namespace and semantic apply request; `false` when this request created the operation.
      schema:
        type: string
        enum:
          - 'true'
          - 'false'
    ConfigurationApplyOperationLocation:
      description: Tenant-scoped status resource for a committed configuration apply whose runtime publication is pending.
      schema:
        type: string
        pattern: ^/v1/configuration/apply-operations/apply-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      example: /v1/configuration/apply-operations/apply-3ee360bd-7e41-4c55-80f8-3f1e5839804d
    ConfigurationEtag:
      description: Quoted SHA-256 identity of the returned configuration version. Send it in `If-Match` only for operations that explicitly declare that precondition.
      schema:
        type: string
      example: '"44e5a1b1242e11a8b29380d9de44c08b46433673f30e23ac876a345fc2c5f1b3"'
    ConfigurationSnapshotEtag:
      description: Strong quoted SHA-256 ETag for the complete exported configuration snapshot. It is identical to `snapshotEtag` in a `200` response and may be sent in `If-None-Match`.
      schema:
        type: string
        pattern: ^"[0-9a-f]{64}"$
      example: '"a825c8107452f9329d680f86c9d71217e3e4adfd835db6f1f0f7a2f95dfc52e4"'
    PrivateNoCache:
      description: The configuration export is private tenant data and must be revalidated before reuse.
      schema:
        type: string
        enum:
          - private, no-cache
    PrivateNoStore:
      description: The response contains private tenant planning or apply-operation data and must not be stored by shared or private caches.
      schema:
        type: string
        enum:
          - private, no-store
  requestBodies:
    OutboundMappedSourceBody:
      required: true
      description: |
        Source document for an outgoing map. Use the vendor media type for an explicit ModernEDI envelope containing `input`, `contentType`, optional `params`, and optional `businessKey`. `application/json` bodies are always ordinary JSON map input, including objects with top-level `input`, `params`, `businessKey`, or `contentType` fields.
      content:
        application/vnd.modernedi.outbound+json:
          schema:
            $ref: '#/components/schemas/OutboundTransformEnvelope'
        application/json:
          schema:
            anyOf:
              - type: object
                additionalProperties: true
              - type: array
                items: {}
              - type: string
                nullable: true
              - type: number
              - type: boolean
        application/xml:
          schema:
            type: string
        text/plain:
          schema:
            type: string
    GeneratedX12Body:
      required: true
      description: |
        A complete X12 interchange that ModernEDI should validate and send without applying an outgoing map. Use the JSON form only when you also want to attach a business key to the transaction record.
      content:
        application/edi-x12:
          schema:
            type: string
        text/plain:
          schema:
            type: string
        application/json:
          schema:
            $ref: '#/components/schemas/GeneratedX12Request'
  parameters:
    CallerRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:@/+=-]{0,127}$
      description: |
        Optional caller correlation id. ModernEDI preserves a value that matches this safe format and returns it in the response `X-Request-Id` header; otherwise ModernEDI generates a replacement. Always log the response value because it is the authoritative id for support correlation.
    TestMode:
      name: test
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: |
        When `true`, use the test identifiers and test endpoint configured for the partner connection. On `/v1/as2/reply` and `/v1/as2/x12/reply`, this also selects test transaction history when `originalMessageId` is used to infer partner metadata and link the reply.
    TransactionEnvironment:
      name: environment
      in: query
      required: false
      schema:
        type: string
        enum:
          - production
          - test
        default: production
      description: |
        Selects the isolated production or test transaction history and queue. Cursors and mapped-output receipt handles are bound to the environment that created them and cannot be reused across environments.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: |
        Optional caller-generated key for safely retrying outbound requests. Reusing the same key with the same request replays a stored terminal result; reusing it with a different request returns an idempotency conflict. Retryable downstream `408`, `425`, `429`, and `5xx` results are not terminal and a retry can execute the AS2 send again. A replayed stored result includes `Idempotency-Replayed: true`. If the tenant AS2 runtime asks the client to wait, ModernEDI preserves its `Retry-After` response header. For the mapped endpoints, mapping selection, transformation, and generated-X12 validation happen before the tenant AS2 runtime reserves this key. If one of those steps fails and you correct the partner or map configuration, retry the identical operation and request with the same key even when that configuration error reported `retryable: false`. Do not change the operation, selectors, source input, content type, params, or business key while reusing it. When delivery may have succeeded but the terminal response was lost, reconcile transaction history and business keys before retrying because idempotency cannot rule out a duplicate send.
    ReplayIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: |
        Required caller-generated replay key. Reuse the same key only for the same message id, transaction key, environment, mode, delivery, and reason. A successful result is stored for safe retry.
    ConfigurationApplyIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
      description: Required change key scoped to the authenticated API key within the workspace. Persist one stable value with the intended aggregate apply and reuse it through the same API key only with the identical `planSha256`, `If-Match`, and logical files. A different API key has a separate namespace. Do not generate a new value merely because the first response was lost or returned `202`.
    ConfigurationApplyIfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[0-9a-f]{64}"$
      description: Exact quoted `currentSnapshotEtag` returned by the successful plan represented by the request's `planSha256`.
      example: '"41e0beb711cf83eb7c849b8aef48c5e35ea428645d357a3a2a731936f7000b38"'
    ConfigurationApplyOperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        pattern: ^apply-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      description: Immutable tenant-scoped apply operation id returned by POST. It is `apply-` followed by a canonical lowercase UUID.
      example: apply-3ee360bd-7e41-4c55-80f8-3f1e5839804d
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Exact quoted ETag returned by the latest GET, POST, or PATCH response for this resource.
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
      description: |
        Optional current configuration snapshot ETag. A matching strong or weak validator, a matching value in a comma-separated list, or `*` returns `304 Not Modified` with no body.
    OutboundPartnerId:
      name: partnerId
      in: query
      required: true
      schema:
        type: integer
      description: Stable partner id returned by `GET /v1/partners`. For `/carbonCopy`, this id selects the original/source partner, not the `copyToPartnerId` recipient.
      example: 1
    ReplyOutboundPartnerId:
      name: partnerId
      in: query
      required: false
      schema:
        type: integer
      description: Stable partner id returned by `GET /v1/partners`. Optional for `/reply` when `originalMessageId` identifies an inbound transaction with an unambiguous persisted partner id. Transactions without a persisted id do not supply inferred partner metadata. An explicit id overrides inferred partner metadata.
      example: 1
    OutboundX12Version:
      name: x12Version
      in: query
      required: true
      schema:
        type: string
      description: X12 version tied to the outgoing map.
      example: '4010'
    ReplyOutboundX12Version:
      name: x12Version
      in: query
      required: false
      schema:
        type: string
      description: X12 version tied to the outgoing reply map. Optional for `/reply` when `originalMessageId` identifies an inbound transaction whose X12 version can be inferred unambiguously. Send this explicitly when the reply must use a different X12 version than the original inbound document.
      example: '4010'
    OutboundFunctionalGroupType:
      name: functionalGroupType
      in: query
      required: true
      schema:
        type: string
      description: X12 functional group code tied to the outgoing map.
      example: IN
    ReplyOutboundFunctionalGroupType:
      name: functionalGroupType
      in: query
      required: false
      schema:
        type: string
      description: X12 functional group code tied to the outgoing reply map. Optional for `/reply` when `originalMessageId`, the resolved partner and X12 version, and request `Content-Type` match exactly one outgoing reply map. Send this explicitly when multiple reply maps could match.
      example: IN
    OutboundTransactionGroupType:
      name: transactionGroupType
      in: query
      required: true
      schema:
        type: integer
      description: X12 transaction set identifier code tied to the outgoing map.
      example: 810
    ReplyOutboundTransactionGroupType:
      name: transactionGroupType
      in: query
      required: false
      schema:
        type: integer
      description: X12 transaction set identifier code tied to the outgoing reply map. Optional for `/reply` when `originalMessageId`, the resolved partner and X12 version, and request `Content-Type` match exactly one outgoing reply map. Send this explicitly when multiple reply maps could match.
      example: 810
    OriginalMessageId:
      name: originalMessageId
      in: query
      required: true
      schema:
        type: string
      description: Original inbound AS2 message id used to link replies or carbon copies to an inbound flow.
      example: msg-850-api
    OriginalTransactionKey:
      name: originalTransactionKey
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: |
        Exact transaction key, normally `GS06#ST02`, inside `originalMessageId`. Supply it when one inbound AS2 message contains multiple transaction sets. ModernEDI validates the composite reference against the selected production or test environment and authenticated workspace before transforming or sending. A missing or unauthorized exact inbound transaction returns 404 without invoking the map or tenant runtime. When omitted, ModernEDI resolves and persists the key only if `originalMessageId` identifies exactly one inbound transaction; an ambiguous multi-transaction message returns 400.
      example: 17#0001
    CopyToPartnerId:
      name: copyToPartnerId
      in: query
      required: true
      schema:
        type: integer
      description: Stable partner id returned by `GET /v1/partners` for the partner that receives the carbon-copy AS2 envelope. This does not select the outgoing map; `partnerId` selects the original/source map.
      example: 2
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
      description: AS2 message id.
    TransactionKey:
      name: transactionKey
      in: path
      required: true
      schema:
        type: string
      description: Transaction key, usually `<functional-group-control-number>#<transaction-control-number>`.
  securitySchemes:
    IntegrationApiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: |
        Recommended workspace integration API key header. Keys may grant `transactions:read`, `transactions:write`, `transactions:replay`, `messages:write`, `configuration:read`, `configuration:write`, `scenario-runs:read`, and `scenario-runs:write`. See each operation's required scope.
    IntegrationApiKeyBearer:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: Alternative bearer-token form of the same scoped tenant integration API key.
  schemas:
    AdvanceScenarioRunRequest:
      type: object
      additionalProperties: false
      required: []
      properties: {}
    CancelScenarioRunRequest:
      type: object
      additionalProperties: false
      required: []
      properties: {}
    ScenarioEvidenceReport:
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - createdAt
        - claim
        - run
        - binding
        - operations
        - evidence
      properties:
        apiVersion:
          enum:
            - modernedi.com/scenario-evidence-report/v1
          type: string
        createdAt:
          type: string
          format: date-time
        claim:
          $ref: '#/components/schemas/ScenarioEvidenceClaim'
        run:
          $ref: '#/components/schemas/ScenarioEvidenceRun'
        binding:
          $ref: '#/components/schemas/ScenarioEvidenceBinding'
        operations:
          $ref: '#/components/schemas/ScenarioEvidenceOperations'
        evidence:
          $ref: '#/components/schemas/ScenarioEvidence'
    ScenarioRunCollection:
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - runs
        - nextCursor
      properties:
        apiVersion:
          enum:
            - modernedi.com/scenario-platform/v1
          type: string
        kind:
          enum:
            - scenario_run_collection
          type: string
        runs:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ScenarioRunSummary'
        nextCursor:
          type: string
          nullable: true
          maxLength: 1024
          pattern: ^[A-Za-z0-9_-]+$
          description: Opaque tenant-bound keyset cursor for the next page, or null when history is exhausted.
    ScenarioRunCommandResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - operation
        - run
      properties:
        success:
          enum:
            - true
          type: boolean
        operation:
          $ref: '#/components/schemas/ScenarioOperation'
        run:
          $ref: '#/components/schemas/ScenarioRun'
    ScenarioRunObservationRequest:
      type: object
      additionalProperties: false
      required:
        - stepId
        - occurrence
        - messageId
        - transactionKey
      properties:
        stepId:
          $ref: '#/components/schemas/ScenarioDefinitionToken'
        occurrence:
          type: integer
          minimum: 1
        messageId:
          type: string
          minLength: 1
        transactionKey:
          type: string
          minLength: 1
    ScenarioRunTimelineResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - runId
        - operations
        - nextCursor
      properties:
        success:
          enum:
            - true
          type: boolean
        runId:
          type: string
          pattern: ^run-[0-9a-f-]+$
        operations:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ScenarioRunTimelineOperation'
        nextCursor:
          type: string
          nullable: true
          maxLength: 1024
          pattern: ^[A-Za-z0-9_-]+$
          description: Opaque tenant-and-run-bound keyset cursor for the next page, or null when the timeline is exhausted.
    ScenarioRunViewResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - run
      properties:
        success:
          enum:
            - true
          type: boolean
        run:
          $ref: '#/components/schemas/ScenarioRun'
    StartScenarioRunRequest:
      type: object
      additionalProperties: false
      required:
        - definition
        - environment
        - binding
      properties:
        definition:
          $ref: '#/components/schemas/ScenarioDefinitionIdentity'
        environment:
          enum:
            - production
            - test
          type: string
        binding:
          type: object
          additionalProperties: false
          required:
            - id
            - revision
            - contentSha256
          properties:
            id:
              $ref: '#/components/schemas/ScenarioBindingToken'
            revision:
              type: integer
              format: int64
              minimum: 0
            contentSha256:
              type: string
              pattern: ^[0-9a-f]{64}$
        parameters:
          $ref: '#/components/schemas/ScenarioRunParameterValues'
    ConfigurationExportResponse:
      description: Deterministic logical file bundle representing the workspace's current exportable configuration and its observed API state.
      type: object
      additionalProperties: false
      required:
        - success
        - bundleSha256
        - snapshotSha256
        - snapshotEtag
        - files
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; failures use the documented error response instead.
        bundleSha256:
          allOf:
            - $ref: '#/components/schemas/ConfigurationSha256'
          description: SHA-256 of the canonical `modernedi.json` manifest content. This identifies the portable desired-state bundle and excludes `_state/snapshot.json`.
        snapshotSha256:
          allOf:
            - $ref: '#/components/schemas/ConfigurationSha256'
          description: SHA-256 of the canonical `_state/snapshot.json` content, including current database ids and public API ETags.
        snapshotEtag:
          type: string
          pattern: ^"[0-9a-f]{64}"$
          description: Quoted `snapshotSha256`, also returned in the HTTP `ETag` header and accepted by `If-None-Match`.
        files:
          type: array
          description: Complete export sorted lexicographically by `path`. It contains the desired resource and source files plus `modernedi.json` and `_state/snapshot.json`.
          items:
            $ref: '#/components/schemas/ConfigurationExportFile'
    ConfigurationExportFile:
      description: One logical file in the configuration export. JSON content is an object; mapping sources and public PEM certificates are exact text strings. Private keys are never included.
      type: object
      additionalProperties: false
      required:
        - path
        - role
        - format
        - mediaType
        - contentSha256
        - content
      properties:
        path:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9._/-]+$
          description: Safe relative POSIX-style path. Paths never start with `/`, contain `\\`, contain an empty component, or contain a `..` component.
          example: mappings/8ccf76f0-2701-4d4c-a5c4-94a453feec81/source.x12mapper
        role:
          type: string
          enum:
            - MANIFEST
            - RESOURCE
            - SOURCE
            - CERTIFICATE
            - STATE
          description: Purpose of the file. `STATE` records observed server identity and is not portable desired configuration.
        format:
          type: string
          enum:
            - JSON
            - TEXT
          description: How to interpret `content` and calculate its logical bytes. `JSON` uses canonical JSON; `TEXT` uses exact UTF-8 text.
        mediaType:
          type: string
          enum:
            - application/json
            - text/plain; charset=utf-8
          description: Media type to use if the logical file is materialized.
        contentSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
        content:
          description: Parsed JSON object for JSON files or exact mapping source for text files.
          oneOf:
            - $ref: '#/components/schemas/ConfigurationBundleManifest'
            - $ref: '#/components/schemas/ConfigurationResourceDocument'
            - $ref: '#/components/schemas/ConfigurationSnapshotState'
            - type: string
    ConfigurationPlanRequest:
      description: Portable desired-state bundle submitted for read-only planning. It contains exactly one manifest and every resource and mapping-source file inventoried by that manifest. It may also include at most one advisory STATE file copied directly from configuration export; ModernEDI never treats that file as authority over current workspace state.
      type: object
      additionalProperties: false
      required:
        - files
      properties:
        refreshScenarioBindings:
          $ref: '#/components/schemas/ConfigurationScenarioBindingRefresh'
        files:
          type: array
          minItems: 1
          maxItems: 5000
          description: Desired files plus, optionally, the single exported advisory state file. Paths must be safe, case-insensitively unique relative POSIX paths, and each declared hash must match the file's logical bytes. Only `_state/snapshot.json` may use the `_state` prefix.
          items:
            $ref: '#/components/schemas/ConfigurationPlanFile'
    ConfigurationPlanFile:
      description: One portable desired file or the optional exported advisory snapshot. The role makes these alternatives unambiguous.
      oneOf:
        - $ref: '#/components/schemas/ConfigurationDesiredFile'
        - $ref: '#/components/schemas/ConfigurationPlanAdvisoryStateFile'
    ConfigurationDesiredFile:
      description: One portable desired-state file accepted by configuration planning. JSON content is an object; SOURCE and CERTIFICATE content are exact UTF-8 text strings. A CERTIFICATE must contain exactly one public X.509 certificate in canonical PEM and use as2-connections/<key>/certificates/<name>.pem. Names have 1-64 lowercase letters, digits, hyphens or underscores and start with a letter or digit. Production and Test may reference the same file within their connection.
      type: object
      additionalProperties: false
      required:
        - path
        - role
        - format
        - mediaType
        - contentSha256
        - content
      properties:
        path:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9._/-]+$
          description: Safe relative POSIX-style path outside `_state`. The sole MANIFEST path is exactly `modernedi.json`.
        role:
          type: string
          enum:
            - MANIFEST
            - RESOURCE
            - SOURCE
            - CERTIFICATE
          description: Desired-file purpose. STATE is deliberately excluded because observed server identity is not portable desired configuration.
        format:
          type: string
          enum:
            - JSON
            - TEXT
          description: MANIFEST and RESOURCE files use JSON; SOURCE and CERTIFICATE files use TEXT.
        mediaType:
          type: string
          enum:
            - application/json
            - text/plain; charset=utf-8
          description: MANIFEST and RESOURCE files use `application/json`; SOURCE and CERTIFICATE files use exact UTF-8 text.
        contentSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
        content:
          description: Parsed manifest or resource object, or exact mapping-source text.
          oneOf:
            - $ref: '#/components/schemas/ConfigurationBundleManifest'
            - $ref: '#/components/schemas/ConfigurationResourceDocument'
            - type: string
    ConfigurationPlanAdvisoryStateFile:
      description: Optional untrusted snapshot copied from configuration export. It is accepted only with the canonical path, role, and JSON representation. ModernEDI compares its digest with current state to report `BASE_SNAPSHOT_STALE`, but never trusts its database ids, ETags, revision, or resource inventory as mutation authority.
      type: object
      additionalProperties: false
      required:
        - path
        - role
        - format
        - mediaType
        - contentSha256
        - content
      properties:
        path:
          type: string
          enum:
            - _state/snapshot.json
        role:
          type: string
          enum:
            - STATE
        format:
          type: string
          enum:
            - JSON
        mediaType:
          type: string
          enum:
            - application/json
        contentSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
        content:
          $ref: '#/components/schemas/ConfigurationSnapshotState'
    ConfigurationPlanResponse:
      description: Deterministic read-only comparison between one validated desired bundle and the workspace's current portable AS2, partner, and mapping configuration.
      type: object
      additionalProperties: false
      required:
        - success
        - applicable
        - desiredBundleSha256
        - currentSnapshotEtag
        - runtimeConfigurationRevision
        - validationContext
        - planSha256
        - summary
        - operations
        - diagnostics
        - scenarioImpactComplete
        - affectedScenarios
        - affectedRuns
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true` when planning completed, including a plan with semantic errors.
        applicable:
          type: boolean
          description: Whether the desired configuration passed semantic validation and complete scenario-impact analysis and can therefore receive a `planSha256`.
        desiredBundleSha256:
          allOf:
            - $ref: '#/components/schemas/ConfigurationSha256'
          description: SHA-256 of the submitted canonical `modernedi.json` manifest.
        currentSnapshotEtag:
          type: string
          pattern: ^"[0-9a-f]{64}"$
          description: Strong quoted SHA-256 identity of the current configuration snapshot used for this comparison.
        runtimeConfigurationRevision:
          type: integer
          format: int64
          minimum: 0
          description: Tenant-wide runtime configuration revision observed by the same repeatable-read planning transaction.
        validationContext:
          $ref: '#/components/schemas/ConfigurationPlanValidationContext'
        planSha256:
          type: string
          nullable: true
          pattern: ^[0-9a-f]{64}$
          description: Deterministic identity binding desired state, current snapshot, validation context, operations, and scenario impact. Null when `applicable` is false.
        summary:
          $ref: '#/components/schemas/ConfigurationPlanSummary'
        operations:
          type: array
          description: Changed resources only, in deterministic dependency-aware display order. Unchanged resources are counted in `summary.unchanged`.
          items:
            $ref: '#/components/schemas/ConfigurationPlanOperation'
        diagnostics:
          type: array
          description: Deterministically ordered semantic errors and warnings. Any ERROR makes `applicable` false.
          items:
            $ref: '#/components/schemas/ConfigurationPlanDiagnostic'
        scenarioImpactComplete:
          type: boolean
          description: Whether ModernEDI safely evaluated every applied scenario binding that could depend on a changed resource. False makes `applicable` false.
        affectedScenarios:
          type: array
          description: Applied scenario bindings that would require reapplication if these operations were later applied.
          items:
            $ref: '#/components/schemas/ConfigurationPlanAffectedScenario'
        affectedRuns:
          type: array
          description: ACTIVE scenario runs pinned to affected binding revisions. Any entry makes the plan inapplicable until the run is cancelled or completed and configuration is planned again.
          items:
            $ref: '#/components/schemas/ConfigurationPlanAffectedRun'
    ConfigurationPlanValidationContext:
      description: Immutable syntax-tree catalog identity used while validating desired mappings. Both fields are null when no active catalog identity is available.
      type: object
      additionalProperties: false
      required:
        - syntaxTreeCatalogRevision
        - syntaxTreeCatalogManifestSha256
      properties:
        syntaxTreeCatalogRevision:
          type: string
          nullable: true
          description: Active immutable syntax-tree catalog revision used by mapping validation.
        syntaxTreeCatalogManifestSha256:
          type: string
          nullable: true
          pattern: ^[0-9a-f]{64}$
          description: Lowercase SHA-256 of the active syntax-tree catalog manifest.
        scenarioAuthorityEtag:
          type: string
          description: Present when scenario bindings are planned. Fences the current definitions, adapters, syntax trees, partners and mappings used for validation; apply rechecks this authority.
          pattern: ^"[0-9a-f]{64}"$
    ConfigurationPlanSummary:
      description: Resource counts across the complete desired/current comparison.
      type: object
      additionalProperties: false
      required:
        - create
        - update
        - delete
        - unchanged
      properties:
        create:
          type: integer
          minimum: 0
        update:
          type: integer
          minimum: 0
        delete:
          type: integer
          minimum: 0
        unchanged:
          type: integer
          minimum: 0
    ConfigurationPlanAction:
      type: string
      enum:
        - CREATE
        - UPDATE
        - DELETE
      description: Desired change to one stable portable resource identity.
    ConfigurationPlanOperation:
      description: One changed resource. CREATE has only `desired`, UPDATE has `current` and `desired`, and DELETE has only `current`.
      type: object
      additionalProperties: false
      required:
        - action
        - kind
        - key
        - path
      properties:
        action:
          $ref: '#/components/schemas/ConfigurationPlanAction'
        kind:
          $ref: '#/components/schemas/ConfigurationResourceKind'
        key:
          type: string
          format: uuid
          description: Stable portable resource key.
        path:
          type: string
          description: Desired resource path for CREATE/UPDATE or current exported path for DELETE.
        current:
          $ref: '#/components/schemas/ConfigurationPlanCurrentValue'
        desired:
          $ref: '#/components/schemas/ConfigurationPlanDesiredValue'
    ConfigurationPlanCurrentValue:
      description: Observed current identity for an UPDATE or DELETE operation.
      type: object
      additionalProperties: false
      required:
        - resourceId
        - contentSha256
        - apiEtag
      properties:
        resourceId:
          type: integer
          format: int64
          minimum: 1
          description: Current tenant-scoped API resource id. Portable references continue to use `key`.
        contentSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
        apiEtag:
          type: string
          pattern: ^"[0-9a-f]{64}"$
          description: Current public configuration ETag observed in the same snapshot.
    ConfigurationPlanDesiredValue:
      description: Desired portable content identity for a CREATE or UPDATE operation.
      type: object
      additionalProperties: false
      required:
        - contentSha256
      properties:
        contentSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
    ConfigurationPlanDiagnostic:
      description: One machine-readable planning error or warning. `pointer` is an RFC 6901 JSON Pointer into the submitted request body; source diagnostics may also identify an exact file, line, and column.
      type: object
      additionalProperties: false
      required:
        - severity
        - code
        - message
        - pointer
      properties:
        severity:
          type: string
          enum:
            - ERROR
            - WARNING
        code:
          type: string
          minLength: 1
          description: Stable machine-readable diagnostic code.
        message:
          type: string
          minLength: 1
          description: Plain-language explanation suitable for an operator or authoring tool.
        pointer:
          type: string
          description: RFC 6901 JSON Pointer into the submitted `ConfigurationPlanRequest`; the empty string identifies the request root.
        filePath:
          type: string
          description: Logical bundle path associated with this diagnostic when one file can be identified.
        resource:
          $ref: '#/components/schemas/ConfigurationPlanResourceIdentity'
        line:
          type: integer
          minimum: 1
          description: One-based source line when a mapping compiler supplies a location.
        column:
          type: integer
          minimum: 1
          description: One-based source column when a mapping compiler supplies a location.
    ConfigurationPlanResourceIdentity:
      description: Stable portable identity of a resource associated with a diagnostic.
      type: object
      additionalProperties: false
      required:
        - kind
        - key
      properties:
        kind:
          $ref: '#/components/schemas/ConfigurationResourceKind'
        key:
          type: string
          format: uuid
    ConfigurationPlanAffectedScenario:
      description: One applied scenario binding whose executable authority depends on a changed resource.
      type: object
      additionalProperties: false
      required:
        - bindingId
        - revision
        - name
        - environment
        - definition
        - effect
        - resources
      properties:
        bindingId:
          type: string
          minLength: 1
          description: Stable scenario binding identifier.
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Applied immutable binding revision.
        name:
          type: string
          minLength: 1
          description: Customer-facing binding name.
        environment:
          type: string
          enum:
            - production
            - test
        definition:
          $ref: '#/components/schemas/ConfigurationPlanScenarioDefinition'
        effect:
          type: string
          enum:
            - REAPPLY_REQUIRED
            - REAPPLIED_BY_APPLY
            - RETIRED_BY_APPLY
          description: REAPPLIED_BY_APPLY refreshes the binding's frozen authority in this aggregate apply; RETIRED_BY_APPLY removes it from current configuration while preserving its history; REAPPLY_REQUIRED identifies a binding outside the desired configuration that needs a separate refresh.
        resources:
          type: array
          minItems: 1
          description: Planned changes responsible for this scenario effect.
          items:
            $ref: '#/components/schemas/ConfigurationPlanScenarioResource'
    ConfigurationPlanScenarioDefinition:
      description: Portable release identity of the scenario definition used by an affected binding.
      type: object
      additionalProperties: false
      required:
        - namespace
        - key
        - version
      properties:
        namespace:
          type: string
        key:
          type: string
        version:
          type: string
    ConfigurationPlanAffectedRun:
      description: One ACTIVE scenario run whose pinned binding authority depends on a changed resource.
      type: object
      additionalProperties: false
      required:
        - runId
        - bindingId
        - bindingRevision
        - effect
        - resources
      properties:
        runId:
          type: string
          minLength: 1
          description: Stable scenario run identifier.
        bindingId:
          type: string
          minLength: 1
          description: Stable scenario binding identifier pinned by the run.
        bindingRevision:
          type: integer
          format: int64
          minimum: 0
          description: Immutable binding revision pinned by the active run.
        effect:
          type: string
          enum:
            - CANCEL_OR_COMPLETE_REQUIRED
          description: The run must leave ACTIVE state before this desired configuration can be applied.
        resources:
          type: array
          minItems: 1
          description: Planned resource changes that intersect the run's pinned binding authority.
          items:
            $ref: '#/components/schemas/ConfigurationPlanScenarioResource'
    ConfigurationPlanScenarioResource:
      description: Planned resource change that affects an applied scenario binding.
      type: object
      additionalProperties: false
      required:
        - kind
        - key
        - action
      properties:
        kind:
          $ref: '#/components/schemas/ConfigurationResourceKind'
        key:
          type: string
          format: uuid
        action:
          $ref: '#/components/schemas/ConfigurationPlanAction'
    ConfigurationVerificationRunId:
      type: string
      description: Server-owned verification run identity.
      pattern: ^verify-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    ConfigurationVerificationRequest:
      type: object
      additionalProperties: false
      description: Execute saved cases from the exact desired configuration under review. Request IDs are replayable only with identical content and the same API key.
      required:
        - requestId
        - planSha256
        - files
      properties:
        requestId:
          type: string
          description: Persist a canonical UUID and reuse it only when retrying this exact request.
          format: uuid
        planSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
        files:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: '#/components/schemas/ConfigurationPlanFile'
          description: Exact logical files from the applicable plan.
        refreshScenarioBindings:
          $ref: '#/components/schemas/ConfigurationScenarioBindingRefresh'
    ConfigurationVerificationSyntaxTree:
      type: object
      additionalProperties: false
      description: Exact stored X12 grammar and catalog frozen for this mapping.
      required:
        - schemaVersion
        - x12Version
        - transactionSetIdentifierCode
        - catalogRevision
        - manifestSha256
        - syntaxTreeSha256
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
          description: Syntax-tree catalog identity format.
        x12Version:
          type: string
          description: X12 release of the stored grammar.
        transactionSetIdentifierCode:
          type: string
          description: X12 transaction set of the stored grammar.
        catalogRevision:
          $ref: '#/components/schemas/ConfigurationSha256'
        manifestSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
        syntaxTreeSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
    ConfigurationVerificationMapping:
      type: object
      additionalProperties: false
      description: Identity and coverage of one tested mapping.
      required:
        - mappingResourceKey
        - candidateSha256
        - casesSha256
        - caseCount
        - syntaxTree
      properties:
        mappingResourceKey:
          type: string
          description: Stable portable Mapping resource key.
          format: uuid
        candidateSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
        casesSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
        caseCount:
          type: integer
          minimum: 1
          maximum: 10
          description: Number of saved cases selected for this mapping.
        syntaxTree:
          $ref: '#/components/schemas/ConfigurationVerificationSyntaxTree'
    ConfigurationVerificationIdentity:
      type: object
      additionalProperties: false
      description: Server-derived identity of the reviewed configuration and evaluator, not tenant-runtime execution evidence.
      required:
        - planSha256
        - desiredBundleSha256
        - baseSnapshotEtag
        - evaluatorSha256
        - mappings
        - untestedMappingCount
        - caseCount
      properties:
        planSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
        desiredBundleSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
        baseSnapshotEtag:
          type: string
          description: Exact workspace snapshot used to plan.
        evaluatorSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
        mappings:
          type: array
          minItems: 1
          maxItems: 25
          items:
            $ref: '#/components/schemas/ConfigurationVerificationMapping'
          description: All desired mappings containing saved cases, sorted by resource key.
        untestedMappingCount:
          type: integer
          minimum: 0
          description: Desired mappings without saved cases. A passing suite does not cover these mappings.
        caseCount:
          type: integer
          minimum: 1
          maximum: 100
          description: Total selected saved cases, including cases not reached before cancellation or timeout.
    ConfigurationVerificationCaseResult:
      type: object
      additionalProperties: false
      description: Exact text comparison and optional generated-X12 validation outcome. A case fails if either requested check fails. Raw inputs, outputs and engine diagnostic text are never retained.
      required:
        - mappingResourceKey
        - id
        - name
        - status
        - caseSha256
        - expectedOutputSha256
        - actualOutputSha256
      properties:
        mappingResourceKey:
          type: string
          description: Mapping owning this case.
          format: uuid
        id:
          type: string
          description: Portable case ID.
        name:
          type: string
          description: Portable case display name.
        status:
          type: string
          description: Outcome of this executed case.
          enum:
            - PASSED
            - FAILED
            - ERROR
        caseSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
        expectedOutputSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
        actualOutputSha256:
          type: string
          nullable: true
          pattern: ^[a-f0-9]{64}$
          description: Actual output hash, or null when execution produced no output.
        x12ValidationStatus:
          type: string
          enum:
            - PASSED
            - FAILED
            - ERROR
          description: Present only when the saved outgoing case requested validateX12. Uses the frozen mapping syntax tree and the same document preparation and validation as outgoing preview/send. A FAILED case may have matching expected/actual hashes when X12 validation failed.
    ConfigurationVerificationRun:
      type: object
      additionalProperties: false
      description: Durable bounded suite. Results expire after 90 days; only the most recent 200 workspace runs are retained. Freshness is checked on reads.
      required:
        - runId
        - status
        - createdAt
        - completedAt
        - appliedOperationId
        - identity
        - cases
        - freshness
        - staleReasons
      properties:
        runId:
          $ref: '#/components/schemas/ConfigurationVerificationRunId'
        status:
          type: string
          description: PASSED covers only selected saved cases; it does not establish delivery, partner acceptance or scenario success.
          enum:
            - RUNNING
            - PASSED
            - FAILED
            - ERROR
            - CANCELLED
            - TIMED_OUT
        createdAt:
          type: string
          description: Server admission time.
          format: date-time
        completedAt:
          type: string
          description: Server completion time; null while running.
          format: date-time
          nullable: true
        appliedOperationId:
          type: string
          description: Apply operation explicitly linked to this result, or null.
          nullable: true
        identity:
          $ref: '#/components/schemas/ConfigurationVerificationIdentity'
        cases:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ConfigurationVerificationCaseResult'
          description: Completed case outcomes. Incomplete suites cannot pass.
        freshness:
          type: string
          description: Whether current workspace, evaluator and catalog still match this result.
          enum:
            - CURRENT
            - STALE
        staleReasons:
          type: array
          items:
            type: string
            description: Reason evidence is no longer current.
            enum:
              - EVALUATOR_CHANGED
              - SYNTAX_TREE_CHANGED
              - CONFIGURATION_CHANGED
              - DEPENDENCIES_UNAVAILABLE
          description: Empty only when current.
    ConfigurationVerificationResponse:
      type: object
      additionalProperties: false
      description: One server verification run.
      required:
        - success
        - run
      properties:
        success:
          type: boolean
          enum:
            - true
        run:
          $ref: '#/components/schemas/ConfigurationVerificationRun'
    ConfigurationAppliedVerificationResponse:
      type: object
      additionalProperties: false
      description: Optional verification linked during apply. No linked result is normal when testing was not requested or evidence expired.
      required:
        - success
        - run
      properties:
        success:
          type: boolean
          enum:
            - true
        run:
          allOf:
            - $ref: '#/components/schemas/ConfigurationVerificationRun'
          type: object
          nullable: true
    ConfigurationApplyRequest:
      description: Exact applicable desired bundle and deterministic plan identity submitted for one aggregate configuration deployment. The files must be byte-for-byte and logically identical to those planned.
      type: object
      additionalProperties: false
      required:
        - planSha256
        - files
      properties:
        refreshScenarioBindings:
          $ref: '#/components/schemas/ConfigurationScenarioBindingRefresh'
        planSha256:
          allOf:
            - $ref: '#/components/schemas/ConfigurationSha256'
          description: Non-null deterministic plan identity returned by the immediately preceding applicable plan.
        verificationRunId:
          allOf:
            - $ref: '#/components/schemas/ConfigurationVerificationRunId'
          description: Optional explicit passing-evidence requirement. When supplied, the server requires a current, unapplied PASSED run for this exact bundle and plan, and links it to the apply atomically. Omit to apply without a verification gate.
        files:
          type: array
          minItems: 1
          maxItems: 5000
          description: The exact desired logical files used to compute `planSha256`, optionally including the one canonical advisory `_state/snapshot.json` file accepted by planning.
          items:
            $ref: '#/components/schemas/ConfigurationPlanFile'
    ConfigurationScenarioRunSelectionResponse:
      type: object
      additionalProperties: false
      description: Exact run-start selectors for an active authored binding in the specified completed configuration snapshot. This does not attest runtime availability or run success.
      required:
        - success
        - configurationApplyOperationId
        - appliedSnapshotEtag
        - selection
      properties:
        success:
          type: boolean
          enum:
            - true
        configurationApplyOperationId:
          type: string
          pattern: ^apply-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: The requested apply operation, not a substituted latest operation.
        appliedSnapshotEtag:
          type: string
          pattern: ^"[0-9a-f]{64}"$
          description: Matches the requested apply's appliedSnapshotEtag. Not a scenario-run revision ETag.
        selection:
          $ref: '#/components/schemas/StartScenarioRunRequest'
    ConfigurationContextResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - workspace
        - apiKey
      properties:
        success:
          type: boolean
          enum:
            - true
        workspace:
          type: object
          additionalProperties: false
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
              minimum: 1
              description: Workspace authenticated by the calling key; not a selectable target.
        apiKey:
          type: object
          additionalProperties: false
          required:
            - id
            - label
            - scopes
          properties:
            id:
              type: integer
              format: int64
              minimum: 1
            label:
              type: string
            scopes:
              type: array
              uniqueItems: true
              minItems: 1
              description: Current grants, sorted lexicographically. No write grant is implied by a read grant.
              items:
                type: string
                enum:
                  - transactions:read
                  - transactions:write
                  - transactions:replay
                  - messages:write
                  - configuration:read
                  - configuration:write
                  - scenario-runs:read
                  - scenario-runs:write
    ConfigurationExternalRepositoryResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - connected
      properties:
        success:
          type: boolean
          enum:
            - true
        connected:
          type: boolean
        connection:
          allOf:
            - $ref: '#/components/schemas/ConfigurationExternalRepository'
          description: Present only when connected is true.
    ConfigurationExternalRepository:
      type: object
      additionalProperties: false
      required:
        - repositoryUrl
        - branch
        - directory
        - status
        - automatic
        - verifyBeforeImport
        - importVerification
        - revision
        - createdAt
        - updatedAt
        - nextAttemptAt
        - lastSyncedAt
        - workspaceCommitSha
        - repositoryCommitSha
        - lastError
      properties:
        repositoryUrl:
          type: string
          format: uri
          description: Canonical HTTPS repository URL without credentials.
        branch:
          type: string
        directory:
          type: string
          description: Bundle directory within the connected repository.
        status:
          type: string
          enum:
            - pending
            - syncing
            - synced
            - conflict
            - held
            - error
          description: Current synchronization state. Held means import tests have not authorized an import; conflict means both sides changed and an owner must review.
        automatic:
          type: boolean
          enum:
            - true
        verifyBeforeImport:
          type: boolean
        importVerification:
          type: object
          nullable: true
          additionalProperties: false
          required:
            - runId
            - repositoryCommitSha
          properties:
            runId:
              type: string
              pattern: ^verify-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
            repositoryCommitSha:
              type: string
              pattern: ^[0-9a-f]{40}$
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Connection status revision; polling may advance it without a configuration change.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        nextAttemptAt:
          type: string
          format: date-time
          description: Scheduled check or retry time; not a completion promise.
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true
        workspaceCommitSha:
          type: string
          pattern: ^[0-9a-f]{40}$
          nullable: true
          description: Last synchronized internal workspace Git commit.
        repositoryCommitSha:
          type: string
          pattern: ^[0-9a-f]{40}$
          nullable: true
          description: Last synchronized external commit; may differ from the remote branch's current HEAD.
        lastError:
          type: object
          nullable: true
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Diagnostic code; new codes may be added.
            message:
              type: string
              description: Safe operator-facing explanation; not raw provider output.
    ConfigurationImportVerificationResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - run
      properties:
        success:
          type: boolean
          enum:
            - true
        run:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ConfigurationVerificationRun'
          description: Existing evidence for the current import, or null when no retained result is available. Null is not a pass.
    ConfigurationApplyOperationHistoryResponse:
      type: object
      additionalProperties: false
      required:
        - success
        - operations
        - nextCursor
      properties:
        success:
          type: boolean
          enum:
            - true
        operations:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ConfigurationApplyOperationHistoryEntry'
        nextCursor:
          type: string
          nullable: true
          maxLength: 1024
          description: Opaque cursor for the next page, or null at the end.
    ConfigurationApplyOperationHistoryEntry:
      type: object
      additionalProperties: false
      description: Compact workspace change-history entry; use the operation endpoint for its full change list.
      required:
        - operationId
        - changedBy
        - status
        - desiredBundleSha256
        - planSha256
        - baseSnapshotEtag
        - appliedSnapshotEtag
        - runtimeConfigurationRevision
        - summary
        - runtimePublication
        - requestedAt
        - committedAt
        - completedAt
      properties:
        operationId:
          $ref: '#/components/schemas/ConfigurationApplyOperation/properties/operationId'
        changedBy:
          $ref: '#/components/schemas/ConfigurationChangedBy'
        status:
          $ref: '#/components/schemas/ConfigurationApplyOperationStatus'
        desiredBundleSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
        planSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
        baseSnapshotEtag:
          $ref: '#/components/schemas/ConfigurationApplyOperation/properties/baseSnapshotEtag'
        appliedSnapshotEtag:
          $ref: '#/components/schemas/ConfigurationApplyOperation/properties/appliedSnapshotEtag'
        runtimeConfigurationRevision:
          $ref: '#/components/schemas/ConfigurationApplyOperation/properties/runtimeConfigurationRevision'
        summary:
          $ref: '#/components/schemas/ConfigurationPlanSummary'
        runtimePublication:
          $ref: '#/components/schemas/RuntimePublication'
        requestedAt:
          $ref: '#/components/schemas/ConfigurationApplyOperation/properties/requestedAt'
        committedAt:
          $ref: '#/components/schemas/ConfigurationApplyOperation/properties/committedAt'
        completedAt:
          $ref: '#/components/schemas/ConfigurationApplyOperation/properties/completedAt'
    ConfigurationApplyOperationResponse:
      description: Stored tenant-scoped result of one idempotent aggregate apply request.
      type: object
      additionalProperties: false
      required:
        - success
        - operation
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; rejected requests use the standard error envelope.
        operation:
          $ref: '#/components/schemas/ConfigurationApplyOperation'
    ConfigurationApplyOperationStatus:
      type: string
      enum:
        - PENDING
        - SUCCEEDED
      description: |
        `PENDING` means the aggregate database change committed and runtime publication is retrying. `SUCCEEDED` means the stored apply operation is terminal.
    ConfigurationApplyOperation:
      description: Immutable public journal entry for one aggregate configuration apply. Internal leases, attempts, lock state, API-key database ids, and retry scheduling are never exposed; the immutable human-readable actor label is included.
      type: object
      additionalProperties: false
      required:
        - operationId
        - changedBy
        - status
        - desiredBundleSha256
        - planSha256
        - baseSnapshotEtag
        - appliedSnapshotEtag
        - runtimeConfigurationRevision
        - summary
        - operations
        - runtimePublication
        - requestedAt
        - committedAt
        - completedAt
      properties:
        operationId:
          type: string
          pattern: ^apply-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: Immutable public id formed as `apply-` followed by a canonical lowercase UUID.
          example: apply-3ee360bd-7e41-4c55-80f8-3f1e5839804d
        changedBy:
          $ref: '#/components/schemas/ConfigurationChangedBy'
        status:
          $ref: '#/components/schemas/ConfigurationApplyOperationStatus'
        desiredBundleSha256:
          allOf:
            - $ref: '#/components/schemas/ConfigurationSha256'
          description: Applied canonical `modernedi.json` manifest digest.
        planSha256:
          allOf:
            - $ref: '#/components/schemas/ConfigurationSha256'
          description: Deterministic plan identity accepted by this operation.
        baseSnapshotEtag:
          type: string
          pattern: ^"[0-9a-f]{64}"$
          description: Exact successful-plan snapshot ETag supplied in `If-Match`.
        appliedSnapshotEtag:
          type: string
          pattern: ^"[0-9a-f]{64}"$
          description: Strong quoted SHA-256 identity of the committed post-apply configuration snapshot. It is available in both PENDING and SUCCEEDED operations because PENDING publication occurs only after database commit.
        runtimeConfigurationRevision:
          type: integer
          format: int64
          minimum: 0
          description: Tenant-wide runtime configuration revision committed by the aggregate database transaction.
        summary:
          $ref: '#/components/schemas/ConfigurationPlanSummary'
        operations:
          type: array
          description: Exact deterministic `CREATE`, `UPDATE`, and `DELETE` operations committed from the accepted plan.
          items:
            $ref: '#/components/schemas/ConfigurationPlanOperation'
        runtimePublication:
          allOf:
            - $ref: '#/components/schemas/RuntimePublication'
          description: State of the single post-commit workspace runtime publication for this aggregate operation.
        requestedAt:
          type: string
          format: date-time
          description: UTC instant when ModernEDI first accepted this idempotency key and semantic apply request.
        committedAt:
          type: string
          format: date-time
          description: UTC instant when the aggregate database transaction committed.
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: UTC instant when runtime publication reached its terminal state, or null while `status` is `PENDING`.
    ConfigurationChangedBy:
      description: Immutable attribution captured when the configuration version was committed.
      type: object
      additionalProperties: false
      required:
        - type
        - label
      properties:
        type:
          type: string
          enum:
            - API_KEY
            - WORKSPACE_MEMBER
            - SYSTEM
          description: Kind of workspace actor that committed the version.
        label:
          type: string
          minLength: 1
          maxLength: 200
          description: Human-readable actor label captured immutably at apply time.
    ConfigurationDocumentApiVersion:
      type: string
      enum:
        - modernedi.com/v1
      description: Version of the portable configuration document contract used by export, planning, and apply.
    ConfigurationSha256:
      type: string
      pattern: ^[0-9a-f]{64}$
      description: Lowercase hexadecimal SHA-256 digest.
      example: 30d7e671476880c8d357370bf9a7c21fc59f55d2435073e92763f61d1c72f749
    ConfigurationResourceKind:
      type: string
      enum:
        - As2Connection
        - Partner
        - Mapping
        - ScenarioDefinition
        - ScenarioBinding
      description: Exportable ModernEDI configuration resource type.
    ConfigurationScenarioBindingRefresh:
      type: array
      maxItems: 100
      uniqueItems: true
      description: Optional binding resource keys to re-apply against the destination workspace's current runtime authority without changing their authored files. Include the same selection in plan and apply. Referenced mapping/partner changes also produce explicit dependent binding updates in the plan. This option is apply metadata and never enters Git files.
      items:
        type: string
        format: uuid
    ConfigurationBundleManifest:
      description: Portable desired-state manifest stored at `modernedi.json`. It inventories resources and all desired files but intentionally excludes the manifest itself and `_state/snapshot.json`.
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - resources
        - files
      properties:
        apiVersion:
          $ref: '#/components/schemas/ConfigurationDocumentApiVersion'
        kind:
          type: string
          enum:
            - IntegrationConfiguration
        resources:
          type: array
          description: Exported resources sorted lexicographically by their resource-document path.
          items:
            $ref: '#/components/schemas/ConfigurationManifestResource'
        files:
          type: array
          description: Resource and mapping-source files sorted lexicographically by path. Manifest and state files are excluded.
          items:
            $ref: '#/components/schemas/ConfigurationManifestFile'
    ConfigurationManifestResource:
      type: object
      additionalProperties: false
      required:
        - kind
        - key
        - path
        - contentSha256
      properties:
        kind:
          $ref: '#/components/schemas/ConfigurationResourceKind'
        key:
          type: string
          format: uuid
          description: Stable portable resource key used by other exported resources.
        path:
          type: string
          description: Path of the resource document in this bundle.
        contentSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
    ConfigurationManifestFile:
      type: object
      additionalProperties: false
      required:
        - path
        - contentSha256
      properties:
        path:
          type: string
          description: Desired resource or source path in this bundle.
        contentSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
    ConfigurationResourceDocument:
      description: Portable connection, partner, mapping, or optional scenario desired-state document. References use stable UUID keys rather than workspace database ids. Scenario resources contain the complete authored document under spec.source; runtime snapshots and evidence are not source configuration.
      oneOf:
        - $ref: '#/components/schemas/ConfigurationAs2ConnectionResourceDocument'
        - $ref: '#/components/schemas/ConfigurationPartnerResourceDocument'
        - $ref: '#/components/schemas/ConfigurationMappingResourceDocument'
        - $ref: '#/components/schemas/ConfigurationScenarioDefinitionResourceDocument'
        - $ref: '#/components/schemas/ConfigurationScenarioBindingResourceDocument'
      discriminator:
        propertyName: kind
        mapping:
          As2Connection: '#/components/schemas/ConfigurationAs2ConnectionResourceDocument'
          Partner: '#/components/schemas/ConfigurationPartnerResourceDocument'
          Mapping: '#/components/schemas/ConfigurationMappingResourceDocument'
          ScenarioDefinition: '#/components/schemas/ConfigurationScenarioDefinitionResourceDocument'
          ScenarioBinding: '#/components/schemas/ConfigurationScenarioBindingResourceDocument'
    ConfigurationScenarioDefinitionResourceDocument:
      title: ModernEDI configuration ScenarioDefinition
      description: Optional scenario configuration in the same reviewed bundle as connections, partners and maps. Retirement removes current configuration without deleting published revisions or run evidence.
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - metadata
        - spec
      properties:
        apiVersion:
          enum:
            - modernedi.com/v1
          type: string
        kind:
          enum:
            - ScenarioDefinition
          type: string
        metadata:
          type: object
          additionalProperties: false
          required:
            - key
          properties:
            key:
              type: string
              format: uuid
              pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
              description: Stable resource key; retain it when copying configuration to another workspace.
        spec:
          type: object
          additionalProperties: false
          required:
            - source
          properties:
            source:
              title: ModernEDI ScenarioDefinition v1
              description: 'Maps define how documents are processed; scenarios define and prove the business conversation those maps implement. A ScenarioDefinition is the portable recipe for that conversation: who exchanges each X12 business document, which documents belong together, what order and repetition are allowed, and what evidence must pass. Tenant partners, syntax trees, mappings, and executable targets belong in a ScenarioBinding.'
              type: object
              additionalProperties: false
              required:
                - apiVersion
                - kind
                - metadata
                - spec
              properties:
                $schema:
                  enum:
                    - https://www.modernedi.com/docs/scenarios/schemas/scenario-definition-v1.schema.json
                  type: string
                  description: Optional portable tooling hint. It does not participate in the definition's canonical content hash.
                apiVersion:
                  enum:
                    - modernedi.com/scenario/v1
                  type: string
                  description: Wire-contract version for the generally available ScenarioDefinition contract.
                kind:
                  enum:
                    - ScenarioDefinition
                  type: string
                  description: Discriminator for a scenario definition document.
                metadata:
                  $ref: '#/components/schemas/ConfigurationScenarioDefinitionMetadata'
                spec:
                  $ref: '#/components/schemas/ConfigurationScenarioDefinitionSpec'
      externalDocs:
        description: Complete JSON Schema, including conditional constraints
        url: https://www.modernedi.com/docs/scenarios/schemas/configuration-scenario-definition-v1.schema.json
    ConfigurationScenarioBindingResourceDocument:
      title: ModernEDI configuration ScenarioBinding
      description: Optional scenario configuration in the same reviewed bundle as connections, partners and maps. Retirement removes current configuration without deleting published revisions or run evidence.
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - metadata
        - spec
      properties:
        apiVersion:
          enum:
            - modernedi.com/v1
          type: string
        kind:
          enum:
            - ScenarioBinding
          type: string
        metadata:
          type: object
          additionalProperties: false
          required:
            - key
          properties:
            key:
              type: string
              format: uuid
              pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
              description: Stable resource key; retain it when copying configuration to another workspace.
        spec:
          type: object
          additionalProperties: false
          required:
            - source
          properties:
            source:
              title: ModernEDI ScenarioBinding v1
              description: A tenant-scoped authoring binding that connects every actor and step in one immutable ScenarioDefinition to current workspace partners and executable targets. It references tenant artifacts by identity and contains no copied runtime configuration, credentials, private keys, or other secrets.
              type: object
              additionalProperties: false
              required:
                - apiVersion
                - kind
                - metadata
                - spec
              properties:
                $schema:
                  enum:
                    - https://www.modernedi.com/docs/scenarios/schemas/scenario-binding-v1.schema.json
                  type: string
                  description: Optional portable tooling hint. It does not participate in the binding's canonical content hash.
                apiVersion:
                  enum:
                    - modernedi.com/scenario-binding-authoring/v1
                  type: string
                  description: Wire-contract version for tenant-authored scenario bindings.
                kind:
                  enum:
                    - ScenarioBinding
                  type: string
                  description: Discriminator for a scenario binding document.
                metadata:
                  $ref: '#/components/schemas/ConfigurationScenarioBindingMetadata'
                spec:
                  $ref: '#/components/schemas/ConfigurationScenarioBindingSpec'
      externalDocs:
        description: Complete JSON Schema, including conditional constraints
        url: https://www.modernedi.com/docs/scenarios/schemas/configuration-scenario-binding-v1.schema.json
    ConfigurationAs2ConnectionResourceDocument:
      description: Portable desired state for one AS2 connection.
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - metadata
        - spec
      properties:
        apiVersion:
          $ref: '#/components/schemas/ConfigurationDocumentApiVersion'
        kind:
          type: string
          enum:
            - As2Connection
        metadata:
          $ref: '#/components/schemas/ConfigurationResourceMetadata'
        spec:
          $ref: '#/components/schemas/ConfigurationAs2ConnectionSpec'
    ConfigurationAs2ConnectionSpec:
      description: Complete resolved AS2 configuration without its server database id or API ETag. Exports reference public partner certificates beside connection.json. Inline public certificates are also accepted for API-authored and retained historical bundles. Private keys and secret locations are never included.
      type: object
      additionalProperties: false
      required:
        - environments
        - outbound
        - functionalAcknowledgment
        - mdn
        - cmsAlgorithmProtection
        - digestCanonicalizationPolicy
      properties:
        environments:
          $ref: '#/components/schemas/ConfigurationAs2Environments'
        outbound:
          $ref: '#/components/schemas/As2ResolvedOutboundSettings'
        functionalAcknowledgment:
          $ref: '#/components/schemas/As2ResolvedFunctionalAcknowledgmentSettings'
        mdn:
          $ref: '#/components/schemas/As2ResolvedMdnSettings'
        cmsAlgorithmProtection:
          type: boolean
          description: Effective RFC 6211 `cmsAlgorithmProtect` compatibility setting.
        digestCanonicalizationPolicy:
          type: string
          enum:
            - AUTO
            - CANONICALIZE
            - PRESERVE
          description: Effective inbound signature-verification treatment of MIME line endings.
    ConfigurationAs2Environments:
      type: object
      additionalProperties: false
      required:
        - production
        - test
      properties:
        production:
          $ref: '#/components/schemas/ConfigurationAs2Environment'
        test:
          oneOf:
            - $ref: '#/components/schemas/ConfigurationAs2Environment'
            - type: object
              nullable: true
              enum:
                - null
    ConfigurationAs2Environment:
      description: An environment has either one inline public certificate or a file reference, never both. File references are confined to this connection. Production and Test may share one file; replacing it changes both environments' certificates.
      oneOf:
        - $ref: '#/components/schemas/As2PartnerEnvironmentResolved'
        - $ref: '#/components/schemas/ConfigurationAs2FileEnvironment'
    ConfigurationAs2FileEnvironment:
      type: object
      additionalProperties: false
      required:
        - as2Identifier
        - endpointUrl
        - publicCertificatePath
        - publicCertificateSha256
        - requireSignature
        - requireEncryption
      properties:
        as2Identifier:
          type: string
          minLength: 1
        endpointUrl:
          type: string
          format: uri
          nullable: true
          maxLength: 2000
          description: The same publicly routable destination and workspace plan restrictions as the partner form apply.
        publicCertificatePath:
          type: string
          pattern: ^\./certificates/[a-z0-9][a-z0-9_-]{0,63}\.pem(?![\s\S])
          example: ./certificates/shared.pem
          description: Relative to connection.json. Production and Test may reference the same file. The file name uses 1-64 lowercase letters, digits, hyphens or underscores and starts with a letter or digit. No absolute paths, URLs, traversal, subdirectories, or other connections. Exports use shared.pem when both environments have the same certificate; otherwise production.pem and test.pem.
        publicCertificateSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
        requireSignature:
          type: boolean
        requireEncryption:
          type: boolean
    ConfigurationPartnerResourceDocument:
      description: Portable desired state for one active trading partner.
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - metadata
        - spec
      properties:
        apiVersion:
          $ref: '#/components/schemas/ConfigurationDocumentApiVersion'
        kind:
          type: string
          enum:
            - Partner
        metadata:
          $ref: '#/components/schemas/ConfigurationResourceMetadata'
        spec:
          $ref: '#/components/schemas/ConfigurationPartnerSpec'
    ConfigurationPartnerSpec:
      description: Complete persisted partner configuration. It replaces `as2ConnectionId` with a portable `as2ConnectionKey` and includes advanced runtime compatibility settings that participate in workspace configuration.
      type: object
      additionalProperties: false
      required:
        - name
        - as2ConnectionKey
        - x12
        - ediSupportEmail
        - carbonCopyOnly
        - implementationAcknowledgmentEnabled
        - unmappedInboundPolicy
        - signingCertificateSlot
        - supportsNewlineAfterSegmentTerminator
        - overrideUserAgentString
        - overrideSeparatorSet
        - messageTypeGsVersionOverrides
      properties:
        name:
          type: string
          minLength: 1
          description: Unique partner display name in this workspace.
        as2ConnectionKey:
          type: string
          format: uuid
          nullable: true
          description: Portable key of the referenced AS2 connection, or `null` for a detached map-authoring draft.
        x12:
          description: Current production and optional test X12 identities. Detached drafts may contain incomplete authoring values.
          anyOf:
            - $ref: '#/components/schemas/PartnerX12Identities'
            - $ref: '#/components/schemas/PartnerDraftX12Identities'
        ediSupportEmail:
          type: string
          description: Partner EDI support address, or an empty string when unavailable.
        carbonCopyOnly:
          type: boolean
        implementationAcknowledgmentEnabled:
          type: boolean
          description: Whether eligible inbound documents receive a 999 instead of a 997.
        unmappedInboundPolicy:
          type: string
          enum:
            - MAPPED_ONLY
            - PASSTHROUGH_RAW_X12
        signingCertificateSlot:
          type: string
          enum:
            - active
            - next
        supportsNewlineAfterSegmentTerminator:
          type: boolean
        overrideUserAgentString:
          type: string
          nullable: true
          description: Optional AS2 HTTP User-Agent compatibility override.
        overrideSeparatorSet:
          description: Optional X12 separator override, or `null` to use runtime defaults.
          oneOf:
            - $ref: '#/components/schemas/ConfigurationPartnerSeparatorSet'
            - type: object
              nullable: true
              enum:
                - null
        messageTypeGsVersionOverrides:
          type: object
          additionalProperties:
            type: string
          description: Closed runtime compatibility map from supported X12 message-type names to GS08 version overrides. An empty object means no overrides.
    ConfigurationPartnerSeparatorSet:
      type: object
      additionalProperties: false
      required:
        - elementSeparator
        - subElementSeparator
        - segmentTerminator
        - repetitionSeparator
      properties:
        elementSeparator:
          type: string
          minLength: 1
          maxLength: 1
        subElementSeparator:
          type: string
          minLength: 1
          maxLength: 1
        segmentTerminator:
          type: string
          minLength: 1
          maxLength: 1
        repetitionSeparator:
          type: string
          minLength: 1
          maxLength: 1
          nullable: true
          description: Repetition separator, or `null` when the selected X12 version does not use one.
    ConfigurationMappingResourceDocument:
      description: Portable desired state for one published mapping. Executable source is stored in the separately hashed `SOURCE` file named by the transform.
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - metadata
        - spec
      properties:
        apiVersion:
          $ref: '#/components/schemas/ConfigurationDocumentApiVersion'
        kind:
          type: string
          enum:
            - Mapping
        metadata:
          $ref: '#/components/schemas/ConfigurationResourceMetadata'
        spec:
          $ref: '#/components/schemas/ConfigurationMappingSpec'
    ConfigurationMappingSpec:
      description: Published mapping configuration without its database id, API ETag, or server-resolved syntax-tree provenance. The partner reference and source reference are portable bundle values.
      type: object
      additionalProperties: false
      required:
        - partnerKey
        - direction
        - x12Version
        - functionalIdentifierCode
        - transactionSetIdentifierCode
        - transform
        - output
        - runtime
      properties:
        regressionCases:
          type: array
          minItems: 1
          maxItems: 10
          description: |
            Optional saved editor tests. Omit when empty; sort by unique case id. The canonical JSON array must fit within 256 KiB. Fixtures enter configuration and Git history, so use sanitized sample data. Editing only these cases does not change the live mapping or refresh scenario bindings. Stored cases do not assert a passing result and do not gate apply.
          items:
            $ref: '#/components/schemas/MappingRegressionCase'
        partnerKey:
          type: string
          format: uuid
          description: Portable key of the partner resource this mapping handles.
        direction:
          type: string
          enum:
            - INCOMING
            - OUTGOING
        x12Version:
          type: string
          description: Normalized X12 version, such as `4010`.
        functionalIdentifierCode:
          type: string
          description: X12 GS01 functional identifier enum name.
        transactionSetIdentifierCode:
          type: string
          description: X12 ST01 transaction-set identifier without a leading underscore.
        transform:
          $ref: '#/components/schemas/ConfigurationMappingTransform'
        output:
          $ref: '#/components/schemas/ConfigurationMappingOutput'
        businessKey:
          $ref: '#/components/schemas/MappingBusinessKey'
        deliveredMetadata:
          $ref: '#/components/schemas/MappingDeliveredMetadata'
        runtime:
          $ref: '#/components/schemas/ConfigurationMappingRuntime'
    ConfigurationMappingOutput:
      description: |
        Desired delivery behavior preserved in portable mapping configuration. Unlike the read-only delivery field on mapping responses, this field is part of the hashed configuration submitted for plan and apply. Incoming maps use MAPPED_OUTPUTS or TRANSACTION_RECORD; outgoing maps use OUTBOUND_AS2.
      allOf:
        - $ref: '#/components/schemas/MappingOutput'
        - type: object
          required:
            - delivery
          properties:
            delivery:
              $ref: '#/components/schemas/MappingOutputDelivery'
    MappingRegressionCase:
      description: |
        An exact-output test for the existing Mapper engines. Whitespace, line endings, ordering, and delimiters are significant. Incoming X12 Mapper requires application/edi-x12 and null params; its zero-based group and transaction selectors may be null. Outgoing JSLT/XSLT requires JSON/XML input and null selectors; params is an object or null. Outgoing cases may additionally select validateX12 to check the generated document against the mapping's X12 specification using the normal preview/send envelope preparation. No execution results or timestamps belong in this source document.
      type: object
      additionalProperties: false
      x-json-schema-rules:
        - if:
            properties:
              contentType:
                const: application/edi-x12
          then:
            properties:
              params:
                type: 'null'
              validateX12:
                const: false
          else:
            properties:
              functionalGroupIndex:
                type: 'null'
              transactionIndex:
                type: 'null'
      required:
        - id
        - name
        - comparison
        - input
        - contentType
        - params
        - functionalGroupIndex
        - transactionIndex
        - expectedOutput
      properties:
        id:
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,63}$
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
        comparison:
          type: string
          enum:
            - EXACT_TEXT
        validateX12:
          type: boolean
          description: Optional outgoing-only document validation in addition to exact-text comparison. Defaults to false when omitted. Complete document bodies are wrapped for validation; partial fragments need not opt in. Does not send EDI or prove business correctness or partner acceptance.
        input:
          type: string
          maxLength: 65536
        contentType:
          type: string
          enum:
            - application/edi-x12
            - application/json
            - application/xml
            - text/xml
        params:
          type: object
          nullable: true
          additionalProperties: true
        functionalGroupIndex:
          type: integer
          nullable: true
          minimum: 0
          maximum: 2147483647
        transactionIndex:
          type: integer
          nullable: true
          minimum: 0
          maximum: 2147483647
        expectedOutput:
          type: string
          maxLength: 65536
    ConfigurationMappingRuntime:
      description: |
        Exact advanced runtime values preserved by workspace authoring and deterministic export. Incoming mappings contain `activeAttributes`; outgoing mappings contain `extraFields`. Most integrations should use the stable `deliveredMetadata` and `output.delivery` fields instead. These maps exist so source-control exports do not discard established runtime behavior that is outside the closed customer-facing selectors.
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        activeAttributes:
          type: object
          description: Complete incoming runtime attribute selection, keyed by the established mapping-runtime attribute name.
          additionalProperties:
            type: boolean
        extraFields:
          type: object
          description: Complete outgoing runtime metadata preserved with the transform.
          additionalProperties:
            type: string
    ConfigurationMappingTransform:
      type: object
      additionalProperties: false
      required:
        - type
        - fileName
        - sourcePath
        - sourceSha256
      properties:
        type:
          type: string
          enum:
            - X12_MAPPER
            - XSLT
            - JSLT
          description: Executable mapping language.
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Source-controlled transform filename shown in workspace and transaction provenance.
        sourcePath:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9._/-]+$
          description: Relative path of the corresponding `SOURCE` file in this bundle.
        sourceSha256:
          allOf:
            - $ref: '#/components/schemas/ConfigurationSha256'
          description: SHA-256 of the exact UTF-8 mapping source bytes at `sourcePath`.
    ConfigurationResourceMetadata:
      type: object
      additionalProperties: false
      required:
        - key
      properties:
        key:
          type: string
          format: uuid
          description: Stable portable identity for this resource.
    ConfigurationSnapshotState:
      description: Observed server state stored at `_state/snapshot.json`. It relates portable resource keys to current workspace ids, API ETags, and exported resource hashes.
      type: object
      additionalProperties: false
      required:
        - apiVersion
        - kind
        - runtimeConfigurationRevision
        - bundleSha256
        - resources
      properties:
        apiVersion:
          $ref: '#/components/schemas/ConfigurationDocumentApiVersion'
        kind:
          type: string
          enum:
            - IntegrationConfigurationSnapshot
        runtimeConfigurationRevision:
          type: integer
          format: int64
          minimum: 0
          description: Monotonic workspace runtime-configuration revision observed by this export transaction.
        bundleSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
        resources:
          type: array
          description: Observed resource state sorted by kind and portable key.
          items:
            $ref: '#/components/schemas/ConfigurationSnapshotResource'
    ConfigurationSnapshotResource:
      type: object
      additionalProperties: false
      required:
        - kind
        - key
        - resourceId
        - contentSha256
        - apiEtag
      properties:
        kind:
          $ref: '#/components/schemas/ConfigurationResourceKind'
        key:
          type: string
          format: uuid
          description: Stable portable identity from the corresponding resource document.
        resourceId:
          type: integer
          minimum: 1
          description: Current workspace-scoped database id used by the existing per-resource Integration API endpoints.
        contentSha256:
          $ref: '#/components/schemas/ConfigurationSha256'
        apiEtag:
          type: string
          pattern: ^"[0-9a-f]{64}"$
          description: Current quoted ETag from the corresponding partner, AS2 connection, or mapping API representation.
    PartnerListResponse:
      description: Successful response containing active trading-partner configurations in this workspace.
      type: object
      required:
        - success
        - partners
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; failures use the documented error response instead.
        partners:
          type: array
          description: Active configured trading partners for this tenant, ordered by partner id. Retired partners are excluded.
          items:
            $ref: '#/components/schemas/PartnerConfiguration'
    IntegrationPartner:
      type: object
      required:
        - partnerId
        - name
        - as2ConnectionConfigured
        - productionReady
        - testReady
        - carbonCopyOnly
        - implementationAcknowledgmentEnabled
        - as2ConnectionId
        - ediSupportEmail
        - unmappedInboundPolicy
        - signingCertificateSlot
        - supportsNewlineAfterSegmentTerminator
        - overrideUserAgentString
        - overrideSeparatorSet
        - messageTypeGsVersionOverrides
        - x12
      properties:
        partnerId:
          type: integer
          description: Stable tenant-scoped partner id. Use this value as the `partnerId` query parameter for exact outbound map selection.
          example: 1
        name:
          type: string
          description: Configured partner display name. Use `partnerId` for outbound selection.
          example: Customer One
        as2ConnectionId:
          type: integer
          nullable: true
          description: Tenant-scoped partner AS2 connection id, or `null` while connection details are not yet available.
          example: 12
        as2ConnectionConfigured:
          type: boolean
          description: True when this partner is attached to an AS2 connection profile. The profile may be inbound-only and therefore is not necessarily ready for outbound delivery.
        productionReady:
          type: boolean
          description: True when the partner has a complete production AS2 identifier and certificate, destination URL, and X12 identity, so outbound production delivery can be attempted.
        testReady:
          type: boolean
          description: True when the partner has a complete test AS2 identifier and certificate, destination URL, and X12 identity, so outbound test delivery can be attempted. False is valid for a production-only or inbound-only partner.
        carbonCopyOnly:
          type: boolean
          description: True when the partner is intended only as a carbon-copy recipient in the workspace.
        implementationAcknowledgmentEnabled:
          type: boolean
          description: |
            Whether ModernEDI sends X12 999 implementation acknowledgments for this partner's 005010-and-later documents instead of automatic 997s. Earlier X12 versions continue to receive 997s. Enable this only when the partner requests 999s. A 999 reports X12 syntax and relational validation. It does not indicate semantic or business acceptance, and it is not HIPAA implementation-guide certification.
        ediSupportEmail:
          type: string
          description: Partner EDI support address, or an empty string when one has not been recorded.
          example: edi@customer-one.example
        unmappedInboundPolicy:
          type: string
          enum:
            - MAPPED_ONLY
            - PASSTHROUGH_RAW_X12
          description: Whether inbound transactions without a matching map are rejected from mapped-output delivery or persisted as raw X12.
        signingCertificateSlot:
          type: string
          enum:
            - active
            - next
          description: Tenant certificate slot ModernEDI uses to sign AS2 traffic for this partner.
        supportsNewlineAfterSegmentTerminator:
          type: boolean
          description: Whether ModernEDI may emit a newline after each X12 segment terminator for this partner.
        overrideUserAgentString:
          type: string
          nullable: true
          description: Optional AS2 HTTP User-Agent compatibility override, or `null` to use the ModernEDI default.
        overrideSeparatorSet:
          description: Optional X12 separator override, or `null` to use the separators selected by the mapping runtime.
          oneOf:
            - $ref: '#/components/schemas/ConfigurationPartnerSeparatorSet'
            - type: object
              nullable: true
              enum:
                - null
        messageTypeGsVersionOverrides:
          type: object
          additionalProperties:
            type: string
          description: Map from functional-group type to the exact GS08 version string required by this partner. An empty object uses each map's normal X12 version.
        x12:
          description: Connected partners satisfy `PartnerX12Identities`; detached drafts may contain incomplete authoring values until an AS2 connection is attached.
          anyOf:
            - $ref: '#/components/schemas/PartnerX12Identities'
            - $ref: '#/components/schemas/PartnerDraftX12Identities'
        etag:
          type: string
          description: Quoted SHA-256 ETag over mutable partner configuration, present on list and configuration detail responses. Derived `as2ConnectionConfigured`, `productionReady`, and `testReady` values are excluded; changes to the referenced AS2 connection are guarded by that connection's own ETag.
    PartnerX12Identities:
      type: object
      required:
        - production
        - test
      description: Production is always configured. Test is `null` for a production-only partner.
      properties:
        production:
          description: Complete production X12 sender identity for this connected partner.
          $ref: '#/components/schemas/PartnerX12Identity'
        test:
          description: Complete test X12 sender identity, or `null` when this partner has no separate test identity.
          oneOf:
            - $ref: '#/components/schemas/PartnerX12Identity'
            - type: object
              nullable: true
              enum:
                - null
    PartnerX12Identity:
      type: object
      required:
        - isaQualifier
        - isaId
        - gsId
      properties:
        isaQualifier:
          type: string
          minLength: 2
          maxLength: 2
          description: ISA qualifier ModernEDI expects for this partner in the selected environment. Connected partners always use exactly 2 characters; detached draft values may be incomplete.
          example: ZZ
        isaId:
          type: string
          minLength: 1
          maxLength: 15
          description: ISA id ModernEDI expects for this partner in the selected environment. Connected partners always use between 1 and 15 characters inclusive; detached draft values may be incomplete.
          example: CUSTOMERONE
        gsId:
          type: string
          minLength: 1
          maxLength: 15
          description: GS sender or receiver id configured for this partner in the selected environment. Connected partners always use between 1 and 15 characters inclusive; detached draft values may be incomplete.
          example: CUSTOMERONE
    PartnerDraftX12Identities:
      type: object
      description: Resolved authoring values returned for a detached partner draft. Production fields may remain incomplete until an AS2 connection is attached. Test is `null` when no test identity has been entered.
      required:
        - production
        - test
      properties:
        production:
          description: Current production authoring values, which may be incomplete until transport is attached.
          $ref: '#/components/schemas/PartnerDraftX12Identity'
        test:
          description: Current test authoring values, or `null` when no test identity has been entered.
          oneOf:
            - $ref: '#/components/schemas/PartnerDraftX12Identity'
            - type: object
              nullable: true
              enum:
                - null
    PartnerDraftX12Identity:
      type: object
      required:
        - isaQualifier
        - isaId
        - gsId
      properties:
        isaQualifier:
          type: string
          description: Draft ISA qualifier. Attaching an AS2 connection requires exactly 2 characters.
        isaId:
          type: string
          description: Draft ISA id. Attaching an AS2 connection requires between 1 and 15 characters inclusive.
        gsId:
          type: string
          description: Draft GS id. Attaching an AS2 connection requires between 1 and 15 characters inclusive.
    PartnerConfiguration:
      allOf:
        - $ref: '#/components/schemas/IntegrationPartner'
        - type: object
          required:
            - etag
    PartnerResponse:
      description: Successful response containing one current trading-partner configuration.
      type: object
      required:
        - success
        - partner
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; failures use the documented error response instead.
        partner:
          description: Complete persisted partner configuration with an ETag identifying the observed resource version.
          $ref: '#/components/schemas/PartnerConfiguration'
    PartnerCapabilitiesResponse:
      description: Published incoming and outgoing mapping capabilities available for one partner.
      type: object
      required:
        - success
        - partner
        - capabilities
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; failures use the documented error response instead.
        partner:
          description: Partner identity and readiness context for the capability list.
          $ref: '#/components/schemas/IntegrationPartner'
        capabilities:
          type: object
          description: Published maps grouped by the direction in which data crosses the partner boundary.
          required:
            - incoming
            - outgoing
          properties:
            incoming:
              type: array
              description: Maps that transform inbound partner X12 into application-facing mapped outputs.
              items:
                $ref: '#/components/schemas/PartnerMappingCapability'
            outgoing:
              type: array
              description: Maps that transform application payloads into outbound partner X12.
              items:
                $ref: '#/components/schemas/PartnerMappingCapability'
    PartnerMappingCapability:
      description: One published map advertised as an integration capability for a partner.
      type: object
      required:
        - mappingId
        - direction
        - x12Version
        - transactionSet
        - transformType
        - mappingSha256
        - published
      properties:
        mappingId:
          type: integer
          description: Stable workspace-scoped mapping identifier used by mapping configuration operations.
        direction:
          type: string
          description: '`incoming` consumes partner X12; `outgoing` produces partner X12.'
          enum:
            - incoming
            - outgoing
        x12Version:
          type: string
          description: Numeric X12 implementation version matched or generated by this map.
          example: '4010'
        functionalGroupType:
          type: string
          nullable: true
          description: GS01 functional identifier used for outgoing selection, or `null` when it is not part of the map key.
          example: PO
        transactionSet:
          type: string
          description: ST01 transaction-set identifier matched or generated by this map.
          example: '850'
        contentType:
          type: string
          nullable: true
          description: Source content type for outgoing maps or mapped-output content type for incoming maps.
          example: application/json
        transformType:
          type: string
          description: |
            Published transform implementation: `X12_MAPPER`, `XSLT`, or `JSLT`.
          example: JSLT
        purpose:
          type: string
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MappingPurpose'
        mappingSha256:
          type: string
          description: Base64-encoded SHA-256 hash of the published map contents.
          example: 5vG51TfOLEo9YN0WSMf0bj+xzluq2UptTm4flVSo8EE=
        published:
          type: boolean
          enum:
            - true
          description: Always `true` because unpublished drafts are not exposed as partner capabilities.
    As2ProfileResponse:
      description: Successful response containing the workspace AS2 identity, endpoints, network addresses, and certificates.
      type: object
      required:
        - success
        - profile
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; failures use the documented error response instead.
        profile:
          description: Workspace-facing AS2 profile to exchange with trading partners and security teams.
          $ref: '#/components/schemas/As2Profile'
    As2Profile:
      description: ModernEDI-hosted AS2 identity and network information for production and test traffic.
      type: object
      required:
        - domainName
        - environments
        - network
        - certificates
      properties:
        domainName:
          type: string
          nullable: true
          description: Provisioned tenant AS2 hostname, or `null` while the tenant runtime has not published one.
          example: edi.customer.example
        environments:
          type: object
          description: Environment-specific inbound endpoints and ModernEDI sender identities.
          required:
            - production
            - test
          properties:
            production:
              description: Production endpoints and sender identity; individual fields may be `null` while provisioning is incomplete.
              $ref: '#/components/schemas/As2EnvironmentProfile'
            test:
              description: Isolated test endpoints and sender identity; fields may be `null` when no test runtime is available.
              $ref: '#/components/schemas/As2EnvironmentProfile'
        network:
          description: Provisioning, TLS, and static-address capabilities customers should share with partner network teams.
          $ref: '#/components/schemas/As2NetworkProfile'
        certificates:
          type: object
          description: Public signing/encryption certificates ModernEDI may present for this workspace.
          required:
            - active
            - next
          properties:
            active:
              type: object
              nullable: true
              description: Current certificate to configure at partners, or `null` before certificate provisioning completes.
              allOf:
                - $ref: '#/components/schemas/As2PublicCertificate'
            next:
              type: object
              nullable: true
              description: Staged rollover certificate, or `null` when no certificate rotation is in progress.
              allOf:
                - $ref: '#/components/schemas/As2PublicCertificate'
    As2EnvironmentProfile:
      description: ModernEDI endpoint and X12 sender identity for one workspace environment.
      type: object
      required:
        - as2Url
        - as2Identifier
        - x12Sender
      properties:
        as2Url:
          type: string
          format: uri
          nullable: true
          description: HTTPS AS2 receive URL to configure at the partner, or `null` while the endpoint is unavailable.
        httpAs2Url:
          type: string
          format: uri
          description: Plain-HTTP endpoint when included in the tenant's plan and provisioned.
        as2Identifier:
          type: string
          nullable: true
          description: ModernEDI AS2 identifier sent as `AS2-From` and expected as inbound `AS2-To`, or `null` while unprovisioned.
        x12Sender:
          type: object
          description: ModernEDI X12 envelope identity for documents sent from this environment.
          required:
            - isaQualifier
            - isaId
            - gsId
          properties:
            isaQualifier:
              type: string
              nullable: true
              description: ISA05/ISA07 qualifier for ModernEDI's environment identity, or `null` while unprovisioned.
            isaId:
              type: string
              nullable: true
              description: ISA06/ISA08 identifier for ModernEDI's environment identity, or `null` while unprovisioned.
            gsId:
              type: string
              nullable: true
              description: GS02/GS03 identifier for ModernEDI's environment identity, or `null` while unprovisioned.
    As2NetworkProfile:
      description: Current tenant-runtime network and certificate provisioning state.
      type: object
      required:
        - provisioningStatus
        - tlsCertificateStatus
        - staticInbound
        - staticOutbound
      properties:
        provisioningStatus:
          type: string
          nullable: true
          description: Latest tenant-runtime provisioning state, or `null` before a status has been recorded.
        tlsCertificateStatus:
          type: string
          nullable: true
          description: Latest TLS certificate deployment state for the AS2 hostname, or `null` when unavailable.
        staticInbound:
          description: Fixed public destination addresses available for partners that require inbound IP allowlisting.
          $ref: '#/components/schemas/As2NetworkCapability'
        staticOutbound:
          description: Fixed public source addresses seen by partners receiving ModernEDI AS2 traffic.
          $ref: '#/components/schemas/As2NetworkCapability'
    As2NetworkCapability:
      description: Availability and advertised addresses for one static-network capability.
      type: object
      required:
        - status
        - addresses
      properties:
        status:
          type: string
          description: '`ready` means addresses may be allowlisted, `pending` means provisioning is incomplete, and `not_included` means the plan does not include the capability.'
          enum:
            - ready
            - pending
            - not_included
        addresses:
          type: array
          description: Public IP addresses to give the partner; empty until ready or when the capability is not included.
          items:
            type: string
            description: Public IPv4 or IPv6 address for partner allowlists.
    As2PublicCertificate:
      description: Public half of a ModernEDI AS2 signing/encryption certificate; private keys are never exposed.
      type: object
      required:
        - slot
        - publicCertPem
      properties:
        slot:
          type: string
          description: 'Certificate lifecycle slot: `active` is in service and `next` is staged for partner-by-partner rollover.'
          enum:
            - active
            - next
        subjectDn:
          type: string
          nullable: true
          description: X.509 subject distinguished name, or `null` when certificate parsing did not provide it.
        issuerDn:
          type: string
          nullable: true
          description: X.509 issuer distinguished name, or `null` when certificate parsing did not provide it.
        serialNumber:
          type: string
          nullable: true
          description: Certificate serial number rendered for partner correlation, or `null` when unavailable.
        fingerprintSha256:
          type: string
          nullable: true
          description: SHA-256 certificate fingerprint for out-of-band verification, or `null` when unavailable.
        notBefore:
          $ref: '#/components/schemas/NullableUtcTimestamp'
        notAfter:
          $ref: '#/components/schemas/NullableUtcTimestamp'
        publicCertPem:
          type: string
          description: PEM-encoded public certificate safe to share with trading partners.
    As2ConnectionListResponse:
      description: Successful response containing every AS2 connection configured in the authenticated workspace.
      type: object
      required:
        - success
        - connections
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; failures use the documented error response instead.
        connections:
          type: array
          description: Complete AS2 connection configurations, including environment profiles, transport settings, and configuration ETags.
          items:
            $ref: '#/components/schemas/As2ConnectionConfiguration'
    As2ConnectionResponse:
      description: Successful response containing one complete AS2 connection configuration.
      type: object
      required:
        - success
        - connection
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; failures use the documented error response instead.
        connection:
          description: Current persisted connection after defaults have been resolved.
          $ref: '#/components/schemas/As2ConnectionConfiguration'
    As2ConnectionConfiguration:
      description: Complete persisted AS2 connection returned by configuration operations.
      type: object
      additionalProperties: false
      required:
        - connectionId
        - environments
        - outbound
        - functionalAcknowledgment
        - mdn
        - cmsAlgorithmProtection
        - digestCanonicalizationPolicy
        - etag
      properties:
        connectionId:
          type: integer
          minimum: 1
          description: Stable workspace-scoped identifier used when attaching partners or updating this connection.
        environments:
          $ref: '#/components/schemas/As2ConnectionResolvedEnvironments'
        outbound:
          $ref: '#/components/schemas/As2ResolvedOutboundSettings'
        functionalAcknowledgment:
          $ref: '#/components/schemas/As2ResolvedFunctionalAcknowledgmentSettings'
        mdn:
          $ref: '#/components/schemas/As2ResolvedMdnSettings'
        cmsAlgorithmProtection:
          type: boolean
          description: Effective RFC 6211 `cmsAlgorithmProtect` compatibility setting for signed outbound messages and MDNs.
        digestCanonicalizationPolicy:
          type: string
          enum:
            - AUTO
            - CANONICALIZE
            - PRESERVE
          description: Effective inbound signature-verification treatment of MIME line endings.
        etag:
          type: string
          description: Quoted SHA-256 identity of the observed AS2 connection configuration. Changes use the aggregate export–plan–apply workflow.
    As2ResolvedOutboundSettings:
      description: Fully resolved outbound algorithms and compatibility settings; all fields are present in responses.
      allOf:
        - $ref: '#/components/schemas/As2OutboundTransportSettings'
        - type: object
          required:
            - signingAlgorithm
            - encryptionAlgorithm
            - compressionAlgorithm
            - micAlgorithm
            - micAlgorithmFormat
    As2ResolvedFunctionalAcknowledgmentSettings:
      description: Fully resolved MIME packaging for automatic X12 acknowledgments (997 or partner-enabled 999).
      allOf:
        - $ref: '#/components/schemas/As2FunctionalAcknowledgmentSettings'
        - type: object
          required:
            - messageStructure
    As2ResolvedMdnSettings:
      description: Fully resolved Message Disposition Notification compatibility settings.
      allOf:
        - $ref: '#/components/schemas/As2MdnSettings'
        - type: object
          required:
            - encrypt
            - forceSynchronousForErrors
    As2PartnerEnvironment:
      type: object
      additionalProperties: false
      required:
        - as2Identifier
        - publicCertificatePem
      properties:
        as2Identifier:
          type: string
          minLength: 1
          description: Partner's environment-specific AS2 identifier. ModernEDI matches it as inbound `AS2-From` and sends it as outbound `AS2-To`.
          example: RETAILER_PROD
        endpointUrl:
          type: string
          format: uri
          maxLength: 2000
          nullable: true
          description: Optional outbound destination. Omit it or use `null` for an inbound-only profile. When present, it must be an absolute HTTP or HTTPS partner destination URL without user information or a fragment. Endpoint workspaces must use HTTPS; plain HTTP requires Endpoint Plus, Static Outbound, Static Network, or Enterprise. The host must be publicly routable; local, private, link-local, multicast, carrier-grade NAT, documentation, benchmark, and other reserved address targets are rejected.
          example: https://as2.retailer.example/receive
        publicCertificatePem:
          type: string
          description: Exactly one PEM-encoded partner X.509 public certificate. ModernEDI canonicalizes it before storage.
          example: |-
            -----BEGIN CERTIFICATE-----
            MIIB...partner-public-certificate...
            -----END CERTIFICATE-----
        requireSignature:
          type: boolean
          default: true
          description: When `true` (the secure default), ModernEDI rejects non-MDN inbound messages for this environment unless the sender signature is present and successfully verified with the configured certificate. This policy belongs to the AS2 connection/environment and therefore applies to every attached partner on a shared or VAN connection. Set `false` only for a documented connection-wide exception. Omission on create resolves to `true`; resolved connection responses always include the field.
        requireEncryption:
          type: boolean
          default: true
          description: When `true` (the secure default), ModernEDI rejects non-MDN inbound messages for this environment unless their encrypted content was successfully decrypted. This policy belongs to the AS2 connection/environment and therefore applies to every attached partner on a shared or VAN connection. Set `false` only for a documented connection-wide exception. Omission on create resolves to `true`; resolved connection responses always include the field.
    As2PartnerEnvironmentResolved:
      description: Persisted AS2 partner environment with all secure inbound-protection defaults resolved.
      allOf:
        - $ref: '#/components/schemas/As2PartnerEnvironment'
        - type: object
          required:
            - requireSignature
            - requireEncryption
    As2ConnectionResolvedEnvironments:
      type: object
      additionalProperties: false
      description: Fully resolved partner environments. Every non-null environment includes its effective inbound signature and encryption requirements.
      required:
        - production
        - test
      properties:
        production:
          $ref: '#/components/schemas/As2PartnerEnvironmentResolved'
        test:
          description: Fully resolved test environment, or `null` when no test profile is configured.
          oneOf:
            - $ref: '#/components/schemas/As2PartnerEnvironmentResolved'
            - type: object
              nullable: true
              enum:
                - null
    As2OutboundTransportSettings:
      type: object
      additionalProperties: false
      description: Optional outbound AS2 algorithms and MIME-compatibility controls. Each omitted field receives its documented default.
      properties:
        signingAlgorithm:
          type: string
          enum:
            - SHA256WITHRSA
            - SHA384WITHRSA
            - SHA512WITHRSA
            - SHA1WITHRSA
          default: SHA256WITHRSA
          description: CMS/S/MIME signature algorithm ModernEDI uses for signed outbound payloads, signed automatic X12 acknowledgments, and signed MDNs. Prefer `SHA256WITHRSA`; use `SHA1WITHRSA` only for a legacy partner that cannot verify SHA-2 signatures.
          example: SHA256WITHRSA
        encryptionAlgorithm:
          type: string
          enum:
            - AES256_CBC
            - AES128_CBC
            - DES_EDE3_CBC
          default: AES256_CBC
          description: CMS content-encryption algorithm for outbound AS2 payloads and any encrypted acknowledgments. Prefer `AES256_CBC`; `DES_EDE3_CBC` exists only for legacy partner interoperability.
          example: AES256_CBC
        compressionAlgorithm:
          type: string
          enum:
            - ZLIB
          default: ZLIB
          description: Compression algorithm used when an outbound AS2 message structure includes compression. `ZLIB` is the only supported customer-selectable value.
          example: ZLIB
        micAlgorithm:
          type: string
          enum:
            - SHA_1
            - SHA_256
            - SHA_512
          default: SHA_256
          description: Digest algorithm used to calculate and store ModernEDI's local content MIC for outbound X12 payloads and automatic X12 acknowledgments. This does not choose the CMS signature digest (`signingAlgorithm` does), the signed MIME `micalg` token format (`micAlgorithmFormat` does), or the `Received-content-MIC` algorithm used when ModernEDI returns an MDN for an inbound message; that comes from the sender's receipt request.
        micAlgorithmFormat:
          type: string
          enum:
            - RFC_5751
            - RFC_3851
          default: RFC_3851
          description: Advanced partner-compatibility override for the S/MIME `Content-Type` `micalg` parameter on every signed MIME entity ModernEDI generates for this partner, including outbound X12 messages, automatic signed X12 acknowledgments, and the outer wrapper of signed MDNs. `RFC_5751` uses the newer hyphenated token format—for example, `sha-256`—while `RFC_3851` uses the older token `sha256`. Omit this field to use the compatibility-first `RFC_3851` default. This setting changes only the serialized notation of the signature digest selected by `signingAlgorithm` in that MIME parameter; it does not change the digest itself or the algorithm named inside `Received-content-MIC`. Change it only when the partner's AS2 profile or interoperability testing requires a particular token format.
    As2FunctionalAcknowledgmentSettings:
      type: object
      additionalProperties: false
      description: Optional automatic X12 acknowledgment MIME packaging for 997s and partner-enabled 999s. Omit the object or `messageStructure` to use `SIGNED_ENCRYPTED`.
      properties:
        messageStructure:
          type: string
          enum:
            - PLAIN
            - SIGNED
            - ENCRYPTED
            - SIGNED_ENCRYPTED
            - PLAIN_COMPRESSED
            - SIGNED_COMPRESSED
            - ENCRYPTED_COMPRESSED
            - ENCRYPTED_COMPRESSED_SIGNED
          default: SIGNED_ENCRYPTED
          description: MIME signing, encryption, and compression structure used when ModernEDI automatically sends an X12 acknowledgment (997 or partner-enabled 999) to this partner.
    As2MdnSettings:
      type: object
      additionalProperties: false
      description: Optional MDN interoperability controls. Omitted values default to unencrypted MDNs and synchronous error dispositions.
      properties:
        encrypt:
          type: boolean
          default: false
          description: When true, ModernEDI attempts to encrypt MDNs returned for inbound messages with the partner certificate and configured outbound encryption algorithm. If MDN encryption itself fails, ModernEDI returns an unencrypted error MDN so the partner still receives a disposition.
        forceSynchronousForErrors:
          type: boolean
          default: true
          description: When true, an inbound processing failure or error is returned as a synchronous MDN even when the normal receipt flow is asynchronous.
    GeneratedX12Request:
      type: object
      required:
        - x12
      properties:
        x12:
          type: string
          description: Complete X12 interchange to validate and send without mapping.
        businessKey:
          allOf:
            - $ref: '#/components/schemas/OutboundBusinessKey'
          description: Optional business identifier stored for transaction search and reconciliation.
    OutboundTransformEnvelope:
      type: object
      required:
        - contentType
        - input
      properties:
        contentType:
          type: string
          description: |
            Content type of `input` and the outgoing map to select. Use this envelope with HTTP `Content-Type: application/vnd.modernedi.outbound+json` when the source input is XML, text, or JSON with extra transform params. Ordinary `application/json` is always treated as the source document itself.
          example: application/xml
        input:
          description: |
            Source document to transform. For XML or text content types this must be a string. For JSON content types this may be a JSON object, array, string, number, boolean, or null.
          oneOf:
            - type: string
              nullable: true
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: number
            - type: boolean
        businessKey:
          allOf:
            - $ref: '#/components/schemas/OutboundBusinessKey'
          description: |
            Optional business identifier to store on the outbound transaction record, such as an invoice number, ASN number, BOL number, shipment id, or other value your system uses for reconciliation. This is recorded for transaction search and display only; it does not affect outgoing-map selection or transform execution.
        params:
          type: object
          additionalProperties: true
          description: |
            Optional transform parameters. For XSLT maps, each key is bound as an external stylesheet parameter with the same simple, unqualified name. `json` and `text` are reserved by ModernEDI. JSON strings map to `xs:string`, integers to integer numbers, decimals to decimal numbers, booleans to `xs:boolean`, null to an empty sequence, objects to `map(xs:string, item()*)`, and arrays to XDM sequences. Arrays of objects therefore work with declarations such as `<xsl:param name="pallets" as="map(xs:string, xs:anyAtomicType)*" required="yes"/>`. JSLT still uses `.` as its current input, but for JSLT maps ModernEDI evaluates the map with a root wrapper object shaped as `{ "input": <source>, "params": <params> }`. Source fields are therefore read as `.input.invoice.number` instead of directly from the root, and params are read as `.params.bolNumber`, `.params.pallets[0]`, and so on. When JSLT repeated output needs params inside a `for` loop, bind `.params` before the loop, such as `let params = .params`, and read `$params.bolNumber` inside the loop because `.` is the current source item there. Use `required="yes"` for XSLT params that every live request must supply. Params JSON files in the mapper editor are used only for test-running a map; they are not live defaults for this API. In the mapper editor, params are standalone JSON fixture files that can be edited like other workspace files and selected when test-running the map. While authoring JSLT, the editor uses the selected source and params fixture files for completions, diagnostics, and quick fixes for wrapper root mistakes, missing sample paths, and `get-key` object-key typos.
          example:
            bolNumber: BOL-DEMO-8842
            totalWeightInLbs: 1232.54
            transactionSetControlNumber: '000002321'
            pallets:
              - buyerSku: DEMO-SKU-001
                itemNumber: DEMO-ITEM-001
                numCases: 187
                sscc18: '000000000000000101'
    OutboundBusinessKey:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
          minLength: 1
          description: Stable business-key name, for example `invoiceNumber`, `shipmentId`, or `bolNumber`.
          example: shipmentId
        value:
          oneOf:
            - type: string
              minLength: 1
            - type: number
            - type: boolean
          description: Scalar business-key value. Numbers and booleans in the JSON envelope are accepted and stored as strings.
          example: ASN-DEMO-1001
    SendSuccessResponse:
      description: Confirmation that ModernEDI validated, packaged, and handed an outbound AS2 message to the configured partner endpoint.
      type: object
      required:
        - success
        - messageId
        - x12
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; transport or validation failures use the documented error response instead.
        messageId:
          type: string
          description: AS2 Message-Id assigned to the outbound message.
          example: <generated-message-id@modernedi>
        x12:
          type: string
          description: |
            Final X12 sent downstream after ModernEDI syntax-checks it and wraps it for AS2 delivery. For mapped endpoints this is generated output; for `/v1/as2/x12/...` endpoints it is the validated X12 supplied by the caller.
    OutboundPreviewResponse:
      description: Dry-run result showing map selection, generated X12, validation diagnostics, and partner context without sending AS2.
      type: object
      required:
        - success
        - generatedX12
        - validation
        - mapping
        - partner
        - businessKey
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; map-selection or transform failures use the documented error response instead.
        generatedX12:
          type: string
          description: Complete generated X12 that would be sent by `/v1/as2/send`.
        validation:
          description: X12 syntax and structure diagnostics for the generated output; review `valid` before attempting delivery.
          $ref: '#/components/schemas/X12ValidationResult'
        mapping:
          type: object
          description: Published outgoing map selected from the partner, content type, X12 version, and request route.
          required:
            - id
            - transformType
            - file
            - fileSha256Hash
            - contentType
            - x12Version
          properties:
            id:
              type: integer
              description: Stable workspace-scoped identifier of the selected outgoing map.
            transformType:
              type: string
              description: Transform engine used by the published map, such as `xslt` or `jslt`.
              example: xslt
            file:
              type: string
              description: Customer-visible transform filename recorded for the selected map.
            fileSha256Hash:
              type: string
              description: Base64-encoded SHA-256 hash of the published map contents.
              example: 5vG51TfOLEo9YN0WSMf0bj+xzluq2UptTm4flVSo8EE=
            contentType:
              type: string
              description: Source media type expected by the selected outgoing map.
            x12Version:
              type: string
              description: X12 version the selected map generates.
        partner:
          type: object
          description: Source trading partner whose outgoing map and configuration were selected.
          required:
            - partnerId
            - name
          properties:
            partnerId:
              type: integer
              description: Stable workspace-scoped partner id used for exact selection.
            name:
              type: string
              description: Current customer-visible name of the selected partner.
        businessKey:
          type: object
          nullable: true
          description: Business identifier that would be recorded with a real send, or `null` when none was supplied.
          allOf:
            - $ref: '#/components/schemas/OutboundBusinessKey'
    MappedOutputQueueResponse:
      description: One bounded poll of application-facing mapped outputs from the selected environment.
      type: object
      required:
        - success
        - environment
        - messages
        - limit
        - visibilityTimeoutSeconds
        - nextCursor
        - hasMore
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; authentication or queue failures use the documented error response instead.
        environment:
          $ref: '#/components/schemas/TransactionEnvironmentValue'
        messages:
          type: array
          description: Outputs leased to this poll; acknowledge each successfully persisted item using its id and latest receipt handle.
          items:
            $ref: '#/components/schemas/MappedOutputMessage'
        limit:
          type: integer
          description: Maximum number of deliverable messages requested for this poll, after server bounds are applied.
          example: 10
        visibilityTimeoutSeconds:
          type: integer
          description: Lease duration in seconds; unacknowledged messages may be redelivered after this interval.
          example: 120
        nextCursor:
          type: string
          nullable: true
          description: |
            Opaque position for the next bounded scan. Send this value as the next poll's `cursor` whenever `hasMore` is true.
        hasMore:
          type: boolean
          description: True when `nextCursor` should be used to continue scanning.
    MappedOutputMessage:
      description: One mapped application document leased from ModernEDI's managed output queue.
      type: object
      required:
        - id
        - receiptHandle
        - deliveryCount
        - environment
        - messageId
        - transactionKey
        - mappedOutputKey
        - sequenceNumber
        - purpose
      properties:
        id:
          type: string
          description: |
            Stable id for this generated output version, used when marking the message received. A later durable regeneration can produce a new id for the same `messageId` and `mappedOutputKey`.
        receiptHandle:
          type: string
          description: Token from the latest poll response, required when marking the message received.
        deliveryCount:
          type: integer
          description: Number of pull or webhook delivery leases issued for this generated output version.
        leasedUntil:
          type: string
          format: date-time
          description: UTC instant when ModernEDI may return this message again if it has not been marked received.
          nullable: true
        messageId:
          type: string
          description: |
            Original inbound AS2 message id. Use this value as `originalMessageId` when sending a reply with `/v1/as2/reply`.
        transactionKey:
          type: string
          description: Transaction identifier within the AS2 message, usually `GS06#ST02`.
        partnerName:
          type: string
          description: Partner name. Omitted when `deliveredMetadata.partner` is `false`.
        environment:
          $ref: '#/components/schemas/TransactionEnvironmentValue'
        partnerId:
          type: integer
          description: Persisted tenant-scoped partner id. Omitted when `deliveredMetadata.partner` is `false`.
        transactionTimestamp:
          allOf:
            - $ref: '#/components/schemas/UtcTimestamp'
          description: Source transaction timestamp. Omitted when `deliveredMetadata.transactionTimestamp` is `false`.
        transactionSet:
          allOf:
            - $ref: '#/components/schemas/TransactionSet'
          description: Transaction-set code and description. Omitted when `deliveredMetadata.transactionSet` is `false`.
        controlNumbers:
          allOf:
            - $ref: '#/components/schemas/TransactionControlNumbers'
          description: |
            X12 transaction and functional-group control numbers. Individual properties are omitted according to `deliveredMetadata.transactionControlNumber` and `deliveredMetadata.functionalGroupControlNumber`; the object is omitted when both are `false`.
        edi:
          allOf:
            - $ref: '#/components/schemas/TransactionEdiMetadata'
          description: |
            Optional X12 context controlled by `deliveredMetadata.transactionSet`, `x12Version`, `functionalIdentifierCode`, and `segmentTerminator`. The object is omitted when all four are `false`.
        mapping:
          description: Published incoming map that produced the payload; metadata fields may be absent when their delivery flag is disabled.
          $ref: '#/components/schemas/MappedOutputMapping'
        mappedOutputKey:
          type: string
          description: Unique mapped-output key inside the transaction.
        sequenceNumber:
          type: integer
          description: Zero-based output order when one source transaction produces multiple mapped documents.
        purpose:
          $ref: '#/components/schemas/MappingPurpose'
        contentType:
          type: string
          nullable: true
          description: Media type for `payload`, such as `application/json` or `application/xml`.
          example: application/json
        createdAt:
          $ref: '#/components/schemas/NullableUtcTimestamp'
        businessKey:
          type: object
          nullable: true
          description: Map-derived business identifier for customer reconciliation, or `null` when the map did not produce one.
          allOf:
            - $ref: '#/components/schemas/TransactionBusinessKey'
        extraFields:
          type: object
          description: |
            Runtime routing metadata recorded with the generated output, such as `{"destination":"managedQueue"}`. This is not the customer-selectable context; use the mapping's `deliveredMetadata` flags for that.
          additionalProperties:
            type: string
        payload:
          type: string
          nullable: true
          description: Mapped document body. Parse according to `contentType`.
    MappedOutputMapping:
      description: Identity and immutable execution provenance of the published incoming map that generated a queued output.
      type: object
      properties:
        id:
          type: integer
          nullable: true
          description: Workspace-scoped mapping id, or `null` for historical outputs that predate persisted map identity.
          example: 44
        type:
          type: string
          nullable: true
          description: Runtime mapping implementation name, or `null` when it was not recorded with an older output.
          example: ManagedQueueMapping
        file:
          type: string
          nullable: true
          description: Customer-visible source filename, or `null` when unavailable on an older output.
          example: customer-one-850.jslt
        fileSha256Hash:
          type: string
          description: |
            Base64-encoded SHA-256 hash of the published map contents. Omitted when `deliveredMetadata.mappingSourceHash` is `false`.
          example: 5vG51TfOLEo9YN0WSMf0bj+xzluq2UptTm4flVSo8EE=
        syntaxTreeCatalogRevision:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Immutable grammar-catalog revision declared by the mapping execution; omitted for legacy outputs.
        syntaxTreeSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 of the exact transaction-set grammar bytes used by the mapping execution; omitted for legacy outputs.
    MappedOutputAckRequest:
      type: object
      required:
        - receiptHandle
      properties:
        receiptHandle:
          type: string
          description: Token from the latest poll response for this mapped output id.
    MappedOutputAckResponse:
      description: Confirmation that one leased mapped output moved into acknowledged-by-your-integration custody.
      type: object
      additionalProperties: false
      required:
        - success
        - environment
        - acknowledgment
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; stale handles or unknown outputs use the documented error response instead.
        environment:
          $ref: '#/components/schemas/TransactionEnvironmentValue'
        acknowledgment:
          description: Canonical identity and acknowledgment timestamp for the output now held by your integration.
          $ref: '#/components/schemas/MappedOutputAcknowledgment'
    MappedOutputAcknowledgment:
      description: Durable receipt record proving when your integration acknowledged one mapped output version.
      type: object
      required:
        - id
        - messageId
        - mappedOutputKey
      properties:
        id:
          type: string
          description: Stable generated-output version id that was acknowledged.
        messageId:
          type: string
          description: Original inbound AS2 message id associated with the acknowledged output.
        mappedOutputKey:
          type: string
          description: Unique mapped-output key within the source transaction.
        ackedAt:
          $ref: '#/components/schemas/NullableUtcTimestamp'
          description: UTC instant when the mapped output was acknowledged.
    MappedOutputBulkAckRequest:
      type: object
      required:
        - acks
      properties:
        acks:
          type: array
          minItems: 1
          maxItems: 100
          description: One to 100 mapped-output id and receipt-handle pairs from the selected environment. The batch is atomic; if any pair is invalid, none are acknowledged.
          items:
            type: object
            required:
              - id
              - receiptHandle
            properties:
              id:
                type: string
                description: Mapped-output id returned by the poll response.
              receiptHandle:
                type: string
                description: Receipt handle from the same poll response.
    MappedOutputBulkAckResponse:
      description: Atomic confirmation that every requested mapped-output lease was acknowledged.
      type: object
      required:
        - success
        - environment
        - acknowledgedCount
        - acknowledgments
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; if any lease is invalid the entire request fails and no output is acknowledged.
        environment:
          allOf:
            - $ref: '#/components/schemas/TransactionEnvironmentValue'
          description: Selects the isolated transaction history containing the original transaction. Defaults to `production` when omitted.
        acknowledgedCount:
          type: integer
          minimum: 1
          maximum: 100
          description: Number of outputs acknowledged by this atomic batch.
        acknowledgments:
          type: array
          description: Canonical acknowledgment records in the same successful batch.
          items:
            $ref: '#/components/schemas/MappedOutputAcknowledgment'
    MappingListResponse:
      description: Successful response containing the workspace's current published mapping configurations.
      type: object
      required:
        - success
        - mappings
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; failures use the documented error response instead.
        mappings:
          type: array
          description: Current published mapping configurations, including source text, output contract, and ETags.
          items:
            $ref: '#/components/schemas/MappingConfiguration'
    MappingResponse:
      description: Successful response containing one current mapping configuration.
      type: object
      required:
        - success
        - mapping
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; failures use the documented error response instead.
        mapping:
          description: Complete current mapping configuration after defaults and server-managed delivery behavior are resolved.
          $ref: '#/components/schemas/MappingConfiguration'
    MappingConfigurationRevisionListResponse:
      description: Newest-first immutable mapping-configuration history plus the complete currently published transform source and configuration identity.
      type: object
      required:
        - success
        - mappingId
        - currentEtag
        - currentRevision
        - nextCursor
        - hasMore
        - revisions
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; failures use the documented error response instead.
        mappingId:
          type: integer
          minimum: 1
          description: Stable workspace-scoped mapping id whose configuration history was requested.
        currentEtag:
          type: string
          description: Quoted ETag for the complete currently published mapping.
        currentRevision:
          allOf:
            - $ref: '#/components/schemas/MappingConfigurationRevisionDetail'
          description: Complete currently published transform source and exact configuration identity from the same locked snapshot as `currentEtag`. This is present even when its chronological revision entry is outside the current page.
        nextCursor:
          type: string
          nullable: true
          description: Opaque cursor for the next chronological page, or `null` when no older configuration revisions remain.
        hasMore:
          type: boolean
          description: Whether another page is available through `nextCursor`.
        revisions:
          type: array
          description: One newest-first page of unique immutable mapping-configuration summaries. Identical source text can appear in multiple entries when another configuration value differs.
          items:
            $ref: '#/components/schemas/MappingConfigurationRevisionSummary'
    MappingConfigurationRevisionResponse:
      description: Successful response containing one immutable historical mapping-configuration revision and its complete stored configuration.
      type: object
      required:
        - success
        - revision
        - mappingConfiguration
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; failures use the documented error response instead.
        revision:
          description: Immutable configuration-revision identity and complete transform source suitable for preview, diff, or review.
          $ref: '#/components/schemas/MappingConfigurationRevisionDetail'
        mappingConfiguration:
          description: Complete historical configuration for inspection, diffing, or reviewed desired-configuration workflows. It has no current-resource ETag because it is immutable revision data.
          $ref: '#/components/schemas/MappingConfigurationSnapshot'
    MappingConfigurationRevisionSummary:
      type: object
      required:
        - revisionId
        - createdAt
        - sourceHash
        - configurationSha256
        - current
        - transform
      properties:
        revisionId:
          type: integer
          minimum: 1
          description: Immutable id for this stored mapping-configuration revision.
        createdAt:
          $ref: '#/components/schemas/UtcTimestamp'
        sourceHash:
          type: string
          description: Base64-encoded SHA-256 hash of the transform source text. This identifies source content; it is not a concurrency-control ETag.
          example: 5vG51TfOLEo9YN0WSMf0bj+xzluq2UptTm4flVSo8EE=
        configurationSha256:
          type: string
          nullable: true
          pattern: ^[0-9a-f]{64}$
          description: Lowercase hexadecimal SHA-256 identity of the complete immutable mapping configuration, or `null` for a legacy revision written before exact configuration identities were recorded.
          example: d52e4b71d52e4b71d52e4b71d52e4b71d52e4b71d52e4b71d52e4b71d52e4b71
        current:
          type: boolean
          description: Whether this exact mapping configuration is currently published. Source text alone is insufficient to make a revision current.
        syntaxTreeCatalog:
          description: Immutable grammar identifiers recorded with this configuration revision; omitted for revisions that predate syntax-tree provenance.
          $ref: '#/components/schemas/SyntaxTreeCatalogBinding'
        transform:
          description: Transform type and original archived filename for this revision.
          $ref: '#/components/schemas/MappingConfigurationRevisionTransformSummary'
    MappingConfigurationRevisionDetail:
      type: object
      required:
        - revisionId
        - createdAt
        - sourceHash
        - configurationSha256
        - current
        - transform
      properties:
        revisionId:
          type: integer
          minimum: 1
          description: Immutable id for this stored mapping-configuration revision.
        createdAt:
          $ref: '#/components/schemas/UtcTimestamp'
        sourceHash:
          type: string
          description: Base64-encoded SHA-256 hash of the transform source text. This identifies source content; it is not a concurrency-control ETag.
          example: 5vG51TfOLEo9YN0WSMf0bj+xzluq2UptTm4flVSo8EE=
        configurationSha256:
          type: string
          nullable: true
          pattern: ^[0-9a-f]{64}$
          description: Lowercase hexadecimal SHA-256 identity of the complete immutable mapping configuration, or `null` for a legacy revision written before exact configuration identities were recorded.
          example: d52e4b71d52e4b71d52e4b71d52e4b71d52e4b71d52e4b71d52e4b71d52e4b71
        current:
          type: boolean
          description: Whether this exact mapping configuration is currently published. Source text alone is insufficient to make a revision current.
        syntaxTreeCatalog:
          description: Immutable grammar identifiers recorded with this configuration revision; omitted for revisions that predate syntax-tree provenance.
          $ref: '#/components/schemas/SyntaxTreeCatalogBinding'
        transform:
          description: Transform type, archived filename, and complete immutable source text.
          $ref: '#/components/schemas/MappingConfigurationRevisionTransformDetail'
    MappingConfigurationRevisionTransformSummary:
      type: object
      required:
        - type
        - fileName
      properties:
        type:
          type: string
          description: Transform runtime that compiled or interpreted this archived source.
          enum:
            - X12_MAPPER
            - XSLT
            - JSLT
        fileName:
          type: string
          description: Transform filename retained in this configuration revision.
    MappingConfigurationRevisionTransformDetail:
      type: object
      required:
        - type
        - fileName
        - source
      properties:
        type:
          type: string
          description: Transform runtime that compiled or interpreted this archived source.
          enum:
            - X12_MAPPER
            - XSLT
            - JSLT
        fileName:
          type: string
          description: Transform filename retained in this configuration revision.
        source:
          type: string
          description: Complete immutable historical transform source, suitable for previewing or diffing against the current mapping source.
    MappingConfiguration:
      description: Complete published map, transform source, output contract, provenance controls, and concurrency ETag.
      allOf:
        - $ref: '#/components/schemas/MappingConfigurationCore'
        - type: object
          required:
            - configurationResourceKey
            - etag
          properties:
            configurationResourceKey:
              type: string
              format: uuid
              description: Portable mapping identity used by exported configuration documents and aggregate plan/apply. Unlike the numeric workspace-local `mappingId`, this key remains stable when the configuration moves between workspaces.
            etag:
              type: string
              description: Quoted SHA-256 configuration ETag.
    MappingConfigurationCore:
      description: Common mapping configuration fields shared by current resources and immutable revision snapshots.
      type: object
      required:
        - mappingId
        - partnerId
        - direction
        - x12Version
        - functionalIdentifierCode
        - transactionSetIdentifierCode
        - transform
        - output
      properties:
        mappingId:
          type: integer
          minimum: 1
          description: Stable workspace-scoped mapping id used for reads, updates, history, and deletion.
        partnerId:
          type: integer
          minimum: 1
          description: Stable workspace-scoped partner id whose X12 traffic this map handles.
        direction:
          type: string
          description: '`INCOMING` transforms partner X12 to application data; `OUTGOING` transforms application data to partner X12.'
          enum:
            - INCOMING
            - OUTGOING
        x12Version:
          type: string
          description: Normalized X12 version, such as `4010`.
          example: '4010'
        functionalIdentifierCode:
          type: string
          description: X12 GS01 functional identifier enum name.
          example: PO
        transactionSetIdentifierCode:
          type: string
          description: X12 ST01 transaction-set identifier without a leading underscore.
          example: '850'
        syntaxTreeCatalog:
          description: Immutable grammar identifiers bound when this mapping configuration was approved.
          $ref: '#/components/schemas/SyntaxTreeCatalogBinding'
        transform:
          description: Executable source and filename currently published for this map.
          $ref: '#/components/schemas/MappingTransform'
        output:
          description: Content type, business purpose, and server-selected delivery boundary for this map.
          $ref: '#/components/schemas/MappingOutputConfiguration'
        businessKey:
          description: Searchable value extractor for incoming transactions; omitted on outgoing mappings.
          $ref: '#/components/schemas/MappingBusinessKey'
        deliveredMetadata:
          allOf:
            - $ref: '#/components/schemas/MappingDeliveredMetadata'
          description: Present only for incoming mappings.
    MappingConfigurationSnapshot:
      description: Complete immutable mapping configuration, including the exact advanced runtime values that participate in its configuration hash.
      allOf:
        - $ref: '#/components/schemas/MappingConfigurationCore'
        - type: object
          required:
            - runtime
          properties:
            runtime:
              $ref: '#/components/schemas/ConfigurationMappingRuntime'
    SyntaxTreeCatalogBinding:
      type: object
      readOnly: true
      description: |
        Content-addressed identifiers for the exact X12 grammar used to validate and execute a mapping. These values support reproducibility and diagnostics and do not expose internal storage locations.
      required:
        - schemaVersion
        - catalogRevision
        - manifestSha256
        - syntaxTreeSha256
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
          description: Version of this catalog-binding metadata contract, used by clients to interpret the immutable grammar identifiers safely.
        catalogRevision:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: |
            SHA-256 identity of the complete immutable syntax-tree catalog at approval time. This approval revision can differ from a later active platform catalog when syntaxTreeSha256 proves that the exact grammar for this mapping's X12 version and transaction set is unchanged.
        manifestSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 of the canonical catalog manifest.
        syntaxTreeSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 of the exact normalized grammar bytes for this X12 version and transaction set.
    MappingTransform:
      type: object
      required:
        - type
        - fileName
        - source
      properties:
        type:
          type: string
          enum:
            - X12_MAPPER
            - XSLT
            - JSLT
          description: Transform runtime selected by mapping direction. Incoming mappings use `X12_MAPPER`; outgoing mappings use `XSLT` or `JSLT`.
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Source-controlled transform filename shown in the workspace and transaction provenance.
        source:
          type: string
          minLength: 1
          maxLength: 524288
          description: Complete map source text, limited to 524,288 characters (512 KiB) by the executable mapping runtime. This value is returned on reads for configuration-as-code workflows.
    MappingOutput:
      type: object
      required:
        - contentType
      properties:
        contentType:
          type: string
          minLength: 1
          maxLength: 255
          description: Mapped payload content type for incoming maps; source content type selected by outgoing maps.
        purpose:
          allOf:
            - $ref: '#/components/schemas/MappingPurpose'
          default: PROCESSING
          description: Defaults to `PROCESSING` when omitted. Incoming mappings may also use `ACKNOWLEDGMENT`; outgoing mappings use `PROCESSING`.
    MappingOutputConfiguration:
      allOf:
        - $ref: '#/components/schemas/MappingOutput'
        - type: object
          required:
            - delivery
          properties:
            delivery:
              allOf:
                - $ref: '#/components/schemas/MappingOutputDelivery'
              readOnly: true
              description: Server-selected delivery behavior. New incoming public mappings use `MAPPED_OUTPUTS`; outgoing maps use `OUTBOUND_AS2`.
    MappingOutputDelivery:
      type: string
      description: |
        Safe delivery category without infrastructure identifiers:

        - `MAPPED_OUTPUTS`: managed polling and per-partner webhook delivery
        - `TRANSACTION_RECORD`: incoming result retained on the transaction record
        - `OUTBOUND_AS2`: outbound source-to-X12 transform used by AS2 send APIs
      enum:
        - MAPPED_OUTPUTS
        - TRANSACTION_RECORD
        - OUTBOUND_AS2
    MappingBusinessKey:
      type: object
      required:
        - name
        - extractor
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Stable customer-facing label for the extracted value, such as `purchaseOrderNumber`.
          example: purchaseOrderNumber
        extractor:
          type: string
          minLength: 1
          maxLength: 4096
          description: Incoming X12 mapper expression used to persist the searchable business-key value.
          example: BEG03
    MappingDeliveredMetadata:
      type: object
      additionalProperties: false
      description: |
        Selects optional source and mapping context included in `GET /v1/mapped-outputs` message objects and the webhook's nested `message` object. Every field defaults to `true`. Setting a field to `false` omits its corresponding message property; queue identifiers, receipt handles, payload, content type, purpose, and business key remain present. Webhook-envelope routing fields such as `tenantId` and `partnerId` also remain present.
      properties:
        partner:
          type: boolean
          default: true
          description: Include `partnerName` and tenant-scoped `partnerId` in the mapped-output message.
        transactionTimestamp:
          type: boolean
          default: true
          description: Include the source transaction's persisted `transactionTimestamp`.
        transactionSet:
          type: boolean
          default: true
          description: Include `transactionSet` and the equivalent `edi.transactionGroupType` value.
        transactionControlNumber:
          type: boolean
          default: true
          description: Include `controlNumbers.transaction` (X12 ST02).
        functionalGroupControlNumber:
          type: boolean
          default: true
          description: Include `controlNumbers.functionalGroup` (X12 GS06).
        x12Version:
          type: boolean
          default: true
          description: Include `edi.x12Version`, derived from the parsed interchange version.
        functionalIdentifierCode:
          type: boolean
          default: true
          description: Include `edi.functionalIdentifierCode` (X12 GS01).
        segmentTerminator:
          type: boolean
          default: true
          description: Include `edi.segmentTerminator`.
        mappingSourceHash:
          type: boolean
          default: true
          description: Include `mapping.fileSha256Hash`, the Base64-encoded SHA-256 hash of the map source that generated this output.
    TransactionListResponse:
      description: Paginated transaction summaries plus an environment-wide operator-attention count and freshness state.
      type: object
      required:
        - success
        - environment
        - transactions
        - hasMore
        - window
        - attentionSummary
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; query or authorization failures use the documented error response instead.
        environment:
          $ref: '#/components/schemas/TransactionEnvironmentValue'
        transactions:
          type: array
          description: Transactions matching the requested filters and cursor page, ordered newest first.
          items:
            $ref: '#/components/schemas/TransactionSummary'
        nextCursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page, or `null` when no further matching transactions remain.
        hasMore:
          type: boolean
          description: True when `nextCursor` should be sent unchanged to retrieve another page.
        window:
          description: Normalized UTC date/time window applied to this transaction query.
          $ref: '#/components/schemas/TransactionWindow'
        attentionSummary:
          $ref: '#/components/schemas/TransactionAttentionSummary'
    TransactionDetailResponse:
      description: Metadata-first transaction record with a document index, mapping results, delivery state, acknowledgments, events, and compact linked-reply summaries.
      type: object
      required:
        - success
        - environment
        - transaction
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; unknown transactions or authorization failures use an error response.
        environment:
          $ref: '#/components/schemas/TransactionEnvironmentValue'
        transaction:
          description: Full operator-facing transaction detail for the requested message and transaction key.
          $ref: '#/components/schemas/TransactionDetail'
    TransactionWatchResponse:
      description: Resulting operator-watchlist state after an idempotent watch or unwatch operation.
      type: object
      required:
        - success
        - environment
        - messageId
        - transactionKey
        - onWatchlist
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; unknown transactions or authorization failures use an error response.
        environment:
          $ref: '#/components/schemas/TransactionEnvironmentValue'
        messageId:
          type: string
          description: AS2 message id of the transaction whose watch state changed.
          example: msg-850-api
        transactionKey:
          type: string
          description: Transaction identifier within the AS2 message, usually `GS06#ST02`.
          example: 17#0001
        onWatchlist:
          type: boolean
          description: Resulting watchlist state after the operation.
    TransactionDocumentsResponse:
      description: Metadata index of documents retained for one transaction, including X12, mapped outputs, acknowledgments, and HTTP response artifacts.
      type: object
      required:
        - success
        - environment
        - documents
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; unknown transactions or authorization failures use an error response.
        environment:
          $ref: '#/components/schemas/TransactionEnvironmentValue'
        documents:
          type: array
          description: Retained document metadata in display order. Fetch an individual document to obtain its body.
          items:
            $ref: '#/components/schemas/TransactionDocumentMetadata'
    TransactionEventsResponse:
      description: Chronological operational timeline for one transaction and its acknowledgments.
      type: object
      required:
        - success
        - environment
        - events
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; unknown transactions or authorization failures use an error response.
        environment:
          $ref: '#/components/schemas/TransactionEnvironmentValue'
        events:
          type: array
          description: Derived transaction, mapping, delivery, MDN, and acknowledgment events in chronological order.
          items:
            $ref: '#/components/schemas/TransactionEvent'
    TransactionDocumentResponse:
      description: One complete retained transaction artifact selected from the document index.
      type: object
      required:
        - success
        - environment
        - document
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; missing transactions or documents use an error response.
        environment:
          $ref: '#/components/schemas/TransactionEnvironmentValue'
        document:
          $ref: '#/components/schemas/TransactionDocument'
    TransactionX12ValidationResponse:
      description: Structured validation of the X12 content retained for one visible transaction.
      type: object
      required:
        - success
        - environment
        - messageId
        - transactionKey
        - validation
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; invalid retained X12 is represented by `validation.valid=false`.
        environment:
          $ref: '#/components/schemas/TransactionEnvironmentValue'
        messageId:
          type: string
          description: Message id from the requested transaction reference.
        transactionKey:
          type: string
          description: Transaction key from the requested transaction reference.
        validation:
          $ref: '#/components/schemas/X12ValidationResult'
    MappingRuntimeHealthResponse:
      description: Environment-wide summary of retained mapping failures and recoveries.
      type: object
      required:
        - success
        - environment
        - generatedAt
        - truncated
        - totals
        - mappings
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; authorization, billing, or runtime-read failures use an error response.
        environment:
          $ref: '#/components/schemas/TransactionEnvironmentValue'
        generatedAt:
          $ref: '#/components/schemas/UtcTimestamp'
        truncated:
          type: boolean
          description: True when the bounded health scan could not summarize every retained attempt.
        totals:
          description: Aggregate unresolved-current, unmatched, and recovered mapping-attempt counts.
          $ref: '#/components/schemas/MappingRuntimeHealthTotals'
        mappings:
          type: array
          description: Mapping- or unmatched-request-level groups with failure or recovery activity.
          items:
            $ref: '#/components/schemas/MappingRuntimeMappingHealth'
    MappingRuntimeHealthTotals:
      type: object
      required:
        - failed
        - currentRevisionFailed
        - unmappedFailed
        - recovered
      properties:
        failed:
          type: integer
          minimum: 0
          description: Unresolved failures across all retained mapping revisions and unmatched requests.
        currentRevisionFailed:
          type: integer
          minimum: 0
          description: Unresolved failures produced by currently published mapping revisions.
        unmappedFailed:
          type: integer
          minimum: 0
          description: Unresolved failures for which no published mapping was resolved.
        recovered:
          type: integer
          minimum: 0
          description: Failures marked resolved by a later successful equivalent attempt.
    MappingRuntimeMappingHealth:
      type: object
      required:
        - mappingId
        - mapFile
        - mapFileSha256Hash
        - currentRevision
        - direction
        - partnerId
        - partnerName
        - latestAt
        - failureCount
        - recoveredCount
      properties:
        mappingId:
          type: integer
          minimum: 1
          nullable: true
          description: Mapping id, or `null` for a request that failed before map selection.
        mapFile:
          type: string
          nullable: true
          description: Transform filename, or `null` when no map was selected.
        mapFileSha256Hash:
          type: string
          nullable: true
          description: Base64 SHA-256 hash of the attempted mapping source, when known.
        currentRevision:
          type: boolean
          description: Whether the grouped attempt hash is still the currently published source.
        direction:
          type: string
          nullable: true
          enum:
            - inbound
            - outbound
          description: Mapping direction, or `null` when it was not attributable.
        partnerId:
          type: integer
          minimum: 1
          nullable: true
          description: Tenant-scoped partner id, or `null` when no partner was resolved.
        partnerName:
          type: string
          nullable: true
          description: Partner name captured for the attempt, when known.
        latestAt:
          $ref: '#/components/schemas/NullableUtcTimestamp'
        failureCount:
          type: integer
          minimum: 0
          description: Unresolved failures in this group.
        recoveredCount:
          type: integer
          minimum: 0
          description: Resolved failures in this group.
    MappingRuntimeFailuresResponse:
      type: object
      required:
        - success
        - environment
        - failures
        - nextCursor
        - hasMore
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; invalid filters, cursors, or runtime-read failures use an error response.
        environment:
          $ref: '#/components/schemas/TransactionEnvironmentValue'
        failures:
          type: array
          description: Reverse-chronological safe diagnostics matching the supplied environment and filters.
          items:
            $ref: '#/components/schemas/TransactionMappingAttempt'
        nextCursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page, or `null` when this page is complete.
        hasMore:
          type: boolean
          description: True when `nextCursor` should be sent back for another page.
    MappingRuntimeFailureResponse:
      type: object
      required:
        - success
        - failure
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; an unknown or tenant-inaccessible failure id uses an error response.
        failure:
          $ref: '#/components/schemas/TransactionMappingAttempt'
    IntegrationChangeEventsResponse:
      description: Bootstrap cursor or chronological page of transaction-state invalidations.
      type: object
      required:
        - success
        - environment
        - events
        - nextCursor
        - hasMore
        - bootstrap
        - retentionSeconds
        - freshness
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; invalid or expired cursors use a structured error response.
        environment:
          $ref: '#/components/schemas/TransactionEnvironmentValue'
        events:
          type: array
          description: Events strictly after the supplied cursor, ordered by detection sequence.
          items:
            $ref: '#/components/schemas/IntegrationChangeEvent'
        nextCursor:
          type: string
          description: |
            Opaque, integrity-protected cursor bound to this tenant and environment. Return it unchanged on the next poll, including after an empty page. Editing it or using it for another tenant or environment returns HTTP 400.
        hasMore:
          type: boolean
          description: True when another page is already available after `nextCursor`.
        bootstrap:
          type: boolean
          description: True only when the request omitted `cursor` and established a high-water mark.
        retentionSeconds:
          type: integer
          minimum: 1
          description: Rolling retention of this invalidation feed; independent of transaction-document retention.
          example: 2592000
        freshness:
          $ref: '#/components/schemas/TransactionAttentionFreshness'
    IntegrationChangeEvent:
      type: object
      required:
        - eventId
        - type
        - observedAt
        - transaction
        - changedFields
      properties:
        eventId:
          type: string
          description: Opaque event identifier for logging and deduplication; ordering comes from the cursor.
          example: evt_MTIz
        type:
          type: string
          enum:
            - transaction.created
            - transaction.changed
          description: Whether reconciliation first observed the transaction or detected a later state change.
        observedAt:
          $ref: '#/components/schemas/UtcTimestamp'
        transaction:
          description: Transaction identity to refetch after receiving this invalidation event.
          $ref: '#/components/schemas/IntegrationChangeTransactionReference'
        changedFields:
          type: array
          minItems: 1
          uniqueItems: true
          description: Public state components that changed; refetch transaction detail for their current values.
          items:
            $ref: '#/components/schemas/IntegrationChangeField'
    IntegrationChangeTransactionReference:
      type: object
      required:
        - messageId
        - transactionKey
        - replyToMessageId
      properties:
        messageId:
          type: string
          description: AS2 Message-Id of the transaction whose public state changed.
        transactionKey:
          type: string
          description: Transaction-local `GS06#ST02` key identifying the changed row.
        replyToMessageId:
          type: string
          nullable: true
          description: Source inbound message for an outbound reply, or `null`.
    IntegrationChangeField:
      type: string
      enum:
        - transaction
        - mappingStatus
        - functionalAcknowledgment
        - implementationAcknowledgment
        - technicalAcknowledgment
        - mdn
        - mappedOutputs
        - attention
      description: Stable public transaction component whose fingerprint changed.
    RelatedTransactionsResponse:
      description: Selected transaction plus outbound replies linked to its inbound AS2 message id.
      type: object
      required:
        - success
        - environment
        - transaction
        - relatedTransactions
      properties:
        success:
          type: boolean
          enum:
            - true
          description: Always `true`; unknown transactions or authorization failures use an error response.
        environment:
          $ref: '#/components/schemas/TransactionEnvironmentValue'
        transaction:
          description: Summary of the source transaction used to resolve related replies.
          $ref: '#/components/schemas/TransactionSummary'
        relatedTransactions:
          type: array
          description: Compact summaries of linked outbound reply transactions; empty when no replies are recorded. Fetch a selected reply's detail for its acknowledgment and document index.
          items:
            $ref: '#/components/schemas/TransactionSummary'
    TransactionWindow:
      type: object
      required:
        - startDate
        - endDate
        - timeZone
      properties:
        startDate:
          $ref: '#/components/schemas/UtcTimestamp'
        endDate:
          $ref: '#/components/schemas/UtcTimestamp'
        timeZone:
          type: string
          enum:
            - UTC
          description: Time zone used for transaction timestamps and normalized query windows.
    TransactionAttentionReason:
      type: string
      enum:
        - mapping_failure
        - functional_ack_issue
        - implementation_ack_issue
        - x12_ack_overdue
        - technical_ack_issue
        - technical_ack_overdue
        - as2_mdn_attention
        - mapped_output_not_collected
        - mapped_output_ack_overdue
        - watchlist
      description: |
        Machine-readable reason that a transaction needs operator attention. `functional_ack_issue` means a 997 was received but was not cleanly accepted. `implementation_ack_issue` means a 999 was received but the transaction-specific IK5 result or conservative AK9 group result was not cleanly accepted. `x12_ack_overdue` means neither a 997 nor a 999 was received for an eligible outbound business transaction by `x12AcknowledgmentExpectedBy`; outbound 997 and 999 acknowledgment documents are excluded. The overdue signal does not automatically resend the original X12. `technical_ack_issue` means a requested TA1 was received but rejected the interchange, reported errors, or could not be classified. `technical_ack_overdue` means ISA14 requested a TA1 but none was received by `technicalAckExpectedBy`. Neither technical-acknowledgment reason automatically resends the original X12. `as2_mdn_attention` means the partner's AS2 receipt is overdue, rejected, invalid, contains a warning, or its returned content MIC does not match the content ModernEDI sent. ModernEDI never automatically resends a document in response to an MDN issue because the partner may already have processed it. `mapped_output_not_collected` means a managed output remained available beyond the 15-minute pickup grace period without a first delivery lease. `mapped_output_ack_overdue` means a delivered output was not acknowledged before its lease expired or was delivered more than once. One transaction can have more than one active reason.
    TransactionAttentionSummary:
      type: object
      required:
        - needsAttentionCount
        - reasonCounts
        - freshness
      description: |
        Environment-wide operator-inbox summary. Counts are independent of the transaction list's date window, row limit, cursor, and other filters. A transaction with more than one reason is counted once in `needsAttentionCount` and once in each applicable reason count. Its `freshness` also applies to `mappingStatus`, `functionalAckStatus`, `implementationAckStatus`, and `mdnStatus` list filtering and to list-level projected MDN status.
      properties:
        needsAttentionCount:
          type: integer
          minimum: 0
          description: Distinct transactions currently projected as needing attention.
        reasonCounts:
          type: object
          description: Active transaction counts by independently applicable attention reason.
          required:
            - mappingFailure
            - functionalAckIssue
            - implementationAckIssue
            - x12AckOverdue
            - technicalAckIssue
            - technicalAckOverdue
            - as2MdnAttention
            - mappedOutputNotCollected
            - mappedOutputAckOverdue
            - watchlist
          properties:
            mappingFailure:
              type: integer
              minimum: 0
              description: Transactions with one or more unresolved mapping attempts.
            functionalAckIssue:
              type: integer
              minimum: 0
              description: Transactions with a received 997 that was not cleanly accepted.
            implementationAckIssue:
              type: integer
              minimum: 0
              description: Transactions with a received 999 whose selected IK5 or AK9 result was not cleanly accepted.
            x12AckOverdue:
              type: integer
              minimum: 0
              description: Eligible outbound transactions with neither a 997 nor a 999 received by their response deadline.
            technicalAckIssue:
              type: integer
              minimum: 0
              description: Outbound transactions whose requested TA1 rejected the interchange, reported errors, or could not be classified.
            technicalAckOverdue:
              type: integer
              minimum: 0
              description: Outbound transactions whose ISA14 requested a TA1 that was not received by its response deadline.
            as2MdnAttention:
              type: integer
              minimum: 0
              description: Outbound transactions whose AS2 MDN is overdue or was received with a warning, rejection, validation failure, or content-MIC mismatch.
            mappedOutputNotCollected:
              type: integer
              minimum: 0
              description: Transactions with at least one managed output that was not collected within the 15-minute pickup grace period.
            mappedOutputAckOverdue:
              type: integer
              minimum: 0
              description: Transactions with an expired unacknowledged output lease or an unacknowledged redelivery.
            watchlist:
              type: integer
              minimum: 0
              description: Transactions placed on an active operator watchlist independently of automated failure signals.
        freshness:
          $ref: '#/components/schemas/TransactionAttentionFreshness'
    TransactionAttentionFreshness:
      type: object
      required:
        - status
        - complete
        - lastCompletedAt
        - reconciliationStartedAt
        - message
      description: |
        Reconciliation state for the selected environment. Until the first complete sweep, attention-filtered or exact-status-filtered rows and counts can be partial or empty; `complete: false` means an empty result is not proof of zero. An incomplete or failed sweep does not clear previously observed active attention items.
      properties:
        status:
          type: string
          description: 'Reconciliation lifecycle: pending, actively reconciling, current, or stale.'
          enum:
            - pending
            - reconciling
            - current
            - stale
        complete:
          type: boolean
          description: |
            Whether the currently reported projection is complete and current. This is false while the first sweep is pending, while a refresh is reconciling, or when reconciliation is stale; previously observed active items remain visible during those states.
        lastCompletedAt:
          type: string
          format: date-time
          nullable: true
          description: UTC instant of the latest completed full attention sweep, or `null` before the first completion.
        reconciliationStartedAt:
          type: string
          format: date-time
          nullable: true
          description: UTC instant when the current reconciliation began, or `null` when no sweep is running.
        message:
          type: string
          nullable: true
          description: Safe operator-facing freshness or retry guidance; internal errors are not exposed.
    FilterableTransactionMappingStatus:
      type: string
      enum:
        - NOT_RECORDED
        - SUCCEEDED
        - FAILED
        - COMPLETED_WITH_ERRORS
        - RECOVERED
      description: |
        Durable consolidated mapping states available to exact list filtering. `UNAVAILABLE` is intentionally excluded because it describes a request-local telemetry read failure rather than an indexed transaction state.
    FilterableFunctionalAcknowledgmentStatus:
      type: string
      enum:
        - accepted
        - accepted_with_errors
        - partially_accepted
        - rejected
        - unknown
      description: |
        Closed set of normalized 997 statuses accepted by exact transaction-list filtering. Response models use a separate forward-compatible enum so a newer response status does not prevent an older SDK from reading the row.
    FilterableImplementationAcknowledgmentStatus:
      type: string
      enum:
        - accepted
        - accepted_with_errors
        - partially_accepted
        - rejected
        - unknown
      description: |
        Closed set of normalized 999 statuses accepted by exact transaction-list filtering. Response models use a separate forward-compatible enum so a newer response status does not prevent an older SDK from reading the row.
    FilterableTransactionMdnStatus:
      type: string
      enum:
        - pending
        - processed
        - warning
        - rejected
        - invalid
        - mic_mismatch
        - overdue
      description: |
        Closed set of normalized AS2 receipt-assurance statuses accepted by exact transaction-list filtering. Response models use a separate forward-compatible enum so a newer response status does not prevent an older SDK from reading the row.
    TransactionMappingStatusSummary:
      type: object
      required:
        - status
        - latestAttemptAt
        - failureCount
      properties:
        status:
          type: string
          enum:
            - NOT_RECORDED
            - UNAVAILABLE
            - SUCCEEDED
            - FAILED
            - COMPLETED_WITH_ERRORS
            - RECOVERED
          description: |
            Consolidated mapping outcome. `NOT_RECORDED` means no mapping runtime result was found; it does not claim that a map ran successfully. `UNAVAILABLE` means mapping telemetry could not be read while this response was built. It is fail-soft, has `failureCount: 0`, and does not by itself set `needsAttention`; retry before drawing a conclusion. `RECOVERED` means earlier failures were resolved by a later successful attempt. `COMPLETED_WITH_ERRORS` means at least one attempt succeeded while another failure remains unresolved.
        latestAttemptAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the latest mapping attempt or fallback post-process status.
        failureCount:
          type: integer
          minimum: 0
          description: Number of unresolved mapping failures for this transaction.
    TransactionMappingStatus:
      allOf:
        - $ref: '#/components/schemas/TransactionMappingStatusSummary'
        - type: object
          required:
            - attempts
          properties:
            attempts:
              type: array
              description: Mapping attempts in reverse chronological order. This is empty when only fallback post-process status is available.
              items:
                $ref: '#/components/schemas/TransactionMappingAttempt'
    TransactionMappingAttempt:
      description: One persisted mapping execution result with source revision, diagnostic location, replay linkage, and resolution state.
      type: object
      required:
        - correlationId
        - transactionReference
        - failureId
        - attemptId
        - transactionKey
        - direction
        - environment
        - currentRevision
        - stage
        - status
        - code
        - fallback
        - timestamp
        - resolved
      properties:
        correlationId:
          type: string
          description: |
            ModernEDI correlation id for the mapping operation. For a normal transaction-backed attempt this is the AS2 Message-Id. For a pre-transaction outbound failure it is an opaque request correlation id and must not be presented as an AS2 Message-Id.
        transactionReference:
          description: |
            Transaction that owns this attempt, or `null` when mapping failed before ModernEDI could create a transaction.
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MappingRuntimeTransactionReference'
        failureId:
          type: string
          nullable: true
          description: |
            Opaque identifier for correlating and retrieving a failed attempt. This is `null` for successful attempts because the failure-detail endpoint intentionally exposes only retained failures.
        attemptId:
          type: string
          description: Opaque identifier for this individual mapping execution attempt.
        transactionKey:
          type: string
          description: |
            Source transaction key shown in the transaction viewer. Pre-transaction outbound failures use the sentinel `outbound-request`; internal mapping-attempt persistence keys are never exposed.
        direction:
          type: string
          description: Whether this attempt processed inbound X12 or generated outbound X12.
          enum:
            - inbound
            - outbound
        environment:
          $ref: '#/components/schemas/TransactionEnvironmentValue'
        partnerName:
          type: string
          nullable: true
          description: Partner name captured at execution time, or `null` when attribution was unavailable.
        partnerId:
          type: integer
          nullable: true
          description: Stable workspace-scoped partner id, or `null` when the attempt could not be attributed.
        mappingId:
          type: integer
          nullable: true
          description: Workspace-scoped mapping id, or `null` when no published map was resolved.
        mapFile:
          type: string
          nullable: true
          description: Transform filename attempted, or `null` when selection failed before a file was resolved.
        mapFileSha256Hash:
          type: string
          nullable: true
          description: Base64 SHA-256 hash of the transform source actually attempted, or `null` when unavailable.
        currentMapFileSha256Hash:
          type: string
          nullable: true
          description: Base64 SHA-256 hash of the currently published source, or `null` when it cannot be resolved.
        currentRevision:
          type: boolean
          description: Whether the attempted map hash is still the currently published revision.
        transactionSetIdentifierCode:
          type: string
          nullable: true
          description: ST01 transaction-set identifier associated with the attempt, or `null` when unknown.
        transactionControlNumber:
          type: string
          nullable: true
          description: ST02 transaction control number associated with the attempt, or `null` when unknown.
        functionalIdentifierCode:
          type: string
          nullable: true
          description: GS01 functional identifier associated with the attempt, or `null` when unknown.
        functionalGroupControlNumber:
          type: string
          nullable: true
          description: GS06 functional-group control number associated with the attempt, or `null` when unknown.
        x12Version:
          type: string
          nullable: true
          description: X12 implementation version used by the attempt, or `null` when unresolved.
        stage:
          type: string
          description: Mapping pipeline stage that produced the result.
        status:
          type: string
          description: Whether this individual mapping attempt succeeded or failed.
          enum:
            - FAILED
            - SUCCEEDED
        code:
          type: string
          description: Stable machine-readable mapping result code.
        safeMessage:
          type: string
          nullable: true
          description: Sanitized diagnostic message safe to display to workspace operators.
        line:
          type: integer
          nullable: true
          description: One-based source line for a transform diagnostic, or `null` when no precise location exists.
        column:
          type: integer
          nullable: true
          description: One-based source column for a transform diagnostic, or `null` when no precise location exists.
        fallback:
          type: string
          description: Fallback behavior used after this attempt, or `NONE`.
        timestamp:
          type: string
          format: date-time
          description: UTC instant when this mapping attempt was recorded.
        replayId:
          type: string
          nullable: true
          description: Replay operation id that created this attempt, or `null` for ordinary processing.
        replayOfAttemptId:
          type: string
          nullable: true
          description: Original failed attempt targeted by this replay, or `null` when the attempt was not a replay.
        resolved:
          type: boolean
          description: Whether a later successful attempt has resolved this failure for operator-attention purposes.
        resolvedAt:
          type: string
          format: date-time
          nullable: true
          description: UTC instant when the failure was resolved, or `null` while unresolved or not applicable.
        resolvedByAttemptId:
          type: string
          nullable: true
          description: Successful attempt id that resolved this failure, or `null` while unresolved or not applicable.
    MappingRuntimeTransactionReference:
      type: object
      required:
        - messageId
        - transactionKey
      properties:
        messageId:
          type: string
          description: AS2 Message-Id of the retained transaction.
        transactionKey:
          type: string
          description: Transaction key, normally `GS06#ST02`.
    TransactionDetail:
      description: Metadata-first operator aggregate spanning mapping provenance, queue custody, normalized acknowledgments, a document index, and compact related-reply summaries.
      type: object
      required:
        - needsAttention
        - attentionReasons
        - mappingStatus
        - summary
        - mappedOutputs
        - mdn
        - functionalAck
        - implementationAck
        - technicalAck
        - documents
        - events
        - relatedTransactions
      properties:
        needsAttention:
          type: boolean
          description: |
            True when the transaction has an active operational watch, an unresolved mapping failure, or a 997 or 999 acknowledgment outcome other than `accepted`, when neither acknowledgment was received for an eligible outbound transaction by `x12AcknowledgmentExpectedBy`, when a requested TA1 rejected the interchange, reported errors, could not be classified, or was not received by `technicalAckExpectedBy`, when a managed output remained uncollected beyond its 15-minute pickup grace period, or when a delivered output was not acknowledged before its lease expired or was redelivered. A newly ready output inside the grace period and an active first lease are normal handoff progress and do not set this signal by themselves.
        attentionReasons:
          type: array
          uniqueItems: true
          description: Active machine-readable reasons behind `needsAttention`.
          items:
            $ref: '#/components/schemas/TransactionAttentionReason'
        mappingStatus:
          description: Complete mapping history and unresolved failure state for this transaction.
          $ref: '#/components/schemas/TransactionMappingStatus'
        summary:
          description: Stable transaction identity, partner, X12 envelope context, and list-level attention state.
          $ref: '#/components/schemas/TransactionSummary'
        mappedOutputs:
          type: array
          description: Metadata, mapping provenance, and managed-delivery state for inbound mapped outputs. Payload bodies are available through the document endpoints. Outbound reply transactions return an empty array.
          items:
            $ref: '#/components/schemas/StoredTransactionMappedOutput'
        mdn:
          type: object
          nullable: true
          description: Normalized AS2 receipt metadata without the report body. Fetch `mdn-report` from the document endpoint to inspect that body.
          allOf:
            - $ref: '#/components/schemas/TransactionMdn'
        functionalAck:
          type: object
          nullable: true
          description: Normalized X12 functional-acknowledgment metadata without the X12 body. Fetch `functional-ack-x12` from the document endpoint to inspect it.
          allOf:
            - $ref: '#/components/schemas/FunctionalAcknowledgmentDetail'
        implementationAck:
          type: object
          nullable: true
          description: Normalized X12 999 implementation-acknowledgment metadata without the X12 body. Fetch `implementation-ack-x12` from the document endpoint to inspect it.
          allOf:
            - $ref: '#/components/schemas/ImplementationAcknowledgmentDetail'
        technicalAck:
          type: object
          nullable: true
          description: Technical-acknowledgment transport metadata without X12 or HTTP response bodies, or `null` when none was recorded. Fetch the indexed document to inspect a body.
          allOf:
            - $ref: '#/components/schemas/TechnicalAcknowledgmentDetail'
        documents:
          type: array
          description: Metadata index of retained source, mapped-output, acknowledgment, and HTTP-response documents.
          items:
            $ref: '#/components/schemas/TransactionDocumentMetadata'
        events:
          type: array
          description: Chronological operational timeline derived from persisted transaction artifacts.
          items:
            $ref: '#/components/schemas/TransactionEvent'
        relatedTransactions:
          type: array
          description: Compact summaries of outbound replies linked to this inbound transaction. Fetch a selected reply's detail on demand.
          items:
            $ref: '#/components/schemas/TransactionSummary'
    TransactionSummary:
      description: Stable list-level transaction identity, partner context, acknowledgment state, and operator-attention projection.
      type: object
      required:
        - id
        - messageId
        - transactionKey
        - replyToMessageId
        - replyToTransactionKey
        - direction
        - partnerName
        - partnerId
        - partnerConfigurationSha256
        - timestamp
        - transactionSet
        - controlNumbers
        - edi
        - businessKey
        - environment
        - needsAttention
        - attentionReasons
        - onWatchlist
        - mappingStatus
        - functionalAckStatus
        - implementationAckStatus
        - mdnStatus
        - functionalAckOutcome
        - functionalAckTransactionOutcome
        - functionalAckGroupOutcome
        - functionalAckEvaluationScope
        - implementationAckOutcome
        - implementationAckTransactionOutcome
        - implementationAckEvaluationScope
        - x12AcknowledgmentExpectedBy
        - technicalAckRequested
        - technicalAckStatus
        - technicalAckExpectedBy
        - technicalAckOutcome
      properties:
        id:
          type: string
          description: Convenience id formatted as `<messageId>/<transactionKey>`.
          example: msg-850-api/17#0001
        environment:
          $ref: '#/components/schemas/TransactionEnvironmentValue'
        needsAttention:
          type: boolean
          description: |
            Stable operator-inbox signal. True when an unexpired watchlist entry is active, a mapping failure remains unresolved, or the 997 outcome selected by `functionalAckEvaluationScope` or the 999 outcome selected by `implementationAckEvaluationScope` is present and is not `accepted`, or neither a 997 nor a 999 was received for an eligible outbound transaction by `x12AcknowledgmentExpectedBy`, or a requested TA1 rejected the interchange, reported errors, could not be classified, or was not received by `technicalAckExpectedBy`, or when a managed output remained uncollected beyond its 15-minute pickup grace period, or when a delivered output was not acknowledged before its lease expired or was redelivered. A newly ready output inside the grace period and an active first lease are normal handoff progress and do not set this signal by themselves.
        attentionReasons:
          type: array
          uniqueItems: true
          description: Active machine-readable reasons behind `needsAttention`.
          items:
            $ref: '#/components/schemas/TransactionAttentionReason'
        onWatchlist:
          type: boolean
          description: |
            True while an active watchlist entry exists for this transaction. Entries created through the Integration API remain active until `DELETE /v1/integration/transactions/{messageId}/{transactionKey}/watch` removes them. An active watch is also represented by the `watchlist` attention reason.
        mappingStatus:
          description: Consolidated mapping result and unresolved failure count for this transaction.
          $ref: '#/components/schemas/TransactionMappingStatusSummary'
        functionalAckStatus:
          type: string
          nullable: true
          enum:
            - accepted
            - accepted_with_errors
            - partially_accepted
            - rejected
            - unknown
          description: |
            Compact 997 status selected for this transaction. ModernEDI uses a uniquely matched AK2/AK5 outcome when possible, otherwise the uniquely matched AK1/AK9 functional-group outcome, and only then the conservative whole-997 aggregate. Null means no attributable 997 status is currently available. Use `x12_ack_overdue` for an actionable missing X12 acknowledgment.
        implementationAckStatus:
          oneOf:
            - $ref: '#/components/schemas/ImplementationAcknowledgmentStatus'
            - type: object
              nullable: true
              enum:
                - null
          description: |
            Compact 999 status selected for this transaction. ModernEDI uses a uniquely matched AK2/IK5 result when possible. Group fallback conservatively reduces the matching AK9 status with every nested IK5 status, and whole-999 fallback reduces the aggregate with every flattened IK5 status. A non-accepted primary fallback remains authoritative. An accepted primary with any nested `unknown` becomes `unknown`; an accepted primary with any definitive non-clean nested result becomes `accepted_with_errors`, not the sibling's rejection or partial disposition. This prevents a raw accepted fallback from hiding a non-clean result or falsely assigning a sibling's disposition to this row, without changing the raw AK9 or IK5 fields. Null means no attributable 999 status is currently available.
        mdnStatus:
          type: string
          nullable: true
          enum:
            - pending
            - processed
            - warning
            - rejected
            - invalid
            - mic_mismatch
            - overdue
          description: |
            Compact normalized AS2 receipt-assurance status. Null means no MDN status applies or the asynchronous status projection has not indexed this row yet. Check `attentionSummary.freshness` on list responses before interpreting a null during projection bootstrap.
        messageId:
          type: string
          description: AS2 Message-Id for this transaction.
          example: msg-850-api
        transactionKey:
          type: string
          description: Transaction identifier within the AS2 message, usually `GS06#ST02`.
          example: 17#0001
        replyToMessageId:
          type: string
          nullable: true
          description: Present on outbound replies and points back to the inbound AS2 message id.
        replyToTransactionKey:
          type: string
          nullable: true
          description: |
            Exact inbound transaction key for an outbound reply, or `null` for a transaction that is not a reply. Related-transaction queries attach the reply only to this transaction inside `replyToMessageId`.
        direction:
          type: string
          description: 'Direction across the ModernEDI boundary: inbound from the partner or outbound to the partner.'
          enum:
            - inbound
            - outbound
          example: inbound
        partnerName:
          type: string
          description: Partner name captured for display; use `partnerId` for stable automation across renames.
          example: Customer One
        partnerId:
          type: integer
          nullable: true
          description: Persisted tenant-scoped partner id that authorizes this transaction and remains stable across partner renames.
          example: 1
        partnerConfigurationSha256:
          $ref: '#/components/schemas/PartnerConfigurationSha256'
        timestamp:
          $ref: '#/components/schemas/UtcTimestamp'
        transactionSet:
          description: ST01 code and reference description, with nullable fields when X12 metadata was unavailable.
          $ref: '#/components/schemas/TransactionSet'
        controlNumbers:
          description: ST02 and GS06 control numbers used to correlate the transaction with partner records.
          $ref: '#/components/schemas/TransactionControlNumbers'
        edi:
          description: X12 version, GS01/ST01 codes, and segment delimiter captured from the runtime.
          $ref: '#/components/schemas/TransactionEdiMetadata'
        businessKey:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TransactionBusinessKey'
          description: |
            Business key recorded on this transaction. Inbound keys come from the incoming map. Outbound keys are present when `/send`, `/reply`, or `/carbonCopy` supplied `businessKey` in the JSON request envelope; otherwise this is `null`.
        functionalAckOutcome:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FunctionalAcknowledgmentSummary'
          description: |
            Compact normalized whole-997 aggregate. Distinct AK1/AK9 groups are intentionally omitted from list responses; use `functionalAckGroupOutcome` for this row's selected compact group and transaction detail or the `functional-ack-x12` document metadata for every full group. A null value means no compact outcome was available, normally because no 997 is stored; list enrichment is fail-soft, so callers should use transaction detail before treating null as proof that no acknowledgment exists. Do not use the aggregate status as this row's status; use `functionalAckStatus` and `functionalAckEvaluationScope`.
        functionalAckTransactionOutcome:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FunctionalAcknowledgmentTransactionSetOutcome'
          description: |
            Exact AK2/AK5 result matched to this row by GS06/AK102 and ST02/AK202, with a leading-zero-insensitive control-number fallback only when it yields one unique match. Null means no unique transaction-set result could be attributed.
        functionalAckGroupOutcome:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/FunctionalAcknowledgmentGroupSummary'
          description: |
            Exact AK1/AK9 group matched to this row by GS06/AK102 and GS01/AK101. Exact control-number identity is preferred; a leading-zero-insensitive fallback is used only when it yields one unique group. Null means no group was uniquely attributable. This row-level projection omits the group's nested AK2 results to keep list, reply, and event payloads bounded; fetch transaction detail for the complete group tree.
        functionalAckEvaluationScope:
          type: string
          nullable: true
          enum:
            - transaction_set
            - functional_group
            - functional_acknowledgment
          description: |
            Outcome level ModernEDI used for `functional_ack_issue`. `transaction_set` uses a unique AK2/AK5 disposition while retaining the matching AK9 group separately. `functional_group` is used when AK2 is omitted or no unique transaction result exists. `functional_acknowledgment` is the conservative whole-997 fallback only when no AK1 group can be matched uniquely. Null means no 997 outcome was available.
        implementationAckOutcome:
          oneOf:
            - $ref: '#/components/schemas/ImplementationAcknowledgmentSummary'
            - type: object
              nullable: true
              enum:
                - null
          description: |
            Compact normalized whole-999 result plus distinct AK1/AK9 group outcomes. A null value normally means no 999 is stored. This remains the acknowledgment-wide context even when ModernEDI can evaluate this row against a narrower group or transaction result.
        implementationAckTransactionOutcome:
          oneOf:
            - $ref: '#/components/schemas/ImplementationAcknowledgmentTransactionSetOutcome'
            - type: object
              nullable: true
              enum:
                - null
          description: |
            Exact AK2/IK5 result matched uniquely to this row by the functional-group and transaction-set identifiers. Null means no unique transaction-set result could be attributed.
        implementationAckEvaluationScope:
          oneOf:
            - $ref: '#/components/schemas/ImplementationAcknowledgmentEvaluationScope'
            - type: object
              nullable: true
              enum:
                - null
          description: |
            Outcome level ModernEDI used for `implementation_ack_issue`. `transaction_set` selects a unique AK2/IK5 result; `implementation_group` selects a unique AK1/AK9 group and conservatively reduces it with nested IK5 statuses; `implementation_acknowledgment` conservatively reduces the aggregate with all flattened IK5 statuses when no unique group is attributable. Null means no 999 outcome was available.
        x12AcknowledgmentExpectedBy:
          type: string
          format: date-time
          nullable: true
          description: |
            Deadline used to classify a still-missing partner X12 acknowledgment for an eligible outbound business transaction. Outbound 997 and 999 acknowledgment documents are excluded. Receipt of either a correlated 997 or 999 satisfies the deadline. This is null when no deadline applies. Use the `x12_ack_overdue` attention reason, not this timestamp alone, as the authoritative active overdue signal. ModernEDI does not automatically resend the original X12 when the deadline passes.
        technicalAckRequested:
          type: boolean
          description: True when the outbound ISA14 requested a TA1 interchange acknowledgment. False for inbound traffic, outbound interchanges that did not request TA1, and legacy rows that predate this persisted signal.
        technicalAckStatus:
          $ref: '#/components/schemas/TechnicalAcknowledgmentStatus'
          description: Current TA1 lifecycle for this transaction. `pending` and `overdue` apply only when `technicalAckRequested` is true; `not_requested` means no deadline applies.
        technicalAckExpectedBy:
          type: string
          format: date-time
          nullable: true
          description: Deadline for a TA1 explicitly requested by outbound ISA14, or `null` when none was requested. Use `technical_ack_overdue` as the authoritative active overdue signal. ModernEDI does not automatically resend when this deadline passes.
        technicalAckOutcome:
          oneOf:
            - $ref: '#/components/schemas/TechnicalAcknowledgmentOutcome'
            - type: object
              nullable: true
              enum:
                - null
          description: Parsed TA1 outcome correlated by the original AS2 message id, or `null` while a requested TA1 is still pending or when none was requested.
    TransactionSet:
      description: X12 transaction-set identity captured from ST01 and the reference catalog.
      type: object
      properties:
        code:
          type: string
          nullable: true
          description: ST01 transaction-set identifier, or `null` when the runtime did not record one.
          example: '850'
        description:
          type: string
          nullable: true
          description: Human-readable ST01 document name, or `null` when the code is unavailable or unknown.
          example: Purchase Order
    TransactionControlNumbers:
      type: object
      properties:
        transaction:
          type: string
          nullable: true
          description: ST02 transaction control number.
          example: '0001'
        functionalGroup:
          type: string
          nullable: true
          description: GS06 functional group control number.
          example: '17'
    TransactionEdiMetadata:
      description: X12 envelope and delimiter context captured for a transaction.
      type: object
      properties:
        x12Version:
          type: string
          nullable: true
          description: Numeric X12 implementation version, or `null` when it was not recorded.
          example: '4010'
        functionalIdentifierCode:
          type: string
          nullable: true
          description: GS01 functional identifier code, or `null` when it was not recorded.
          example: PO
        transactionGroupType:
          type: string
          nullable: true
          description: ST01 transaction set identifier code recorded by the runtime.
          example: '850'
        segmentTerminator:
          type: string
          nullable: true
          description: Single-character segment terminator detected from the interchange, or `null` when unavailable.
          example: '~'
    TransactionBusinessKey:
      description: Customer-defined searchable transaction identifier used for reconciliation.
      type: object
      properties:
        name:
          type: string
          nullable: true
          description: Stable customer-facing identifier label, or `null` for older records that stored only a value.
          example: purchaseOrderNumber
        value:
          type: string
          description: Extracted or caller-supplied scalar identifier value stored as text.
          example: PO-100045
    TransactionMappedOutputMetadata:
      description: Metadata and map provenance for an application-facing document produced by an incoming map.
      type: object
      required:
        - id
        - sequenceNumber
        - purpose
      properties:
        id:
          type: string
          description: |
            Artifact identifier within the transaction response, such as `mapped-output-1`. This is not the managed-queue id and cannot be used with `/v1/mapped-outputs/{id}/ack`. Stored transaction details expose the queue correlation id separately as `delivery.outputId`.
          example: mapped-output-1
        sequenceNumber:
          type: integer
          description: One-based display order of this output within the transaction response.
          example: 1
        purpose:
          $ref: '#/components/schemas/MappingPurpose'
        contentType:
          type: string
          nullable: true
          description: Media type of the corresponding mapped-output document body, or `null` for historical artifacts without recorded content type.
          example: application/json
        createdAt:
          $ref: '#/components/schemas/NullableUtcTimestamp'
        businessKey:
          type: object
          nullable: true
          description: Map-derived reconciliation identifier, or `null` when the map did not produce one.
          allOf:
            - $ref: '#/components/schemas/TransactionBusinessKey'
        mapping:
          description: Map identity and source-revision comparison for this persisted output.
          $ref: '#/components/schemas/TransactionMappedOutputMapping'
        extraFields:
          type: object
          description: Runtime routing metadata captured with the output; this is not the map's selectable delivered context.
          additionalProperties:
            type: string
    TransactionMappedOutput:
      description: Complete response-only replay output, including the regenerated body.
      allOf:
        - $ref: '#/components/schemas/TransactionMappedOutputMetadata'
        - type: object
          required:
            - payload
          properties:
            payload:
              type: string
              nullable: true
              description: Mapped output body. Parse according to `contentType`.
    StoredTransactionMappedOutput:
      description: |
        Metadata for a mapped output persisted on a transaction detail. Unlike a response-only replay output, it omits the body and always includes delivery applicability and current handoff state. Fetch its indexed document to obtain the payload.
      allOf:
        - $ref: '#/components/schemas/TransactionMappedOutputMetadata'
        - type: object
          required:
            - delivery
          properties:
            delivery:
              $ref: '#/components/schemas/TransactionMappedOutputDelivery'
    TransactionMappedOutputDelivery:
      type: object
      description: |
        Handoff state for a mapped output stored on a transaction. This object is present on stored transaction-detail mapped outputs and omitted from response-only replay results, which do not enter the managed queue. `acknowledged` means acknowledged by your integration through the queue acknowledgment API or a successful mapped-output webhook; it does not prove how another application handled the document afterward.
      required:
        - applicability
        - status
        - availableAt
        - handoffIssue
        - attentionSince
        - outputId
        - deliveryCount
        - redelivered
        - firstDeliveredAt
        - lastDeliveredAt
        - leasedUntil
        - ackedAt
      properties:
        applicability:
          type: string
          enum:
            - managed_queue
            - not_applicable
          description: |
            `managed_queue` exposes a current polling/webhook state; `not_applicable` is a transaction-record-only artifact.
        status:
          type: string
          nullable: true
          enum:
            - ready
            - leased
            - acknowledged
          description: |
            Current managed-queue state, or null when applicability is not `managed_queue`. `ready` includes a never-leased output and an output whose prior lease expired. `leased` means the visibility timeout is still active. `acknowledged` means acknowledged by your integration.
        availableAt:
          description: |
            UTC instant when this generated output version became available for polling or webhook delivery. A durable replay creates a new output version with a new availability instant.
          allOf:
            - $ref: '#/components/schemas/NullableUtcTimestamp'
        handoffIssue:
          type: string
          nullable: true
          enum:
            - not_collected
            - acknowledgment_overdue
            - redelivered
          description: |
            Current actionable managed-output handoff issue, or null while the output is progressing normally, acknowledged, or not managed by the queue. `not_collected` means no first delivery lease was issued before the 15-minute pickup grace period expired. `acknowledgment_overdue` means the first lease expired without acknowledgment. `redelivered` means more than one delivery lease was issued without a later acknowledgment.
        attentionSince:
          description: |
            UTC instant when the current `handoffIssue` became actionable, or null when no handoff issue is active. For `not_collected`, this is 15 minutes after `availableAt`; for an overdue acknowledgment it is the first lease expiry; for a redelivery it is the most recent transition into the redelivered state.
          allOf:
            - $ref: '#/components/schemas/NullableUtcTimestamp'
        outputId:
          type: string
          nullable: true
          description: |
            Managed-queue correlation id for this generated output, or null when queue tracking does not apply. It is distinct from the mapped output's top-level transaction artifact `id`. It stays stable across ordinary processing retries that reproduce the same logical output. A successful durable replay creates a new id even when the regenerated content is identical. Acknowledgment still requires the latest `receiptHandle` returned by `GET /v1/mapped-outputs`; transaction detail does not provide that receipt handle.
        deliveryCount:
          type: integer
          minimum: 0
          nullable: true
          description: |
            Number of times the output has been leased for pull or webhook delivery attempts, or null when queue tracking does not apply. This count does not imply successful downstream processing.
        redelivered:
          type: boolean
          nullable: true
          description: True after more than one lease or delivery attempt; independent of the current status.
        firstDeliveredAt:
          description: UTC instant when the output was first leased for a pull or webhook delivery attempt.
          allOf:
            - $ref: '#/components/schemas/NullableUtcTimestamp'
        lastDeliveredAt:
          description: UTC instant when the output was most recently leased for a pull or webhook delivery attempt.
          allOf:
            - $ref: '#/components/schemas/NullableUtcTimestamp'
        leasedUntil:
          description: UTC instant when the current visibility lease expires, or null when no lease has been issued.
          allOf:
            - $ref: '#/components/schemas/NullableUtcTimestamp'
        ackedAt:
          description: |
            UTC instant when ModernEDI recorded acknowledgment by the customer's integration or a successful webhook response. This does not prove later ERP or business processing.
          allOf:
            - $ref: '#/components/schemas/NullableUtcTimestamp'
    TransactionMappedOutputMapping:
      description: Mapping identity and revision comparison recorded with a transaction's persisted output.
      type: object
      required:
        - versionStatus
      properties:
        id:
          type: integer
          nullable: true
          description: Workspace-scoped mapping id, or `null` when historical provenance is incomplete.
          example: 44
        type:
          type: string
          nullable: true
          description: Runtime mapping implementation name, or `null` when historical provenance is incomplete.
          example: ManagedQueueMapping
        file:
          type: string
          nullable: true
          description: Transform filename used to create the output, or `null` when not recorded.
          example: customer-one-850.jslt
        fileSha256Hash:
          type: string
          nullable: true
          description: Base64-encoded SHA-256 hash of the map file used when the inbound output was produced.
        currentFileSha256Hash:
          type: string
          nullable: true
          description: Base64-encoded SHA-256 hash of the currently published map file, when it can be resolved.
        versionStatus:
          type: string
          description: Whether the producing source is current, changed, missing, or cannot be compared.
          enum:
            - current
            - changed
            - missing
            - unknown
          example: current
        syntaxTreeCatalogRevision:
          type: string
          nullable: true
          pattern: ^[0-9a-f]{64}$
          description: Immutable grammar-catalog revision declared by the producing mapping execution; `null` for legacy records.
        syntaxTreeSha256:
          type: string
          nullable: true
          pattern: ^[0-9a-f]{64}$
          description: SHA-256 of the exact transaction-set grammar bytes used by the producing mapping execution; `null` for legacy records.
    MappingPurpose:
      type: string
      description: |
        Purpose of the runtime map that produced this output. `PROCESSING` means the output is for the normal application workflow. `ACKNOWLEDGMENT` means the output is an automatically generated response document.
      enum:
        - PROCESSING
        - ACKNOWLEDGMENT
      example: PROCESSING
    TransactionMdnStatus:
      type: string
      enum:
        - pending
        - processed
        - warning
        - rejected
        - invalid
        - mic_mismatch
        - overdue
      description: |
        Normalized AS2 receipt-assurance status. Only `processed` is a clean completed receipt; `pending` is still within the response window and every other state requires operator review.
    PartnerConfigurationSha256:
      type: string
      nullable: true
      pattern: ^[0-9a-f]{64}$
      description: |
        Lowercase SHA-256 of the exact partner runtime configuration recorded for this transaction, receipt, or acknowledgment. It is `null` for legacy rows written before configuration stamping. Scenario verification accepts persisted evidence only when this value exactly matches the partner configuration frozen into the applied binding.
      example: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    TransactionMdn:
      type: object
      required:
        - messageId
        - disposition
        - sent
        - timestamp
        - status
        - asynchronous
        - micMatched
        - receivedContentMic
        - expectedContentMic
        - expectedMicAlgorithm
        - expectedBy
        - validationError
        - partnerConfigurationSha256
      description: |
        AS2 message disposition notification (MDN) metadata without its report body. For an outbound document ModernEDI normally requests an asynchronous signed receipt. While that receipt is outstanding this object has `status: pending`; it becomes `overdue` after the platform response deadline, which defaults to one hour after send. A received receipt is accepted as `processed` only after its Original-Message-ID, requested MIC algorithm, returned MIC, and disposition are validated. Review `as2_mdn_attention` before resending; ModernEDI does not resend automatically because an invalid or missing receipt does not prove the partner failed to process the document.
      properties:
        messageId:
          type: string
          nullable: true
          example: mdn-850-api
          description: Message-ID of the MDN itself. Null while an asynchronous receipt is still pending or overdue.
        disposition:
          type: string
          nullable: true
          example: processed
          description: Raw AS2 Disposition field returned by the partner. Use normalized `status` for automation and retain this value for partner troubleshooting.
        sent:
          type: boolean
          nullable: true
          description: True when ModernEDI sent this MDN for an inbound document; false when it received or is awaiting the partner's MDN for an outbound document.
        timestamp:
          $ref: '#/components/schemas/NullableUtcTimestamp'
          description: Stored MDN timestamp used by the event timeline.
        status:
          $ref: '#/components/schemas/TransactionMdnStatus'
        asynchronous:
          type: boolean
          nullable: true
          description: True when the receipt was requested or delivered through the asynchronous Receipt-Delivery-Option callback rather than the original HTTP response.
        micMatched:
          type: boolean
          nullable: true
          description: Whether the partner's Received-content-MIC digest and algorithm matched the canonical content ModernEDI sent. Null while pending or when comparison was not possible.
        receivedContentMic:
          type: string
          nullable: true
          description: Partner-supplied Received-content-MIC value, including its algorithm token when present.
        expectedContentMic:
          type: string
          nullable: true
          description: Base64 digest ModernEDI calculated over the exact canonical MIME content sent to the partner.
        expectedMicAlgorithm:
          type: string
          nullable: true
          description: Receipt MIC algorithm ModernEDI requested from the partner; currently `sha1` for compatibility with legacy partner connections.
        expectedBy:
          $ref: '#/components/schemas/NullableUtcTimestamp'
          description: Deadline for a still-pending asynchronous receipt. Null after a receipt is recorded or when no reliable send timestamp is available.
        validationError:
          type: string
          nullable: true
          description: Specific validation or partner-disposition problem that caused `warning`, `rejected`, `invalid`, or `mic_mismatch`.
        partnerConfigurationSha256:
          $ref: '#/components/schemas/PartnerConfigurationSha256'
    FunctionalAcknowledgmentDetail:
      type: object
      description: Metadata and normalized outcome for a stored X12 997. Fetch the indexed functional-acknowledgment document for the X12 body.
      required:
        - messageId
        - sent
        - timestamp
        - partnerConfigurationSha256
        - mdn
        - outcome
        - evaluationScope
        - groupOutcome
        - transactionOutcome
        - evaluatedStatus
      properties:
        messageId:
          type: string
          nullable: true
          description: AS2 Message-Id of the stored 997, or `null` when only partial acknowledgment data was retained.
          example: fa-850-api
        sent:
          type: boolean
          nullable: true
          description: Delivery/persistence completion flag from the retained 997 record. True means its acknowledgment lifecycle completed, false means it did not, and `null` means the state is unavailable. This is not sender direction; use the transaction direction and timeline event type to determine whether ModernEDI sent or received the 997.
        timestamp:
          $ref: '#/components/schemas/NullableUtcTimestamp'
          description: Stored functional-acknowledgment timestamp used by the event timeline.
        partnerConfigurationSha256:
          $ref: '#/components/schemas/PartnerConfigurationSha256'
        mdn:
          type: object
          nullable: true
          description: AS2 receipt assurance state, or `null` when no MDN applies or was recorded.
          allOf:
            - $ref: '#/components/schemas/TransactionMdn'
        outcome:
          $ref: '#/components/schemas/FunctionalAcknowledgmentOutcome'
        evaluationScope:
          type: string
          nullable: true
          enum:
            - transaction_set
            - functional_group
            - functional_acknowledgment
          description: Whether this transaction was evaluated against its exact AK2/AK5 result, its uniquely matched AK1/AK9 group, or the whole-997 aggregate because no group was uniquely attributable.
        groupOutcome:
          type: object
          nullable: true
          description: Unique AK1/AK9 group outcome attributable to this transaction, or `null` when group identity is absent or ambiguous.
          allOf:
            - $ref: '#/components/schemas/FunctionalAcknowledgmentGroupOutcome'
        transactionOutcome:
          type: object
          nullable: true
          description: Exact AK2/AK5 outcome attributable to this transaction, or `null`.
          allOf:
            - $ref: '#/components/schemas/FunctionalAcknowledgmentTransactionSetOutcome'
        evaluatedStatus:
          type: string
          nullable: true
          description: Status selected for this transaction at `evaluationScope`, or `null` when no evaluation was available.
          allOf:
            - $ref: '#/components/schemas/FunctionalAcknowledgmentStatus'
    FunctionalAcknowledgmentOutcome:
      type: object
      description: |
        Normalized whole-997 aggregate. The aggregate does not collapse the distinct AK1/AK9 group results or AK2/AK5 transaction-set results. `groups` preserves every AK101/AK102 identity, its AK901 disposition, its AK902-AK904 counts, and nested AK5 outcomes. A contradictory AK5/count rollup is reported as unknown rather than trusting an internally inconsistent 997. Whenever `status` is `unknown`, inspect `unknownReason` and fetch the `functional-ack-x12` document when the original body is needed. A false `parsed` value indicates a structural failure; an unsupported AK901, AK501, or syntax-error code can be structurally parsed while its status remains unknown. The `unsupported_acknowledgment_code` reason does not by itself prove that AK901 was unsupported. Only `accepted` is a clean automation completion. `accepted_with_errors` and `unknown` require review; `partially_accepted` and `rejected` are failure or rejection outcomes that require action.
      required:
        - status
        - acknowledgmentCode
        - summary
        - parsed
        - unknownReason
        - includedTransactionSets
        - receivedTransactionSets
        - acceptedTransactionSets
        - errorCodes
        - groups
        - transactionSets
      properties:
        status:
          $ref: '#/components/schemas/FunctionalAcknowledgmentStatus'
        acknowledgmentCode:
          type: string
          nullable: true
          description: Common original AK901 code when every parsed group has the same code; otherwise `null`.
          example: A
        summary:
          type: string
          description: Human-readable whole-997 aggregate result; transaction-scoped displays should use `evaluatedStatus` and the selected group or transaction outcome.
          example: Functional group accepted; 1 of 1 received transaction set was accepted.
        parsed:
          type: boolean
          description: True when AK9 and all three AK902-AK904 counts were structurally valid.
        unknownReason:
          type: string
          nullable: true
          description: Machine-readable reason when `status` is `unknown`.
          enum:
            - missing_x12
            - not_997
            - invalid_structure
            - missing_ak9
            - invalid_ak9
            - unsupported_acknowledgment_code
            - inconsistent_rollup
        includedTransactionSets:
          type: integer
          minimum: 0
          nullable: true
          description: Sum of AK902 across every parsed group, or `null` when any group count is unavailable or the sum overflows.
        receivedTransactionSets:
          type: integer
          minimum: 0
          nullable: true
          description: Sum of AK903 across every parsed group, or `null` when any group count is unavailable or the sum overflows.
        acceptedTransactionSets:
          type: integer
          minimum: 0
          nullable: true
          description: Sum of AK904 across every parsed group, or `null` when any group count is unavailable or the sum overflows.
        errorCodes:
          type: array
          description: De-duplicated union of non-empty AK905 and later functional-group syntax error codes across every parsed group.
          items:
            type: string
        groups:
          type: array
          description: Distinct AK1/AK9 functional-group outcomes in source order; no sibling group is collapsed into another.
          items:
            $ref: '#/components/schemas/FunctionalAcknowledgmentGroupOutcome'
        transactionSets:
          type: array
          description: |
            Transaction-set results from paired AK2 and AK5 segments. Each result repeats its parent AK101/AK102 identity so flattened results remain attributable when an interchange contains multiple 997 groups.
          items:
            $ref: '#/components/schemas/FunctionalAcknowledgmentTransactionSetOutcome'
    FunctionalAcknowledgmentGroupOutcome:
      type: object
      required:
        - functionalIdentifierCode
        - functionalGroupControlNumber
        - functionalGroupVersion
