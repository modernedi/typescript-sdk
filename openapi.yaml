      summary: Configure mapped-output webhook delivery
      x-required-scope: configuration:write
      description: |
        **Required key scope:** `configuration:write`.

        Enables, disables, or rotates a partner's HTTPS mapped-output webhook. Send the current configuration ETag in `If-Match`. `endpointUrl` is required when enabling delivery and must be an absolute HTTPS URL without user information or a fragment and use a publicly routable host. Localhost, private, link-local, multicast, carrier-grade NAT, documentation, benchmark, and other reserved address targets are rejected. ModernEDI resolves the hostname again before every webhook delivery and sends only when all resolved addresses are publicly routable. Enabling a webhook without an existing signing secret creates one; `rotateSigningSecret: true` replaces it.

        The request body is strict JSON: unknown fields are rejected; `enabled` and `rotateSigningSecret` must be booleans; and `endpointUrl` must be a string or `null`. Type mismatches return `400 invalid_request` with the offending JSON pointer.

        A newly created or rotated `plainTextSigningSecret` appears only in this successful response. Save it immediately. Later reads expose only `signingSecretConfigured` and `signingSecretLastFour`.
      x-codeSamples:
