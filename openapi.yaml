            minimum: 1
          description: Tenant-scoped partner id returned by `GET /v1/partners`.
        - name: transactionSet
          in: query
          required: false
          schema:
            type: string
          description: X12 transaction-set identifier such as `850` or `856`.
        - name: businessKey
          in: query
          required: false
          schema:
            type: string
          description: Exact mapped-output business-key value.
        - name: messageId
