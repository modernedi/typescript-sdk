      servers:
        - url: https://api.modernedi.com
      security:
        - IntegrationApiKeyHeader: []
        - IntegrationApiKeyBearer: []
      parameters:
        - $ref: '#/components/parameters/TransactionEnvironment'
        - name: needsAttention
          in: query
          required: false
          schema:
            type: boolean
          description: |
            Filters by the authoritative operator-inbox projection. Use `true` to return transactions that currently need attention or `false` to return transactions with no active attention reason. Check `attentionSummary.freshness.complete` before treating an empty filtered page as proof that no transaction needs attention.
        - name: attentionReason
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/TransactionAttentionReason'
          description: |
            Repeat this parameter to select more than one attention reason; repeated values are ORed. Supplying a reason implies `needsAttention=true`, and combining a reason with `needsAttention=false` returns `400`. Repeat all explicit filters, including every reason, when following an opaque cursor.
        - name: mappingStatus
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/FilterableTransactionMappingStatus'
          description: |
            Exact consolidated mapping status. Repeat the parameter or use comma-separated values to select more than one status; values within this parameter are ORed. `UNAVAILABLE` cannot be selected because it describes a request-local telemetry read failure rather than a durable projected state. This filter is ANDed with `functionalAckStatus`, `implementationAckStatus`, `mdnStatus`, attention, and transaction metadata filters. Repeat it when following an opaque cursor and check `attentionSummary.freshness.complete` before drawing a conclusion from an empty page.
        - name: functionalAckStatus
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/FilterableFunctionalAcknowledgmentStatus'
          description: |
            Exact normalized 997 status selected for this transaction. ModernEDI uses a uniquely matched AK2/AK5 result when possible and otherwise uses the conservative AK9 group result. Repeat the parameter or use comma-separated values to select more than one status; values within this parameter are ORed. This filter is ANDed with the other filter categories. A missing actionable X12 acknowledgment is selected with `attentionReason=x12_ack_overdue`, not by this parameter. Repeat the filter when following an opaque cursor and check `attentionSummary.freshness.complete` before drawing a conclusion from an empty page.
        - name: implementationAckStatus
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/FilterableImplementationAcknowledgmentStatus'
          description: |
            Exact normalized 999 status selected for this transaction. ModernEDI uses a uniquely matched AK2/IK5 result when possible and otherwise uses the conservative AK9 implementation-group result. Repeat the parameter or use comma-separated values to select more than one status; values within this parameter are ORed. This filter is ANDed with the other filter categories. Transactions without an attributable 999 do not match this filter. Repeat it when following an opaque cursor and check `attentionSummary.freshness.complete` before drawing a conclusion from an empty page.
        - name: mdnStatus
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/FilterableTransactionMdnStatus'
          description: |
            Exact normalized AS2 receipt-assurance status. Repeat the parameter or use comma-separated values to select more than one status; values within this parameter are ORed. This filter is ANDed with the other filter categories. Transactions for which no MDN status applies have `mdnStatus: null` and do not match this filter. Repeat the filter when following an opaque cursor and check `attentionSummary.freshness.complete` before drawing a conclusion from an empty page.
        - name: startDate
          in: query
          required: false
          schema:
            type: string
          description: |
            Optional inclusive window start. Accepts an ISO date or an RFC 3339 date-time with an explicit offset. Date-only values start at 00:00:00 UTC. Date-times are normalized to UTC; offset-less date-times are rejected. When both dates are omitted, the query covers the standard active-workspace transaction-history window of the preceding 12 months. Specify dates when your client requires a particular interval, and do not infer deletion from an absent row.
          example: '2026-03-01T00:00:00.000000000Z'
        - name: endDate
          in: query
          required: false
          schema:
            type: string
          description: |
            Optional inclusive window end. Accepts the same formats as `startDate`; a date-only value includes the complete UTC day. When both dates are omitted, the query covers the preceding 12 months.
          example: '2026-03-31'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Cursor from the previous response.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 50
          description: Maximum number of transactions to return.
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum:
              - inbound
              - outbound
          description: Case-insensitive filter for the persisted inbound or outbound transaction direction.
        - name: partnerName
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive persisted partner name. This filters display metadata; transaction access remains scoped by persisted `partnerId`.
        - name: partnerId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: |
            Filters transactions by the tenant-scoped partner id returned by `GET /v1/partners`. The id remains stable when a partner is renamed. Transactions without a stored id are not returned.
          example: 1
        - name: transactionSet
          in: query
          required: false
          schema:
            type: string
          description: X12 transaction set code.
          example: '850'
        - name: businessKey
          in: query
          required: false
          schema:
            type: string
          description: |
            Exact business key value recorded on a transaction. Inbound keys come from the incoming map. Outbound keys are recorded only when `/send`, `/reply`, `/carbonCopy`, or a `/v1/as2/x12/...` endpoint is called with a JSON envelope that includes `businessKey`.
          example: PO-100045
        - name: messageId
