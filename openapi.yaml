  /v1/integration/events:
    parameters:
      - $ref: '#/components/parameters/CallerRequestId'
    get:
      operationId: listIntegrationChangeEvents
      tags:
        - Integration Events
      summary: Poll transaction-state changes
      x-required-scope: transactions:read
      description: |
        **Required key scope:** `transactions:read`.

        Returns a small invalidation feed for transaction state detected after an initial snapshot, including late mapping results, MDNs, 997 and 999 evaluations, mapped-output handoff changes, and attention changes. Events do not duplicate transaction detail. Refetch the referenced transaction to read authoritative current state.

        When `cursor` is omitted, ModernEDI returns no historical events, `bootstrap=true`, and a `nextCursor` positioned at the current high-water mark. A race-safe custom viewer should:

        1. Request this endpoint without a cursor and retain `nextCursor`.
        2. Load its current transaction snapshot from `/v1/integration/transactions`.
        3. Poll this endpoint again using the retained cursor.
        4. Refetch every transaction named by events that arrived while the snapshot loaded.

        Thereafter, keep sending each `nextCursor` back unchanged. `observedAt` is when the reconciliation sweep detected the change, not necessarily the partner's event time; event order is detection order. The feed is eventually consistent, so inspect `freshness.complete` and `freshness.status` before treating an empty poll as proof that no changes are pending.

        Change events have a rolling 30-day retention independent of retained transaction documents. Polling successfully refreshes the cursor's age. A client that resumes with an expired cursor receives `410 cursor_expired`; request a new bootstrap cursor and repeat the snapshot sequence.
      x-codeSamples:
        - lang: curl
          label: Bootstrap cursor
          source: |
            curl "https://api.modernedi.com/v1/integration/events?environment=production" \
              -H "x-api-key: $MODERNEDI_INTEGRATION_API_KEY"
        - lang: curl
          label: Poll from cursor
          source: |
            curl "https://api.modernedi.com/v1/integration/events?environment=production&cursor=$MODERNEDI_EVENT_CURSOR&limit=100" \
              -H "x-api-key: $MODERNEDI_INTEGRATION_API_KEY"
      servers:
        - url: https://api.modernedi.com
      security:
        - IntegrationApiKeyHeader: []
        - IntegrationApiKeyBearer: []
      parameters:
        - $ref: '#/components/parameters/TransactionEnvironment'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: |
            Opaque, integrity-protected cursor from `nextCursor`. It is bound to the authenticated tenant and selected environment and must be returned unchanged. A modified cursor, or one used with another tenant or environment, returns HTTP 400. Omit it only to establish a new high-water-mark bootstrap cursor.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 100
          description: Maximum events to return after the cursor.
      responses:
        '200':
          description: A bootstrap cursor or page of change events was returned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationChangeEventsResponse'
        '400':
          description: The cursor, environment, or limit was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/BillingInactiveError'
        '403':
          $ref: '#/components/responses/InsufficientScopeError'
        '410':
          description: |
            The cursor is older than retained change history. Error code `cursor_expired` includes `retentionSeconds`; obtain a bootstrap cursor and reload the transaction snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '414':
          $ref: '#/components/responses/QueryTooLargeError'
  /v1/integration/transactions:
    parameters:
      - $ref: '#/components/parameters/CallerRequestId'
    get:
      operationId: listIntegrationTransactions
      tags:
        - Transaction Viewer
      summary: List transactions
      x-required-scope: transactions:read
      description: |
        **Required key scope:** `transactions:read`.
        Returns a pageable transaction history for custom transaction viewers, dashboards, and reconciliation workflows. Outbound replies include `replyToMessageId` so they can be shown underneath the inbound document they answer. Each row includes the stable `needsAttention` operator signal, machine-readable `attentionReasons`, and a compact `mappingStatus` so unattended integrations can route failures without fetching every transaction detail. `functionalAckStatus`, `implementationAckStatus`, and `mdnStatus` expose the same compact status values used by their exact list filters. The root `attentionSummary` is an environment-wide count and reconciliation-freshness signal; it is not restricted to the requested page or date window. Exact mapping, functional-acknowledgment, implementation-acknowledgment, and MDN filters use that same asynchronous projection, so check `attentionSummary.freshness.complete` before treating an empty filtered page as proof that no matching transaction exists.
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl "https://api.modernedi.com/v1/integration/transactions?startDate=2026-03-01T00:00:00.000000000Z&endDate=2026-03-31T23:59:59.999999999Z&direction=inbound&partnerId=1&transactionSet=850&mappingStatus=NOT_RECORDED&functionalAckStatus=accepted,accepted_with_errors&mdnStatus=processed&limit=25" \
              -H "x-api-key: $MODERNEDI_INTEGRATION_API_KEY"
        - lang: Python
          label: Python
          source: |
            import os
