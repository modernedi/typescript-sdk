  /v1/as2/carbonCopy:
    parameters:
      - $ref: '#/components/parameters/CallerRequestId'
    post:
      operationId: sendAs2CarbonCopy
      tags:
        - Outbound AS2
      summary: Send a carbon copy of an inbound message flow to another partner
      x-required-scope: messages:write
      description: |
        **Required key scope:** `messages:write`.
        Sends a generated X12 document to a second partner while preserving context from a previously received inbound message. Send the source XML, JSON, or text input as the HTTP request body. The `partnerId` query parameter identifies the source/original partner whose outgoing map should generate the X12, and `copyToPartnerId` identifies the destination partner for the copied AS2 envelope. ModernEDI selects the matching outgoing map for that original/source partner, generates and validates X12, then forwards the carbon copy through the configured AS2 connection. Example: to generate an 856 ASN for Retailer One and copy it to Broker One, send `partnerId=1` and `copyToPartnerId=2`; ModernEDI uses partner 1's outgoing 856 map. `copyToPartnerId` does not select the outgoing map. JSON source maps can use XSLT with Saxon `json-to-xml($json)` or JSLT. For JSLT, ModernEDI sets the current input `.` to a wrapper object, so the source document is read through `.input` paths. If the outgoing map needs extra runtime parameters, send the JSON envelope shape with `input`, `contentType`, and `params`; the map is still selected by `partnerId`, not by `copyToPartnerId`. XSLT maps receive params as top-level stylesheet parameters, JSLT maps read them from `.params`, and mapper-editor params files are test fixtures only and are not read by live carbon-copy calls. The envelope's optional `businessKey` is recorded on the copied outbound transaction, but it does not affect map selection. Send `originalTransactionKey` when the source message contains multiple transaction sets and this copy belongs to one exact transaction.
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -X POST "https://api.modernedi.com/v1/as2/carbonCopy?partnerId=1&copyToPartnerId=2&x12Version=4010&functionalGroupType=SH&transactionGroupType=856&originalMessageId=msg-850-api" \
              -H "x-api-key: $MODERNEDI_INTEGRATION_API_KEY" \
              -H "Content-Type: application/json" \
              -H "Idempotency-Key: carbon-copy-asn-demo-1001" \
              --data '{
                "contentType": "application/xml",
                "input": "<PurchaseOrder><orderNumber>PO-DEMO-1001</orderNumber><shipment><id>ASN-DEMO-1001</id><date>20260526</date></shipment></PurchaseOrder>",
                "businessKey": {
                  "name": "shipmentId",
                  "value": "ASN-DEMO-1001"
                },
                "params": {
                  "bolNumber": "BOL-DEMO-8842",
                  "totalWeightInLbs": 1232.54,
                  "transactionSetControlNumber": "000002321"
                }
              }'
        - lang: Python
          label: Python
          source: |
            import os
            import requests

            response = requests.post(
                "https://api.modernedi.com/v1/as2/carbonCopy",
                params={
                    "partnerId": 1,
                    "copyToPartnerId": 2,
                    "x12Version": "4010",
                    "functionalGroupType": "SH",
                    "transactionGroupType": "856",
                    "originalMessageId": "msg-850-api",
                },
                headers={
                    "x-api-key": os.environ["MODERNEDI_INTEGRATION_API_KEY"],
                    "Content-Type": "application/json",
                    "Idempotency-Key": "carbon-copy-asn-demo-1001",
                },
                json={
