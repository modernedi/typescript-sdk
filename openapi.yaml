          description: Maximum number of mapped output messages to return.
        - name: visibilityTimeoutSeconds
          in: query
          required: false
          schema:
            type: integer
            minimum: 5
            maximum: 43200
            default: 120
          description: Seconds ModernEDI keeps returned messages hidden from later polls while your system processes them.
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum:
              - inbound
              - outbound
          description: Transaction direction. Mapped outputs normally come from inbound transactions.
        - name: partnerName
