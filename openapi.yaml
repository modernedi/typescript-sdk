        sent:
          type: boolean
          nullable: true
          description: Delivery/persistence completion flag from the retained 999 record. True means its acknowledgment lifecycle completed, false means it did not, and `null` means the state is unavailable. This is not sender direction; use the transaction direction and timeline event type to determine whether ModernEDI sent or received the 999.
        timestamp:
          $ref: '#/components/schemas/NullableUtcTimestamp'
          description: Stored implementation-acknowledgment timestamp used by the event timeline.
        partnerConfigurationSha256:
          $ref: '#/components/schemas/PartnerConfigurationSha256'
        mdn:
          type: object
          nullable: true
          description: AS2 receipt assurance state for the 999, or `null` when no MDN applies or was recorded.
          allOf:
            - $ref: '#/components/schemas/TransactionMdn'
        outcome:
          $ref: '#/components/schemas/ImplementationAcknowledgmentOutcome'
        evaluationScope:
          type: string
          nullable: true
          enum:
            - transaction_set
            - implementation_group
            - implementation_acknowledgment
          description: Whether this transaction was evaluated against its exact AK2/IK5 result, a unique AK1/AK9 group, or the conservative whole-999 aggregate.
