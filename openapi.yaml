  /v1/x12/versions/{x12Version}/transaction-sets:
    parameters:
      - $ref: '#/components/parameters/CallerRequestId'
    get:
      operationId: listX12TransactionSets
      tags:
        - X12 Tools
      summary: List transaction sets for an X12 version
      x-required-scope: configuration:read
      description: |
        **Required key scope:** `configuration:read`.
        Returns the transaction-set identifiers and descriptions available for the normalized X12 version. Both `4010` and `004010` style version values are accepted.
      security:
        - IntegrationApiKeyHeader: []
        - IntegrationApiKeyBearer: []
      parameters:
        - name: x12Version
          in: path
          required: true
          schema:
            type: string
          description: X12 version to normalize and look up. Both `4010` and `004010` forms are accepted.
          example: '004010'
      responses:
        '200':
          description: Transaction sets were returned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/X12TransactionSetsResponse'
        '400':
          description: The X12 version was invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
