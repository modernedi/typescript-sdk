            curl -X POST "https://api.modernedi.com/v1/x12/validate" \
              -H "x-api-key: $MODERNEDI_INTEGRATION_API_KEY" \
              -H "Content-Type: application/edi-x12" \
              --data-binary @purchase-order.edi
      security:
        - IntegrationApiKeyHeader: []
        - IntegrationApiKeyBearer: []
      requestBody:
        required: true
        description: Complete X12 interchange to validate, supplied directly as `application/edi-x12` or `text/plain`, or as the `x12` property of a JSON object.
        content:
          application/edi-x12:
            schema:
              type: string
          text/plain:
            schema:
              type: string
          application/json:
            schema:
              $ref: '#/components/schemas/X12ValidationRequest'
      responses:
        '200':
          description: X12 validation completed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/X12ValidationResponse'
        '400':
          description: The request body was empty or did not use a supported shape.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/BillingInactiveError'
        '403':
          $ref: '#/components/responses/InsufficientScopeError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
