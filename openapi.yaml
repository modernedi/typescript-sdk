  /v1/integration/transactions/{messageId}/{transactionKey}/replays:
    parameters:
      - $ref: '#/components/parameters/CallerRequestId'
      - $ref: '#/components/parameters/MessageId'
      - $ref: '#/components/parameters/TransactionKey'
    post:
      operationId: replayIntegrationTransaction
      tags:
        - Transaction Viewer
      summary: Replay an inbound transaction without redelivery
      x-required-scope: transactions:replay
      description: |
        **Required key scope:** `transactions:replay`.

        Re-runs mapping for one tenant-visible inbound transaction with the currently published maps and returns the regenerated mapped outputs directly. Historical map revision replay is not part of the public API.

        The only supported delivery is `response_only`. ModernEDI does not put regenerated outputs on the mapped-output queue, invoke mapped-output webhooks, or generate outbound acknowledgements. This endpoint is therefore suitable for inspection and controlled recovery without repeating downstream delivery side effects.

        Replay re-applies the currently active inbound protection policy. The stored inbound row must contain successful `signatureVerified` and `encryptionDecrypted` evidence for every protection required in the selected environment. A missing or `false` evidence value fails closed with an `insufficient-message-security:` replay error; consequently, older transactions without that evidence are not replayable while the corresponding protection remains required.

        `Idempotency-Key` is required. Repeating the same key and request returns the stored successful replay with `Idempotency-Replayed: true` and does not invoke mapping again. Reusing the key for different replay input returns `409 idempotency_key_conflict`; retry while the same replay is still processing returns `409 idempotency_key_in_progress` with `retryable: true`.

        The replay body is strict JSON: unknown fields are rejected, and `environment`, `mode`, `delivery`, and `reason` must be strings when present (`reason` may also be `null`). Type mismatches return `400 invalid_request` with the offending JSON pointer.
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -X POST \
              "https://api.modernedi.com/v1/integration/transactions/msg-850-api/17%230001/replays" \
              -H "Content-Type: application/json" \
              -H "x-api-key: $MODERNEDI_INTEGRATION_API_KEY" \
              -H "Idempotency-Key: replay-msg-850-api-17-0001-v1" \
              --data @examples/transaction-replay-request.json
        - lang: Python
          label: Python
          source: |
            import os
            import requests

            response = requests.post(
                "https://api.modernedi.com/v1/integration/transactions/msg-850-api/17%230001/replays",
                headers={
                    "x-api-key": os.environ["MODERNEDI_INTEGRATION_API_KEY"],
                    "Idempotency-Key": "replay-msg-850-api-17-0001-v1",
                },
                json={
                    "environment": "production",
                    "mode": "current_maps",
                    "delivery": "response_only",
                    "reason": "Verify corrected purchase-order mapping",
                },
                timeout=60,
            )
            response.raise_for_status()
            regenerated_outputs = response.json()["regeneratedOutputs"]
      security:
        - IntegrationApiKeyHeader: []
        - IntegrationApiKeyBearer: []
      parameters:
        - $ref: '#/components/parameters/ReplayIdempotencyKey'
      requestBody:
        required: true
        description: Replay request bodies may be at most 16 KiB (16,384 bytes).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionReplayRequest'
      responses:
        '200':
          description: Mapping replay completed or a stored successful result was returned.
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/ReplayIdempotencyReplayed'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionReplayResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/BillingInactiveError'
        '403':
          $ref: '#/components/responses/InsufficientScopeError'
        '404':
          description: The selected inbound transaction was not found in this tenant and environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The idempotency key conflicts with another request or the same replay is still processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '422':
          description: The selected transaction is outbound or otherwise cannot be replayed with the selected map mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Mapping replay failed. Inspect `error.retryable` before retrying the same idempotency key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
