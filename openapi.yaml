              -H "x-api-key: $MODERNEDI_INTEGRATION_API_KEY"
        - lang: Python
          label: Python
          source: |
            import os
            import requests

            response = requests.get(
                "https://api.modernedi.com/v1/partners",
                headers={"x-api-key": os.environ["MODERNEDI_INTEGRATION_API_KEY"]},
                timeout=30,
            )
            response.raise_for_status()
            partners = response.json()["partners"]
            partner_id_by_name = {partner["name"]: partner["partnerId"] for partner in partners}
        - lang: JavaScript
          label: JavaScript
          source: |
            const response = await fetch("https://api.modernedi.com/v1/partners", {
              headers: { "x-api-key": process.env.MODERNEDI_INTEGRATION_API_KEY },
            })

            if (!response.ok) {
              throw new Error(`ModernEDI partner list failed: ${response.status}`)
            }

            const { partners } = await response.json()
            const partnerIdByName = Object.fromEntries(
              partners.map((partner) => [partner.name, partner.partnerId]),
