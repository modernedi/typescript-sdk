        The webhook may be disabled while this connectivity test runs, but an endpoint and signing secret must already be saved. The API returns `200` after every completed attempt; inspect `delivered`, `statusCode`, and `error` for the destination outcome. `requestId` matches the `X-Request-Id` response header and is also included in the signed synthetic event for correlation.
