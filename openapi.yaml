  /v1/configuration/apply:
    parameters:
      - $ref: '#/components/parameters/CallerRequestId'
    post:
      operationId: applyIntegrationConfiguration
      tags:
        - Configuration as Code
      summary: Apply a planned workspace configuration
      x-required-scope: configuration:write
      description: |
        **Required key scope:** `configuration:write`.

        Atomically applies the exact desired bundle represented by a successful `POST /v1/configuration/plan` response. Send that response's non-null `planSha256` in the body and its exact quoted `currentSnapshotEtag` in `If-Match`. The body accepts the same `files` array as planning, including the optional exported `_state/snapshot.json` advisory file. The advisory file remains untrusted and never overrides live workspace state.

        ModernEDI revalidates the package, current snapshot, active syntax-tree catalog, complete scenario impact, and planned operations while holding workspace configuration locks. Any drift fails closed; apply never silently substitutes a newer plan. Database mutations commit as one aggregate change, mapping updates retain immutable revision history, creates use the caller-supplied stable resource keys, and a desired Partner whose key was retired is restored under that same key. Public operations remain `CREATE`, `UPDATE`, and `DELETE`; there is no separate reactivation verb.

        `Idempotency-Key` is required and scoped to the authenticated API key within the workspace. Persist one stable key with the intended change and reuse it only with the identical `planSha256`, `If-Match`, and logical files. A replay through that same API key returns the same operation and sets `Idempotency-Replayed: true`; using the key for a different semantic request returns `409 idempotency_key_conflict`, with the original operation's ID in `error.details.operationId`. A different API key has a separate idempotency namespace, even for the same workspace.

        Locked revalidation failures return the complete freshly evaluated `ConfigurationPlanResponse` under `error.details.plan`. A `412 configuration_plan_stale` means the submitted snapshot or plan identity is no longer current. A `422 configuration_apply_not_applicable` means the refreshed plan has semantic blockers. Neither response mutates workspace configuration; resolve the refreshed diagnostics and call the planning endpoint again before another apply.

        A `200` response has `operation.status: SUCCEEDED`. A `202` response has `operation.status: PENDING`: the database transaction has already committed, but the one workspace runtime publication is still being retried. Do not submit a new apply. Poll the URL in `Location` or call `GET /v1/configuration/apply-operations/{operationId}` until the stored operation is `SUCCEEDED`. Request bodies may be at most 16 MiB (16,777,216 bytes).
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -i -X POST "https://api.modernedi.com/v1/configuration/apply" \
              -H "Content-Type: application/json" \
              -H "x-api-key: $MODERNEDI_INTEGRATION_API_KEY" \
              -H "Idempotency-Key: deployment-2026-08-30-01" \
              -H 'If-Match: "41e0beb711cf83eb7c849b8aef48c5e35ea428645d357a3a2a731936f7000b38"' \
              --data @examples/configuration-apply-request.json
        - lang: JavaScript
          label: JavaScript
          source: |
            const request = JSON.parse(await fs.readFile("configuration-apply-request.json", "utf8"))
            const response = await fetch("https://api.modernedi.com/v1/configuration/apply", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "x-api-key": process.env.MODERNEDI_INTEGRATION_API_KEY,
                "Idempotency-Key": "deployment-2026-08-30-01",
                "If-Match": '"41e0beb711cf83eb7c849b8aef48c5e35ea428645d357a3a2a731936f7000b38"',
              },
              body: JSON.stringify(request),
            })
            const result = await response.json()
            if (!response.ok) throw new Error(result.error?.message ?? `Apply failed: ${response.status}`)
            console.log(result.operation.operationId, result.operation.status)
      security:
        - IntegrationApiKeyHeader: []
        - IntegrationApiKeyBearer: []
      parameters:
        - $ref: '#/components/parameters/ConfigurationApplyIdempotencyKey'
        - $ref: '#/components/parameters/ConfigurationApplyIfMatch'
      requestBody:
        required: true
        description: Exact planned desired files plus the plan identity. The logical files and both required headers are part of idempotent request identity.
