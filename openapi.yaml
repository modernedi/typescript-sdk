            type:
              type: string
              enum:
                - mdn
              description: Selects an AS2 MDN report renderer; this id selects compact 997-MDN metadata.
            metadata:
              $ref: '#/components/schemas/TransactionFunctionalAcknowledgmentMdnMetadata'
    TransactionImplementationAcknowledgmentMdnDocument:
      allOf:
        - $ref: '#/components/schemas/TransactionDocumentBase'
        - type: object
