            type:
              type: string
              enum:
                - implementation_ack
              description: Selects the X12 999 renderer and normalized acknowledgment metadata shape.
            metadata:
              $ref: '#/components/schemas/TransactionImplementationAcknowledgmentDocumentMetadata'
    TransactionTechnicalAcknowledgmentDocument:
      description: Stored X12 technical acknowledgment.
