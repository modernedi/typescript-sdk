        Returns server-managed mapped inbound documents for this tenant and temporarily marks them in progress. Transaction-record-only results and legacy direct-to-SQS or direct-to-DynamoDB outputs are not duplicated into this queue. If a returned message is not acknowledged before the visibility timeout expires, ModernEDI may return it again on a later poll. Push delivery uses the same queue state: a successful 2xx webhook response acknowledges the message, while a failed push leaves it available through this endpoint. Each request performs a bounded scan. When `hasMore` is true, send `nextCursor` as the next request's `cursor` so polling advances past unavailable or output-free transactions instead of rescanning them. A cursor may repeat while new leases advance through outputs in the same scan window; an empty page with `nextCursor` is not the end of the scan. Use the SDK's bounded mapped-output iterator, not ordinary list pagination. Despite using GET, a poll acquires leases and the SDKs do not automatically retry it. If a response is lost, its outputs become available again after the visibility timeout. This endpoint runs on the shared ModernEDI API host, not on the tenant AS2 hostname.
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl "https://api.modernedi.com/v1/mapped-outputs?limit=10&visibilityTimeoutSeconds=120" \
              -H "x-api-key: $MODERNEDI_INTEGRATION_API_KEY"
        - lang: Python
          label: Python
          source: |
            import os
            import requests

            response = requests.get(
                "https://api.modernedi.com/v1/mapped-outputs",
                params={"limit": 10, "visibilityTimeoutSeconds": 120},
                headers={"x-api-key": os.environ["MODERNEDI_INTEGRATION_API_KEY"]},
                timeout=30,
            )
            response.raise_for_status()
            messages = response.json()["messages"]
        - lang: JavaScript
          label: Node.js
          source: |
            const url = new URL("https://api.modernedi.com/v1/mapped-outputs")
            url.search = new URLSearchParams({
              limit: "10",
              visibilityTimeoutSeconds: "120",
            })

            const response = await fetch(url, {
              headers: {
                "x-api-key": process.env.MODERNEDI_INTEGRATION_API_KEY,
              },
            })
            if (!response.ok) {
              throw new Error(await response.text())
            }
            const { messages } = await response.json()
      servers:
        - url: https://api.modernedi.com
      security:
        - IntegrationApiKeyHeader: []
        - IntegrationApiKeyBearer: []
      parameters:
        - $ref: '#/components/parameters/TransactionEnvironment'
        - name: startDate
          in: query
          required: false
          schema:
            type: string
          description: |
            Optional inclusive transaction-window start. Accepts an ISO date or an RFC 3339 date-time with an explicit offset. Date-only values start at 00:00:00 UTC. Date-times are normalized to UTC; offset-less date-times are rejected.
          example: '2026-07-01T00:00:00.000000000Z'
        - name: endDate
          in: query
          required: false
          schema:
            type: string
          description: |
            Optional inclusive transaction-window end. Accepts the same formats as `startDate`; a date-only value includes the complete UTC day.
          example: '2026-07-15'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: |
            Opaque continuation cursor returned as `nextCursor`. When supplied, it retains the original transaction window; omit `startDate` and `endDate` or send the same normalized values.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
