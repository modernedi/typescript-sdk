  /v1/configuration/apply-operations/{operationId}/scenario-run-selections/{bindingId}:
    parameters:
      - $ref: '#/components/parameters/CallerRequestId'
    get:
      operationId: getConfigurationScenarioRunSelection
      tags:
        - Configuration as Code
      summary: Select a scenario run from an exact configuration apply
      x-required-scope: configuration:read
      description: |
        **Required key scope:** `configuration:read`.

        After an aggregate apply reaches `SUCCEEDED`, resolve the authored binding ID from `ScenarioBinding` source `metadata.id` into the exact `selection` accepted by `POST /v1/scenario-runs`. The response contains frozen runtime hashes, not source-file hashes. No browser visit, configuration mutation, run creation, or EDI dispatch occurs. Unchanged bindings are selectable after a no-op apply too.

        The complete current configuration snapshot must still equal this operation's `appliedSnapshotEtag`. A pending apply returns `409 configuration_apply_pending` with `Retry-After`; a different snapshot returns non-retryable `409 configuration_snapshot_changed`. A binding whose referenced runtime inputs are no longer current returns `409 scenario_binding_not_current`. Never silently substitute a later apply or recalculate hashes. Missing, retired, or reserved browser-managed bindings have no public selection.

        This is a point-in-time selection, not a workspace lock, a run, or a guarantee of runtime readiness. Run admission rechecks the selected binding and its referenced inputs. Unrelated configuration changes after discovery do not automatically invalidate a run start. Supply any required definition parameters, and persist the final start body and a new run idempotency key before starting. Starting requires `scenario-runs:write`; run reads and actual sends have separate scopes.
      security:
        - IntegrationApiKeyHeader: []
        - IntegrationApiKeyBearer: []
      parameters:
        - $ref: '#/components/parameters/ConfigurationApplyOperationId'
        - name: bindingId
          in: path
          required: true
          description: The authored ScenarioBinding source's metadata.id, not its portable resource UUID or display name.
          schema:
            type: string
            pattern: ^[A-Za-z][A-Za-z0-9_-]{0,127}$
          example: order-invoice-test
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl "https://api.modernedi.com/v1/configuration/apply-operations/$APPLY_OPERATION_ID/scenario-run-selections/order-invoice-test" \
              -H "x-api-key: $MODERNEDI_INTEGRATION_API_KEY"
      responses:
        '200':
          description: The current applied binding's exact start selection, without caller-supplied parameters.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationScenarioRunSelectionResponse'
              examples:
                testBinding:
                  summary: Frozen Test-traffic selectors after apply
                  value:
                    success: true
                    configurationApplyOperationId: apply-3ee360bd-7e41-4c55-80f8-3f1e5839804d
                    appliedSnapshotEtag: '"41e0beb711cf83eb7c849b8aef48c5e35ea428645d357a3a2a731936f7000b38"'
                    selection:
                      definition:
                        namespace: example.orders
                        key: order-invoice
                        version: '1'
                        contentSha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                      environment: test
                      binding:
                        id: order-invoice-test
                        revision: 3
                        contentSha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                      parameters: {}
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/BillingInactiveError'
        '403':
          $ref: '#/components/responses/InsufficientScopeError'
        '404':
