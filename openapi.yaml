                environment: production
                acknowledgment:
                  id: 7e8276c1d55988a4bf7fbf9f8c2d87187a24bd316dfed84bbf64397b8d5b6e4a
                  messageId: msg-850-api
                  mappedOutputKey: 17#0001#00001
                  ackedAt: '2026-04-29T15:34:10.000000000Z'
