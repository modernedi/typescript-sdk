      operationId: acknowledgeMappedOutput
      tags:
        - Mapped Output Queue
      summary: Mark mapped output as received
      x-required-scope: messages:write
      description: |
        **Required key scope:** `messages:write`.
        Records that your integration acknowledged custody of a previously returned mapped output message. Call this after the mapped output has been durably stored or enqueued for reliable processing in your system. This acknowledgment does not prove later ERP or business processing. The receipt handle must match the latest poll response for this mapped output id. A retry with the same id and receipt handle is idempotent: it returns the original acknowledgment and `ackedAt` value instead of failing. If a call ends without a definitive response, retry that same acknowledgment before polling. Poll for a new receipt only when the old lease is rejected or the message becomes available again; an acknowledged item is no longer returned by polling.
