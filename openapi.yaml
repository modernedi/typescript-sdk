        evaluatedStatus:
          type: string
          nullable: true
          description: Status selected for this transaction at `evaluationScope`, or `null` when no evaluation was available.
          allOf:
            - $ref: '#/components/schemas/ImplementationAcknowledgmentStatus'
    ImplementationAcknowledgmentOutcome:
      type: object
      description: |
        Normalized X12 999 result. The aggregate status does not collapse the distinct AK1/AK9 group results or AK2/IK5 transaction-set results. `groups` preserves each AK101/AK102/AK103 identity and its AK9 rollup; `transactionSets` provides the same IK5 results as one attributable flat list. A 999 reports X12 syntax and relational validation. It does not indicate semantic or business acceptance, and it is not HIPAA implementation-guide certification. Only `accepted` is a clean automation completion.
      required:
        - status
        - acknowledgmentCode
        - summary
        - parsed
        - unknownReason
        - includedTransactionSets
        - receivedTransactionSets
        - acceptedTransactionSets
        - errorCodes
        - groups
        - transactionSets
      properties:
        status:
          $ref: '#/components/schemas/ImplementationAcknowledgmentStatus'
        acknowledgmentCode:
          type: string
          nullable: true
          description: Aggregate acknowledgment code when one value represents the whole 999, or `null` for mixed or unavailable group results.
          example: A
        summary:
          type: string
          description: Human-readable aggregate result suitable for a transaction timeline or status panel.
          example: Implementation acknowledgment accepted; 1 of 1 received transaction set was accepted.
        parsed:
          type: boolean
          description: True when the 999 structure and required AK9 rollups were parsed successfully.
        unknownReason:
          type: string
          nullable: true
          description: Machine-readable reason when `status` is `unknown`.
          enum:
            - missing_x12
            - not_999
            - invalid_structure
            - missing_ak9
            - invalid_ak9
            - unsupported_acknowledgment_code
            - inconsistent_rollup
        includedTransactionSets:
          type: integer
          minimum: 0
          nullable: true
          description: Aggregate count of transaction sets included across the acknowledged groups, when available.
        receivedTransactionSets:
          type: integer
          minimum: 0
          nullable: true
          description: Aggregate count of transaction sets received across the acknowledged groups, when available.
        acceptedTransactionSets:
          type: integer
          minimum: 0
          nullable: true
          description: Aggregate count of received transaction sets accepted across the acknowledged groups, when available.
        errorCodes:
          type: array
          description: Distinct non-empty syntax error codes reported by the 999.
          items:
            type: string
        groups:
          type: array
          description: Distinct AK1/AK9 implementation-group outcomes in source order.
          items:
            $ref: '#/components/schemas/ImplementationAcknowledgmentGroupOutcome'
        transactionSets:
          type: array
          description: Flattened AK2/IK5 transaction-set outcomes; each result repeats its parent AK101/AK102 identity for attribution.
          items:
            $ref: '#/components/schemas/ImplementationAcknowledgmentTransactionSetOutcome'
