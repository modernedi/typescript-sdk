    ConfigurationScenarioDefinitionNamespace:
      type: string
      maxLength: 253
      pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)*$
      description: A lowercase, DNS-like ownership namespace.
    ConfigurationScenarioDefinitionToken:
      type: string
      pattern: ^[A-Za-z][A-Za-z0-9_-]{0,127}$
      description: A stable identifier beginning with a letter and containing at most 128 letters, digits, underscores, or hyphens.
    ConfigurationScenarioDefinitionArtifactVersion:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^(?!\s)(?!.*\s$)[^\u0000-\u001F\u007F]+$
      description: A trim-exact artifact version with no control characters. This versions a published definition; it is separate from apiVersion.
    ConfigurationScenarioDefinitionMetadata:
      title: Definition metadata
      description: Immutable identity of a published definition. The identity tuple is namespace, key, and version; contentSha256 is computed when the definition is published.
      type: object
      additionalProperties: false
      required:
        - namespace
        - key
        - version
      properties:
        namespace:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionNamespace'
        key:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
          description: Stable definition key within the namespace.
        version:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionArtifactVersion'
    ConfigurationScenarioDefinitionActor:
      title: Actor
      description: A business role. Bindings later connect each role to this workspace or a trading partner.
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
    ConfigurationScenarioDefinitionTransaction:
      title: Transaction
      description: The business document carried by a step. The server verifies the transaction-set code against ModernEDI's X12 catalog.
      type: object
      additionalProperties: false
      required:
        - standard
        - transactionSet
        - businessUsage
      properties:
        standard:
          enum:
            - X12
          type: string
          description: Transaction standard. v1 supports X12.
        transactionSet:
          type: string
          pattern: ^(?!(?:997|999)$)[0-9]{3}$
          description: Known three-digit X12 business transaction set, such as 850, 855, 856, 810, 875, 880, 940, 945, 204, 214, 300, 301, or 315. Use assurance for 997/999 acknowledgments.
        businessUsage:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
          description: Scenario-specific semantic role, such as purchase_order, shipment_notice, or ocean_status. It is intentionally more precise than the transaction-set code.
    ConfigurationScenarioDefinitionOccurrenceClosure:
      title: Occurrence closure
      description: The objective rule that tells a run no more documents are expected for one repeated step. fixed closes at the required fixed count; max_reached closes only at the authored maximum; expected_count closes at a required or defaulted run parameter, including an explicit zero. Branch selection supplies the no-document outcome for an unselected destination. There is no manual-close operation in v1.
      oneOf:
        - title: Fixed closure
          type: object
          additionalProperties: false
          required:
            - kind
          properties:
            kind:
              enum:
                - fixed
              type: string
              description: 'Close after the fixed min=max count is observed. Example: an 850 step with min=1 and max=1 closes after its one purchase order.'
        - title: Maximum-reached closure
          type: object
          additionalProperties: false
          required:
            - kind
          properties:
            kind:
              enum:
                - max_reached
              type: string
              description: 'Close only when the declared maximum count is observed. Example: a 315 status step with max=2 closes after the second status document.'
        - title: Expected-count closure
          type: object
          additionalProperties: false
          required:
            - kind
            - parameter
          properties:
            kind:
              enum:
                - expected_count
              type: string
              description: 'Close when the number of occurrences reaches an exact integer supplied by a required run parameter or a declared default. The value must fit this step''s occurrence bounds; steps sharing one count parameter must have overlapping bounds. Example: expectedShipmentCount=2 closes a repeated 945 step after two shipping-advice documents.'
            parameter:
              $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
    ConfigurationScenarioDefinitionOccurrence:
      title: Occurrence bounds
      description: How many documents this step may contribute to one run and the rule that says when no more are expected. One observed document is one occurrence. For example, an 850 order can be exactly once while 856 shipment notices can repeat. The server also enforces min <= max.
      type: object
      additionalProperties: false
      required:
        - min
        - max
      properties:
        min:
          type: integer
          minimum: 0
          maximum: 1000
          description: Minimum accepted count once a reachable step closes. Zero is a no-document outcome only when expected_count resolves to 0 or branch selection makes the step unreachable; zero alone does not close a stream.
        max:
          type: integer
          minimum: 1
          maximum: 1000
          description: Structural per-step ceiling for authored occurrences. Validate and Apply also enforce one conservative run-state capacity budget across all steps, paired documents, checks, and durable evidence.
        closure:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionOccurrenceClosure'
          description: 'The closure rule: the objective signal that no more documents are expected for this step. It may be omitted while authoring; Publish writes fixed when min equals max and max_reached otherwise. Because max_reached waits for the maximum, a min-zero unbranched step must instead use expected_count so a zero-document outcome is explicit.'
    ConfigurationScenarioDefinitionPositiveDuration:
      type: string
      format: duration
      pattern: ^P(?=.+)(?!0+(?:D|T(?:0+H)?(?:0+M)?(?:0+(?:\.0+)?S)?$))(?:[0-9]+D)?(?:T(?=[0-9])(?:[0-9]+H)?(?:[0-9]+M)?(?:[0-9]+(?:\.[0-9]+)?S)?)?$
      description: 'A positive ISO 8601 duration accepted by java.time.Duration, no longer than P365D. Examples: PT30M, PT4H, P2D. The server enforces the upper bound.'
    ConfigurationScenarioDefinitionAssuranceRequirement:
      title: Evidence requirement
      description: One observable proof required for a step. For example, mapping_succeeded proves that the selected map ran, while functional_or_implementation_acknowledgment_accepted proves accepted 997 or 999 evidence. Outgoing mapping proof may predate the document occurrence because mapping runs immediately before exchange; receipts and acknowledgments may not. A deadline is measured from the document occurrence to the terminal evidence time, and requires that evidence's own timestamp. Terminal evidence timestamped after the run's evaluation time is invalid.
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - mapping_succeeded
            - transport_receipt_accepted
            - interchange_acknowledgment_accepted
            - functional_or_implementation_acknowledgment_accepted
          description: mapping_succeeded proves mapper execution; transport_receipt_accepted proves the AS2 receipt; interchange_acknowledgment_accepted proves TA1 acceptance; functional_or_implementation_acknowledgment_accepted proves accepted 997 or 999 evidence.
        within:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionPositiveDuration'
          description: Optional deadline from the business document occurrence to terminal evidence. An outgoing mapping completed before exchange satisfies the lower timing boundary, but its own source timestamp is still required; missing terminal source time cannot prove a deadline.
    ConfigurationScenarioDefinitionAssurance:
      title: Evidence requirements
      description: Operational evidence required for each occurrence of this step. Duplicate requirement types are rejected by the server.
      type: object
      additionalProperties: false
      required:
        - requirements
      properties:
        requirements:
          type: array
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/ConfigurationScenarioDefinitionAssuranceRequirement'
          allOf:
            - {}
            - {}
            - {}
            - {}
    ConfigurationScenarioDefinitionValueType:
      type: string
      enum:
        - string
        - decimal
        - date
        - time
        - timestamp
        - boolean
        - list
        - set
      description: Closed evaluator value type. list and set contain scalar values only and require elementType.
    ConfigurationScenarioDefinitionScalarType:
      type: string
      enum:
        - string
        - decimal
        - date
        - time
        - timestamp
        - boolean
      description: Closed scalar type used directly or as the element type of list and set values.
    ConfigurationScenarioDefinitionFactDeclaration:
      title: Typed fact declaration
      description: Stable semantic ABI for one fact exposed by a step occurrence. The binding/runtime capability separately defines extraction provenance.
      type: object
      additionalProperties: false
      required:
        - name
        - type
        - cardinality
        - normalization
        - sensitivity
      properties:
        name:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
          description: Stable fact name used by discriminated fact operands and binding-side fact sources.
        type:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionValueType'
        elementType:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionScalarType'
          description: Required exactly when type is list or set; nested collections are not supported.
        cardinality:
          type: string
          enum:
            - one
            - optional
          description: Presence of the typed value on each occurrence. Collection multiplicity is expressed by type list/set, never by a separate many cardinality.
        normalization:
          type: array
          description: Ordered, deterministic normalization applied before typed evaluation.
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            enum:
              - trim
              - collapse_whitespace
              - uppercase
              - lowercase
              - decimal_canonical
        sensitivity:
          type: string
          enum:
            - business
            - personal
            - financial
            - health
            - restricted
          description: Data-handling classification carried with evidence and diagnostics.
    ConfigurationScenarioDefinitionPipelineStage:
      title: Composed step pipeline stage
      description: One named action in the ordered processing of an observed document. A definition says prepare, map, exchange, extract facts, check evidence, or emit a checkpoint; the binding later selects the concrete map, partner, or adapter. Keeping those artifact IDs out of the definition lets the same conversation recipe be reused by another tenant.
      oneOf:
        - title: Prepare stage
          type: object
          additionalProperties: false
          required:
            - id
            - kind
            - parameters
          properties:
            id:
              $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
            kind:
              enum:
                - prepare
              type: string
              description: Journal that named run parameters are available. Every referenced parameter must either be required at run start or declare a default.
            parameters:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items:
                $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
        - title: Map stage
          type: object
          additionalProperties: false
          required:
            - id
            - kind
          properties:
            id:
              $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
            kind:
              enum:
                - map
              type: string
              description: Confirm the exact runtime mapping selected by an applied binding. A step may declare this stage once, immediately next to exchange. Apply requires it before exchange for outgoing documents and after exchange for incoming documents.
        - title: Exchange stage
          type: object
          additionalProperties: false
          required:
            - id
            - kind
          properties:
            id:
              $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
            kind:
              enum:
                - exchange
              type: string
              description: Observe or perform the business-document exchange. Exactly one is required per step.
        - title: Extract stage
          type: object
          additionalProperties: false
          required:
            - id
            - kind
            - facts
          properties:
            id:
              $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
            kind:
              enum:
                - extract
              type: string
              description: Materialize declared semantic facts using binding/runtime-provided sources. Every declared fact must appear in exactly one extract stage.
            facts:
              type: array
              minItems: 1
              maxItems: 100
              uniqueItems: true
              items:
                $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
        - title: Assure stage
          type: object
          additionalProperties: false
          required:
            - id
            - kind
          properties:
            id:
              $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
            kind:
              enum:
                - assure
              type: string
              description: Evaluate the step's declared operational evidence requirements. A step may declare this stage at most once.
        - title: Checkpoint stage
          type: object
          additionalProperties: false
          required:
            - id
            - kind
            - checkpoint
          properties:
            id:
              $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
            kind:
              enum:
                - checkpoint
              type: string
              description: Emit a declared global checkpoint after the preceding stages complete. In v1, the containing step must have occurrence max 1 so the emitting occurrence is unambiguous.
            checkpoint:
              $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
    ConfigurationScenarioDefinitionStep:
      title: Step
      description: One directed X12 business-document exchange. Functional acknowledgments (997/999) are evidence requirements, not business steps.
      type: object
      additionalProperties: false
      required:
        - id
        - fromActor
        - toActor
        - transaction
        - occurrence
        - facts
        - pipeline
      properties:
        id:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
          description: Stable ID used by transitions, assertions, and bindings.
        fromActor:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
          description: ID of the actor sending this business document.
        toActor:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
          description: ID of the actor receiving this business document; it must differ from fromActor.
        transaction:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionTransaction'
        occurrence:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionOccurrence'
        assurance:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionAssurance'
        facts:
          type: array
          description: Typed semantic facts exposed by this step. Use an empty array when the step exposes none. Declarations name the stable ABI only; extraction provenance belongs to runtime capability and binding layers.
          maxItems: 100
          items:
            $ref: '#/components/schemas/ConfigurationScenarioDefinitionFactDeclaration'
        pipeline:
          type: array
          description: Ordered abstract processing stages for each step occurrence. Stages describe behavior without naming mapper or transport artifacts.
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/ConfigurationScenarioDefinitionPipelineStage'
    ConfigurationScenarioDefinitionFactProjection:
      type: string
      enum:
        - value
        - list
        - set
        - first
        - latest
      description: Select one declared per-occurrence fact value, aggregate values across occurrences as a list or set, or select the first/latest observed occurrence. Correlations require value.
    ConfigurationScenarioDefinitionFactOperand:
      title: Fact operand
      description: A declared semantic fact from a concrete step occurrence.
      type: object
      additionalProperties: false
      required:
        - kind
        - stepId
        - fact
        - projection
      properties:
        kind:
          enum:
            - fact
          type: string
        stepId:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
        fact:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
          description: Name from the referenced step's facts declaration.
        projection:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionFactProjection'
          description: How values are selected or aggregated across this step's occurrences. list/set require occurrence max greater than 1 and a scalar declared fact.
    ConfigurationScenarioDefinitionCorrelation:
      title: Correlation
      description: A condition that decides whether two actual documents belong to the same transition pair. equal can match the purchase-order number on an 850 and 810; same_set can compare their item sets; reply_link uses ModernEDI's stored reply relationship and accepts no fact operands.
      type: object
      additionalProperties: false
      required:
        - id
        - operator
      properties:
        id:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
        operator:
          type: string
          enum:
            - equal
            - same_set
            - reply_link
        left:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionFactOperand'
          description: For fact operators, must reference the transition's fromStep.
        right:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionFactOperand'
          description: For fact operators, must reference the transition's toStep.
    ConfigurationScenarioDefinitionMatchQuantifier:
      title: Occurrence match quantifier
      description: An explicit requirement over source occurrences, target occurrences, matched pairs, or matches per endpoint occurrence.
      oneOf:
        - title: Any quantifier
          type: object
          additionalProperties: false
          required:
            - kind
            - scope
          properties:
            kind:
              enum:
                - any
              type: string
            scope:
              type: string
              enum:
                - from
                - to
                - pairs
                - per_from
                - per_to
        - title: Every quantifier
          type: object
          additionalProperties: false
          required:
            - kind
            - scope
          properties:
            kind:
              enum:
                - every
              type: string
            scope:
              type: string
              enum:
                - from
                - to
                - pairs
                - per_from
                - per_to
        - title: Exact-count quantifier
          type: object
          additionalProperties: false
          required:
            - kind
            - scope
            - count
          properties:
            kind:
              enum:
                - exactly
              type: string
            scope:
              type: string
              enum:
                - from
                - to
                - pairs
                - per_from
                - per_to
            count:
              type: integer
              minimum: 1
              maximum: 1000
    ConfigurationScenarioDefinitionOccurrenceMatching:
      title: Occurrence matching
      description: How actual repeated documents are paired across a transition, plus what happens to documents with no match. correlate pairs documents whose declared fact or reply-link conditions pass; position pairs by observation order; previous pairs each revision with the immediately preceding occurrence of the same step, such as the second 860 order change with the first.
      oneOf:
        - title: Correlation matching
          type: object
          additionalProperties: false
          required:
            - strategy
            - quantifiers
            - unmatched
          properties:
            strategy:
              enum:
                - correlate
              type: string
              description: Pair occurrences whose declared correlation conditions pass.
            quantifiers:
              type: array
              minItems: 1
              maxItems: 10
              items:
                $ref: '#/components/schemas/ConfigurationScenarioDefinitionMatchQuantifier'
            unmatched:
              type: string
              enum:
                - fail
                - record
        - title: Positional matching
          type: object
          additionalProperties: false
          required:
            - strategy
            - quantifiers
            - unmatched
          properties:
            strategy:
              enum:
                - position
              type: string
              description: Pair source and target occurrences by stable observation order; correlations are forbidden.
            quantifiers:
              type: array
              minItems: 1
              maxItems: 10
              items:
                $ref: '#/components/schemas/ConfigurationScenarioDefinitionMatchQuantifier'
            unmatched:
              type: string
              enum:
                - fail
                - record
        - title: Previous-occurrence matching
          description: For a same-step supersedes transition whose step occurrence max is at least 2, pair occurrence n with n-1. The first occurrence is recorded as the initial revision, so both matching.unmatched and effect.unmatched must be record. A separate cross-step transition can link an initial 850 to the first 860. cancels uses a distinct cancellation-document step and cannot use previous matching.
          type: object
          additionalProperties: false
          required:
            - strategy
            - quantifiers
            - unmatched
          properties:
            strategy:
              enum:
                - previous
              type: string
            quantifiers:
              type: array
              minItems: 1
              maxItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                  - kind
                  - scope
                properties:
                  kind:
                    enum:
                      - every
                    type: string
                  scope:
                    enum:
                      - to
                    type: string
            unmatched:
              enum:
                - record
              type: string
              description: Record the first occurrence because it has no predecessor; later occurrences must match their immediate predecessor.
    ConfigurationScenarioDefinitionParameterOperand:
      title: Parameter operand
      description: A prepared run parameter usable in assertions, branch predicates, and effective-time expressions.
      type: object
      additionalProperties: false
      required:
        - kind
        - parameter
      properties:
        kind:
          enum:
            - parameter
          type: string
        parameter:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
    ConfigurationScenarioDefinitionLiteralOperand:
      title: Typed literal operand
      description: A closed typed JSON literal. list and set literals require scalar elementType and use a JSON array value.
      type: object
      additionalProperties: false
      required:
        - kind
        - type
        - value
      properties:
        kind:
          enum:
            - literal
          type: string
        type:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionValueType'
        elementType:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionScalarType'
        value:
          description: JSON value matching type and elementType. The server performs format and exact type validation.
    ConfigurationScenarioDefinitionValueOperand:
      title: Value operand
      description: Closed discriminated union used by assertions, branch predicates, and effective-time expressions.
      oneOf:
        - $ref: '#/components/schemas/ConfigurationScenarioDefinitionFactOperand'
        - $ref: '#/components/schemas/ConfigurationScenarioDefinitionParameterOperand'
        - $ref: '#/components/schemas/ConfigurationScenarioDefinitionLiteralOperand'
    ConfigurationScenarioDefinitionEffectiveAt:
      title: Revision effective time
      description: When a replacement or cancellation begins to govern the conversation. observed_at uses the time ModernEDI observed the later document. value uses an explicit timestamp, such as effectiveTimestamp extracted from an X12 860 order change. The value must be a timestamp, not only a date or clock time. A fact value belongs to the matched revision pair and must come from its source or later document; for a previous-matched same-step revision, it is read from the later revision occurrence.
      oneOf:
        - title: Time ModernEDI observed the revision
          type: object
          additionalProperties: false
          required:
            - kind
          properties:
            kind:
              enum:
                - observed_at
              type: string
        - title: Business effective timestamp
          type: object
          additionalProperties: false
          required:
            - kind
            - value
          properties:
            kind:
              enum:
                - value
              type: string
            value:
              $ref: '#/components/schemas/ConfigurationScenarioDefinitionValueOperand'
              description: Must resolve to a timestamp. For example, bind it to effectiveTimestamp extracted from the later X12 860. A fact operand requires value projection and one of the revision transition's endpoint steps; for a previous-matched same-step revision, it is read from the later revision occurrence.
    ConfigurationScenarioDefinitionRevisionEffect:
      title: Revision or cancellation effect
      description: What a matched replacement or cancellation changes. Raw immutable observation history means every received document remains stored unchanged; the revision rule changes only the run's interpreted business view. A revision transition does not open a next-document path by itself. Each branch-decision round first snapshots the steps already allowed; its conditions see only active reevaluate effects whose original and later-document steps are both in that snapshot, and a chosen path becomes available only in the next round. After branch selection, a revision affects checks only when both endpoint steps remain on the selected conversation path. If several active reevaluate effects target the same original document, the later effectiveAt wins; equal latest times fail with REVISION_EFFECT_CONFLICT instead of choosing arbitrarily.
      type: object
      additionalProperties: false
      required:
        - effectiveAt
        - downstream
        - unmatched
      properties:
        effectiveAt:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionEffectiveAt'
          description: When this replacement or cancellation begins to govern checks. Later active reevaluate effects take precedence for the same original document.
        downstream:
          type: string
          enum:
            - retain
            - reevaluate
          description: retain records the change and effective time but keeps using the original document for branch conditions, ordinary follows transitions, and assertions; for example, record an advisory 860 while later shipment checks still use the original 850. reevaluate recomputes those same consumers with the replacement or removal; for example, use the revised 860 values for later 856/810 checks, or remove a 301 booking confirmation after its 303 cancellation.
        unmatched:
          type: string
          enum:
            - fail
            - record
          description: Behavior when no prior effective occurrence can be revised or cancelled. previous matching requires record because the first occurrence is the initial revision and necessarily has no prior occurrence.
    ConfigurationScenarioDefinitionTransition:
      title: Transition
      description: A rule from one document step to another. Correlations identify which actual documents belong together. follows models ordinary order, such as a matching 810 invoice after an 850 order. supersedes records a replacement, such as a later 860 order change replacing the prior 850 or 860. cancels records a removal, such as an ocean 303 cancellation for a 301 booking confirmation. Supersedes and cancels inspect every stored observation before any replacement or cancellation is applied; they do not make an otherwise unavailable next-document path available and cannot themselves be branch alternatives.
      type: object
      additionalProperties: false
      required:
        - id
        - fromStep
        - toStep
        - relationship
        - matching
      properties:
        id:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
        fromStep:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
          description: Predecessor step ID.
        toStep:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
          description: Successor step ID. It may equal fromStep only for a supersedes transition that uses previous matching; cancellation is represented by a distinct cancellation-document step.
        relationship:
          type: string
          enum:
            - follows
            - supersedes
            - cancels
          description: Choose follows when a matched later document must occur at or after the earlier one, such as an 810 invoice after its 850 order. Choose supersedes when the later document replaces the matched earlier occurrence, such as an 860 order change replacing an 850 or prior 860. Choose cancels when the later document cancels the matched earlier occurrence, such as an ocean 303 cancelling a 301 booking confirmation. supersedes and cancels require effect to say when the change begins and whether later checks keep using the original document or reevaluate with the replacement/removal. Business labels such as acknowledges, reports status, or settles belong in the transition ID and prose unless an assertion or evidence requirement actually verifies them.
        within:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionPositiveDuration'
          description: Optional maximum elapsed time from the correlated fromStep occurrence to the toStep occurrence.
        correlations:
          type: array
          description: Conditions the scenario evaluator uses to pair actual source and target documents. For example, compare the purchase-order number extracted from an 850 with the purchase-order number extracted from an 810. Correlation IDs must be unique within this transition.
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/ConfigurationScenarioDefinitionCorrelation'
        matching:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionOccurrenceMatching'
          description: Required quantification and pairing semantics for concrete occurrences; the server does not infer them from correlations.
        effect:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionRevisionEffect'
          description: Required effective-time and downstream behavior for supersedes and cancels. Forbidden for follows.
    ConfigurationScenarioDefinitionAssertion:
      title: Assertion
      description: A fact rule that must hold for the run to pass. For example, exists can require every 810 invoice to expose invoiceTotal, sum_equal can compare shipped and invoiced totals, and monotonic can require successive 315 status timestamps to move forward. Binary operators require right; unary operators reject it.
      type: object
      additionalProperties: false
      required:
        - id
        - operator
        - left
      properties:
        id:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
        operator:
          type: string
          enum:
            - equal
            - not_equal
            - exists
            - unique
            - same_set
            - subset
            - sum_equal
            - less_than_or_equal
            - greater_than_or_equal
            - monotonic
        left:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionValueOperand'
        right:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionValueOperand'
    ConfigurationScenarioDefinitionParameter:
      title: Prepared run parameter
      description: A typed value supplied when a run starts through the Workspace UI or API, or resolved from its declared default when optional.
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - required
      properties:
        id:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
          description: Stable name used by prepare stages, expected-count closure, and parameter operands.
        type:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionValueType'
        elementType:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionScalarType'
          description: Required exactly when type is list or set.
        required:
          type: boolean
          description: Whether the run must explicitly provide this value. A required parameter cannot also have a default.
        default:
          description: Optional JSON value used when the run omits a non-required parameter.
    ConfigurationScenarioDefinitionCheckpoint:
      title: Checkpoint declaration
      description: A named completion event emitted by exactly one checkpoint pipeline stage after its preceding stages finish. For example, an X12 301 booking-confirmation step can emit bookingDisposition after exchange and fact extraction, allowing the run to choose the cancellation or shipping-instructions path.
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
    ConfigurationScenarioDefinitionPredicate:
      title: Branch predicate
      description: A yes/no condition evaluated after the branch's named checkpoint is emitted. For example, after an X12 301 emits bookingDisposition, compare the cancelRequested run parameter with true to select the X12 303 path. A fact condition must read the common source step of every alternative and that fact's extract stage must precede the checkpoint; it cannot read a destination document or later pipeline evidence to make that destination eligible. Every condition sees the conversation view from the start of the decision round, so one branch cannot use evidence made available by itself or a sibling branch in that round.
      type: object
      additionalProperties: false
      required:
        - id
        - operator
        - left
      properties:
        id:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
        operator:
          type: string
          enum:
            - equal
            - not_equal
            - exists
            - unique
            - same_set
            - subset
            - sum_equal
            - less_than_or_equal
            - greater_than_or_equal
            - monotonic
        left:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionValueOperand'
        right:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionValueOperand'
    ConfigurationScenarioDefinitionBranchAlternative:
      title: Branch alternative
      description: One ordinary follows transition that a branch may select, either when its conditions pass or as the explicit otherwise fallback. For example, cancelRequested=true selects the 301-to-303 follows transition; otherwise selects 301-to-304. supersedes and cancels transitions are revision records, not branch alternatives.
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - transitionId
        - conditions
      properties:
        id:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
        kind:
          type: string
          enum:
            - when
            - otherwise
        transitionId:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
          description: ID of a follows transition selected by this branch; supersedes and cancels transitions are not allowed.
        conditions:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ConfigurationScenarioDefinitionPredicate'
          description: Conditions may use parameters, literals, or facts from the alternatives' shared fromStep. They cannot read a destination step to select that destination.
    ConfigurationScenarioDefinitionBranch:
      title: Explicit branch
      description: 'A choice between mutually exclusive next-document paths after a named checkpoint. The checkpoint must be emitted by the alternatives'' shared source step, so the decision precedes every controlled destination. The emitter must also necessarily observe at least one document; expected_count closure with occurrence min 0 cannot emit a branch checkpoint. All alternatives leave the same source step. Example: after a 301 booking confirmation emits bookingDisposition, choose the 303 cancellation path when cancelRequested=true; otherwise choose 304 shipping instructions. exactly_one must choose one path and therefore requires an otherwise fallback. at_most_one may choose no path. A round evaluates only evidence already available when that round began; its selection can make later steps available in the next round.'
      type: object
      additionalProperties: false
      required:
        - id
        - mode
        - checkpoint
        - alternatives
      properties:
        id:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
        mode:
          type: string
          enum:
            - exactly_one
            - at_most_one
        checkpoint:
          $ref: '#/components/schemas/ConfigurationScenarioDefinitionToken'
        alternatives:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/ConfigurationScenarioDefinitionBranchAlternative'
          description: at_most_one accepts one or more when alternatives; exactly_one requires at least two alternatives and exactly one otherwise.
    ConfigurationScenarioDefinitionSpec:
      title: Scenario specification
      description: The business-conversation recipe. Actors name the business roles, steps name their X12 document exchanges, and transitions state how those exchanges relate. ModernEDI also verifies unique IDs, references, a connected conversation, and the absence of ordinary transition cycles during Validate and Publish. Omitted transitions, assertions, parameters, checkpoints, or branches mean empty arrays; published JSON materializes every collection.
      type: object
      additionalProperties: false
      required:
        - actors
        - steps
      properties:
        actors:
          type: array
          description: Business roles participating in the conversation. Every actor ID must be unique.
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ConfigurationScenarioDefinitionActor'
        steps:
          type: array
          description: Business-document exchanges. Every step ID must be unique and must reference two different declared actors.
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/ConfigurationScenarioDefinitionStep'
        transitions:
          type: array
          description: Rules connecting document steps. For example, an 810 invoice can follow its matching 850 purchase order, a later 860 can supersede an earlier order change, and an ocean 303 can cancel a matching 301 booking confirmation. Transition IDs must be unique. Except for a same-step supersedes revision chain, ordinary next-document paths cannot loop and every step must belong to one connected conversation.
          default: []
          maxItems: 2000
          items:
            $ref: '#/components/schemas/ConfigurationScenarioDefinitionTransition'
        assertions:
          type: array
          description: Run-level facts that must hold across one or more observed step occurrences. Assertion IDs must be unique.
          default: []
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ConfigurationScenarioDefinitionAssertion'
        parameters:
          type: array
          description: Prepared values supplied when a run starts. Parameters declare only their semantic type, required flag, and optional default; bindings and runtime APIs supply values.
          default: []
          maxItems: 100
          items:
            $ref: '#/components/schemas/ConfigurationScenarioDefinitionParameter'
        checkpoints:
          type: array
          description: Named completion events emitted after a step finishes a declared processing stage. A checkpoint can trigger a choice between allowed next steps. For example, a bookingDisposition checkpoint emitted after an X12 301 booking confirmation can choose between an X12 303 cancellation and X12 304 shipping instructions.
          default: []
          maxItems: 100
          items:
            $ref: '#/components/schemas/ConfigurationScenarioDefinitionCheckpoint'
        branches:
          type: array
          description: Explicit choices between allowed next-document transitions, evaluated only after a named checkpoint is emitted. For example, after an X12 301 booking confirmation emits bookingDisposition, cancelRequested=true can select the X12 303 cancellation path and otherwise can select X12 304 shipping instructions. Choices are evaluated in deterministic rounds from the steps already available at the start of that round; a destination document cannot provide the fact that selects its own path.
          default: []
          maxItems: 100
          items:
            $ref: '#/components/schemas/ConfigurationScenarioDefinitionBranch'
    ConfigurationScenarioBindingToken:
      type: string
      pattern: ^[A-Za-z][A-Za-z0-9_-]{0,127}$
      description: A stable identifier beginning with a letter and containing at most 128 letters, digits, underscores, or hyphens.
    ConfigurationScenarioBindingMetadata:
      title: Binding metadata
      description: Editable identity and display name for this binding draft. Apply creates an immutable binding revision.
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/ConfigurationScenarioBindingToken'
          description: Stable binding ID within the workspace.
        name:
          type: string
          minLength: 1
          maxLength: 160
          pattern: \S
          description: Human-readable binding name. The server trims leading and trailing whitespace when canonicalizing.
    ConfigurationScenarioBindingNamespace:
      type: string
      maxLength: 253
      pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)*$
      description: Lowercase namespace of the published ScenarioDefinition.
    ConfigurationScenarioBindingArtifactVersion:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^(?!\s)(?!.*\s$)[^\u0000-\u001F\u007F]+$
      description: Exact published definition version.
    ConfigurationScenarioBindingDefinitionReference:
      title: Published definition reference
      description: Exact identity and canonical content hash returned by Publish or the scenario catalog. Apply fails closed if any part differs.
      type: object
      additionalProperties: false
      required:
        - namespace
        - key
        - version
        - contentSha256
      properties:
        namespace:
          $ref: '#/components/schemas/ConfigurationScenarioBindingNamespace'
        key:
          $ref: '#/components/schemas/ConfigurationScenarioBindingToken'
        version:
          $ref: '#/components/schemas/ConfigurationScenarioBindingArtifactVersion'
        contentSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Lowercase SHA-256 digest of the canonical published definition.
    ConfigurationScenarioBindingEndpoint:
      title: Actor endpoint
      description: 'OneOf discriminator: workspace accepts only kind; partner also requires a positive tenant partner ID.'
      oneOf:
        - title: Workspace endpoint
          type: object
          additionalProperties: false
          required:
            - kind
          properties:
            kind:
              enum:
                - workspace
              type: string
              description: The current tenant workspace.
        - title: Partner endpoint
          type: object
          additionalProperties: false
          required:
            - kind
            - partnerKey
          properties:
            kind:
              enum:
                - partner
              type: string
            partnerKey:
              type: string
              format: uuid
              pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
              description: Stable Partner resource key in this configuration bundle; resolved to a workspace ID during apply.
    ConfigurationScenarioBindingActorBinding:
      title: Actor binding
      description: Connects one definition actor to this workspace or a current trading partner.
      type: object
      additionalProperties: false
      required:
        - actorId
        - endpoint
      properties:
        actorId:
          $ref: '#/components/schemas/ConfigurationScenarioBindingToken'
          description: Actor ID from the referenced ScenarioDefinition.
        endpoint:
          $ref: '#/components/schemas/ConfigurationScenarioBindingEndpoint'
    ConfigurationScenarioBindingSyntaxTreeReference:
      title: Syntax-tree reference
      description: Optional authoring-time pin to an exact X12 release and transaction set. Both fields are required when this object is present.
      type: object
      additionalProperties: false
      required:
        - x12Version
        - transactionSet
      properties:
        x12Version:
          type: string
          pattern: ^[Vv]?(?:00)?[1-9][0-9]{3}$
          example: '004010'
          description: X12 release token. Apply canonicalizes accepted forms to a six-digit release such as 004010.
        transactionSet:
          type: string
          pattern: ^[0-9]{3}$
          description: Known three-digit X12 transaction set. The code must match the referenced definition step.
    ConfigurationScenarioBindingTarget:
      title: Step target
      description: OneOf discriminator selecting an evidence-constrained runtime mapping, a registered active executor adapter, or observation-only evidence.
      oneOf:
        - title: Runtime mapping target
          type: object
          additionalProperties: false
          required:
            - kind
            - mappingKey
          properties:
            kind:
              enum:
                - runtime-mapping
              type: string
            mappingKey:
              type: string
              format: uuid
              pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
              description: Stable Mapping resource key in this configuration bundle; resolved to a workspace ID during apply.
        - title: Adapter target
          type: object
          additionalProperties: false
          required:
            - kind
            - adapterId
          properties:
            kind:
              enum:
                - adapter
              type: string
            adapterId:
              type: string
              minLength: 1
              maxLength: 256
              pattern: \S
              description: Registered active executor adapter ID. Apply verifies it implements this definition and step.
            mappingKey:
              type: string
              format: uuid
              pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
              description: Stable Mapping resource key in this configuration bundle; resolved to a workspace ID during apply.
        - title: Observation-only target
          type: object
          additionalProperties: false
          required:
            - kind
          properties:
            kind:
              enum:
                - observation-only
              type: string
              description: ModernEDI observes and evaluates this step but does not initiate it.
    ConfigurationScenarioBindingX12MapperExpressionSource:
      title: X12 Mapper expression fact source
      description: Evaluates one ordinary X12 Mapper expression against the step transaction. Validate and Apply use the same parser, semantic validator, function registry, budget mechanism, and syntax-tree-aware engine as runtime mappings and primaryKeyExtractor, with scenario-specific bounded limits. Validate and Apply reject an expression that is statically incapable of reading an X12 segment or element, and runtime fails closed when the executed path produces no concrete X12 read. Scenario evidence uses that engine's element-read tracing facility; this does not imply that existing primary-key persistence emits the same trace. The ScenarioDefinition remains authoritative for value type, cardinality, normalization, and sensitivity.
      type: object
      additionalProperties: false
      required:
        - kind
        - expression
      properties:
        kind:
          enum:
            - x12-mapper-expression
          type: string
          description: Uses ModernEDI's existing X12 Mapper expression language and engine, shared with primaryKeyExtractor.
        expression:
          type: string
          minLength: 1
          maxLength: 16384
          pattern: \S
          example: ST->BEG(03)
          description: One value-returning X12 Mapper expression that reads at least one X12 segment or element. A constant-only expression cannot provide authoritative document evidence. Scalars, lists, and sets are interpreted according to the matching fact declaration; secrets and credentials must never appear here.
    ConfigurationScenarioBindingFactSource:
      title: Fact source
      description: One ordinary X12 Mapper expression fact source. It uses the same language and execution engine as an incoming map's primaryKeyExtractor; v1 does not define a second scenario-specific selector language. The expression must read the bound X12 document so its value has concrete provenance.
      oneOf:
        - $ref: '#/components/schemas/ConfigurationScenarioBindingX12MapperExpressionSource'
    ConfigurationScenarioBindingFactSourceBinding:
      title: Fact source binding
      description: Binds one named fact declaration to one validated X12 Mapper expression. Fact names must be unique within a step.
      type: object
      additionalProperties: false
      required:
        - fact
        - source
      properties:
        fact:
          $ref: '#/components/schemas/ConfigurationScenarioBindingToken'
          description: Fact name declared by this exact ScenarioDefinition step.
        source:
          $ref: '#/components/schemas/ConfigurationScenarioBindingFactSource'
    ConfigurationScenarioBindingStepBinding:
      title: Step binding
      description: Connects one definition step to an executable or observation target and binds every declared semantic fact to an implementation-guide source. syntaxTree is optional while authoring; Apply resolves an exact authoritative syntax-tree artifact before runtime execution.
      type: object
      additionalProperties: false
      required:
        - stepId
        - target
      properties:
        stepId:
          $ref: '#/components/schemas/ConfigurationScenarioBindingToken'
          description: Step ID from the referenced ScenarioDefinition.
        syntaxTree:
          $ref: '#/components/schemas/ConfigurationScenarioBindingSyntaxTreeReference'
          description: Optional explicit implementation-guide identity. Omit it to let Apply select the exact current syntax tree from the authoritative mapping or adapter; an applied runtime binding is always resolved and immutable.
        target:
          $ref: '#/components/schemas/ConfigurationScenarioBindingTarget'
        factSources:
          type: array
          maxItems: 200
          description: One source for every fact declared by this ScenarioDefinition step. Omission is a deliberate authoring shorthand only when the step declares no facts; canonical Apply materializes an empty array. Server validation otherwise requires exact fact-name coverage. Collection shape, element type, cardinality, normalization, and sensitivity come only from the declaration and are intentionally not duplicated here.
          items:
            $ref: '#/components/schemas/ConfigurationScenarioBindingFactSourceBinding'
    ConfigurationScenarioBindingSpec:
      title: Binding specification
      description: References one exact published definition and binds all of its actors and steps. Apply resolves and freezes authoritative artifacts for runtime use.
      type: object
      additionalProperties: false
      required:
        - definition
        - environment
        - actors
        - steps
      properties:
        definition:
          $ref: '#/components/schemas/ConfigurationScenarioBindingDefinitionReference'
        environment:
          type: string
          enum:
            - production
            - test
          description: Required workspace traffic selector, frozen into the applied binding. Production and test traffic use the same deployed mappings; this does not deploy unpublished mappings or create another workspace. Runs use the selected AS2/X12 profile and keep transaction lookup, acknowledgments, and evidence in that environment, without falling back to the other profile.
        actors:
          type: array
          description: Exactly one binding for every definition actor. IDs must be unique; exactly one endpoint must be this workspace and at least one must be a current external partner.
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ConfigurationScenarioBindingActorBinding'
        steps:
          type: array
          description: Exactly one binding for every definition step. IDs must be unique.
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/ConfigurationScenarioBindingStepBinding'
