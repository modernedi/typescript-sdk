        partnerConfigurationSha256:
          $ref: '#/components/schemas/PartnerConfigurationSha256'
        outcome:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/TechnicalAcknowledgmentOutcome'
          description: Parsed TA1 result, or `null` when the retained technical-acknowledgment record has no TA1 X12 body.
    TransactionDocument:
      description: |
        One complete retained transaction artifact returned only by the individual document endpoint. Its `content` body is required.
      allOf:
        - $ref: '#/components/schemas/TransactionDocumentMetadata'
        - type: object
          required:
            - content
          properties:
            content:
              type: string
              description: Untrusted document body. Parse according to `contentType` and escape or sandbox it when rendering.
    TransactionDocumentMetadata:
      description: |
        Metadata for one retained transaction artifact. `type` selects the renderer and concrete `metadata` schema. The MDN shapes are further distinguished by stable `id`: `mdn-report` contains receipt-assurance metadata, while `functional-ack-mdn-report` and `implementation-ack-mdn-report` contain the Message-Id and disposition of the 997's or 999's own MDN. Document indexes never include `content`.
      oneOf:
        - $ref: '#/components/schemas/TransactionX12Document'
        - $ref: '#/components/schemas/TransactionMappedOutputDocument'
        - $ref: '#/components/schemas/TransactionMdnDocument'
        - $ref: '#/components/schemas/TransactionFunctionalAcknowledgmentDocument'
        - $ref: '#/components/schemas/TransactionImplementationAcknowledgmentDocument'
        - $ref: '#/components/schemas/TransactionTechnicalAcknowledgmentDocument'
        - $ref: '#/components/schemas/TransactionHttpResponseDocument'
      discriminator:
        propertyName: type
        mapping:
          x12: '#/components/schemas/TransactionX12Document'
          mapped_output: '#/components/schemas/TransactionMappedOutputDocument'
          mdn: '#/components/schemas/TransactionMdnDocument'
          functional_ack: '#/components/schemas/TransactionFunctionalAcknowledgmentDocument'
          implementation_ack: '#/components/schemas/TransactionImplementationAcknowledgmentDocument'
          technical_ack: '#/components/schemas/TransactionTechnicalAcknowledgmentDocument'
          http_response: '#/components/schemas/TransactionHttpResponseDocument'
    TransactionDocumentBase:
      type: object
      required:
        - id
        - type
        - label
        - contentType
        - encoding
        - timestamp
        - contentLength
        - metadata
      properties:
        id:
          type: string
          description: Stable artifact identifier within this transaction response, not a queue acknowledgment id.
          example: raw-x12
        type:
          type: string
          description: Machine-readable artifact category used to choose rendering and operator controls.
        label:
          type: string
          description: Customer-readable artifact name suitable for a transaction document list.
          example: Inbound X12
        contentType:
          type: string
          description: Media type describing how to parse or display `content`.
          example: application/edi-x12
        encoding:
          type: string
          description: Representation of `content`; currently all public transaction documents are returned as text.
          enum:
            - text
        timestamp:
          $ref: '#/components/schemas/NullableUtcTimestamp'
        contentLength:
          type: integer
          description: Length of the retained text artifact; use it as display context and to decide whether to fetch, not as a checksum.
          example: 256
        metadata:
          type: object
          description: Structured metadata whose concrete schema is selected by `type` and, for MDNs, `id`.
    TransactionX12Document:
      description: Raw inbound or outbound X12 transaction document.
      allOf:
        - $ref: '#/components/schemas/TransactionDocumentBase'
        - type: object
          properties:
            id:
              type: string
              enum:
                - raw-x12
              description: Stable id of the retained raw X12 artifact.
            type:
              type: string
              enum:
                - x12
              description: Selects the raw-X12 document renderer and empty metadata shape.
            metadata:
              $ref: '#/components/schemas/EmptyTransactionDocumentMetadata'
    TransactionMappedOutputDocument:
      description: Application-facing output produced by an inbound mapping.
      allOf:
        - $ref: '#/components/schemas/TransactionDocumentBase'
        - type: object
          properties:
            id:
              type: string
              pattern: ^mapped-output-[1-9]\d*$
              example: mapped-output-1
              description: Stable transaction-local artifact id derived from the mapped-output sequence number.
            type:
              type: string
              enum:
                - mapped_output
              description: Selects the mapped-output renderer and map-provenance metadata shape.
            metadata:
              $ref: '#/components/schemas/TransactionMappedOutputDocumentMetadata'
    TransactionMdnDocument:
      description: |
        AS2 MDN report. Inspect `id` to distinguish the original transaction's full MDN metadata from compact MDN metadata attached to a 997 or 999.
      oneOf:
        - $ref: '#/components/schemas/TransactionPrimaryMdnDocument'
        - $ref: '#/components/schemas/TransactionFunctionalAcknowledgmentMdnDocument'
        - $ref: '#/components/schemas/TransactionImplementationAcknowledgmentMdnDocument'
    TransactionPrimaryMdnDocument:
      allOf:
        - $ref: '#/components/schemas/TransactionDocumentBase'
        - type: object
          properties:
            id:
              type: string
              enum:
                - mdn-report
              description: Stable id of the original transaction's full MDN report.
            type:
              type: string
              enum:
                - mdn
              description: Selects an AS2 MDN report renderer; this id selects full receipt-assurance metadata.
            metadata:
