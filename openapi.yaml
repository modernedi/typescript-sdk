  /v1/configuration/export:
    parameters:
      - $ref: '#/components/parameters/CallerRequestId'
    get:
      operationId: exportIntegrationConfiguration
      tags:
        - Configuration as Code
      summary: Export the current workspace configuration bundle
      x-required-scope: configuration:read
      description: |
        **Required key scope:** `configuration:read`.

        Returns the workspace's current AS2 connections, active partners, published mappings, and optional scenario definitions and bindings as a deterministic logical file bundle. The response is JSON; ModernEDI does not create a ZIP archive, temporary download, or server-side filesystem tree. A caller may materialize the returned paths locally. Commit the portable `MANIFEST`, `RESOURCE`, and `SOURCE` files when using source control; `_state/snapshot.json` is observed server state and is normally kept outside desired configuration.

        Scenario documents use `spec.source` for their complete authored JSON. Bindings refer to the bundle's stable `partnerKey` and `mappingKey` UUIDs, never another workspace's numeric IDs. Optional syntax-tree pins remain optional. Retired scenario configuration, immutable runtime revisions and run evidence are excluded. See the [scenario configuration guide](https://www.modernedi.com/docs/scenarios/reference#configuration-and-git) and the linked resource schemas for examples and lifecycle rules.

        Every file carries a SHA-256 digest over its logical bytes. JSON file hashes use UTF-8 canonical JSON with object keys sorted recursively and array order preserved. Text file hashes use the exact stored UTF-8 source text, including its line endings. Files are sorted lexicographically by `path`.

        `modernedi.json` is the desired-state manifest and its digest is `bundleSha256`. `_state/snapshot.json` records the current database ids and public API ETags that correspond to the portable resource keys; its digest is `snapshotSha256`. `snapshotEtag` is the quoted snapshot digest returned in the HTTP `ETag` header. The manifest, resource documents, and snapshot state use `apiVersion: modernedi.com/v1`.

        Server-managed secrets are excluded. Public partner certificates and mapping source are configuration and are included. Treat the result as sensitive workspace configuration, keep the API key on a trusted server, and review customer-authored map source before sharing it.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -i "https://api.modernedi.com/v1/configuration/export" \
              -H "x-api-key: $MODERNEDI_INTEGRATION_API_KEY"
        - lang: JavaScript
          label: JavaScript
          source: |
            const response = await fetch("https://api.modernedi.com/v1/configuration/export", {
              headers: {
                "x-api-key": process.env.MODERNEDI_INTEGRATION_API_KEY,
                ...(previousEtag ? { "If-None-Match": previousEtag } : {}),
              },
            })

            if (response.status === 304) {
              console.log("Configuration has not changed")
            } else {
              if (!response.ok) throw new Error(`Configuration export failed: ${response.status}`)
              const bundle = await response.json()
              console.log(bundle.snapshotEtag, bundle.files.length)
            }
      security:
        - IntegrationApiKeyHeader: []
        - IntegrationApiKeyBearer: []
      responses:
        '200':
          description: The deterministic configuration bundle was returned.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ConfigurationSnapshotEtag'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoCache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationExportResponse'
              example:
                success: true
                bundleSha256: d5501d66cac6c3217149a92a41c8c7a801c81e764214c85c23bcd03cb20b6260
                snapshotSha256: bc6335b0ec499013e4f2ffbbb85666ed97bfce4bebdb5bd66496fe1333c671bb
                snapshotEtag: '"bc6335b0ec499013e4f2ffbbb85666ed97bfce4bebdb5bd66496fe1333c671bb"'
                files:
                  - path: _state/snapshot.json
                    role: STATE
                    format: JSON
                    mediaType: application/json
                    contentSha256: bc6335b0ec499013e4f2ffbbb85666ed97bfce4bebdb5bd66496fe1333c671bb
                    content:
                      apiVersion: modernedi.com/v1
                      kind: IntegrationConfigurationSnapshot
                      runtimeConfigurationRevision: 0
                      bundleSha256: d5501d66cac6c3217149a92a41c8c7a801c81e764214c85c23bcd03cb20b6260
                      resources: []
                  - path: modernedi.json
                    role: MANIFEST
                    format: JSON
                    mediaType: application/json
                    contentSha256: d5501d66cac6c3217149a92a41c8c7a801c81e764214c85c23bcd03cb20b6260
                    content:
                      apiVersion: modernedi.com/v1
                      kind: IntegrationConfiguration
                      resources: []
                      files: []
        '304':
          description: The caller's `If-None-Match` value matches the current snapshot ETag. The response has no body.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ConfigurationSnapshotEtag'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoCache'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/BillingInactiveError'
        '403':
          $ref: '#/components/responses/InsufficientScopeError'
  /v1/configuration/plan:
    parameters:
      - $ref: '#/components/parameters/CallerRequestId'
    post:
      operationId: planIntegrationConfiguration
      tags:
        - Configuration as Code
      summary: Plan desired workspace configuration
      x-required-scope: configuration:read
      description: |
        **Required key scope:** `configuration:read`.

        Compares a portable desired configuration bundle with the workspace's current AS2 connections, active partners, published mappings, and optional scenario definitions and bindings. Planning is read-only: it does not create, update, retire, publish, or reapply anything, and it does not require an idempotency key.

        Submit exactly one `MANIFEST` at `modernedi.json` plus every `RESOURCE` and `SOURCE` file inventoried by that manifest. You may pass the `files` array from configuration export unchanged: its single `_state/snapshot.json` `STATE` file is accepted as advisory context, but current workspace configuration remains authoritative. A stale advisory snapshot adds the `BASE_SNAPSHOT_STALE` warning; it does not make old database ids or ETags desired state. ModernEDI verifies safe paths, closed JSON objects, canonical file hashes, manifest inventory, stable resource keys, cross-resource references, mapping source, aggregate runtime limits, and the active syntax-tree catalog before comparing desired and current state.

        A structurally valid bundle always receives `200`, even when the desired state cannot be applied. Inspect `applicable` and every entry in `diagnostics`; each diagnostic carries an RFC 6901 JSON Pointer into the submitted request. `operations` contains only `CREATE`, `UPDATE`, and `DELETE` entries. `summary.unchanged` reports resources omitted from that array because their complete portable configuration is already current.

        Scenario bindings are compiled against the complete proposed configuration, so one apply can create their partners and maps too. Changing a referenced resource adds a binding `UPDATE` with unchanged authored content hashes: this creates a fresh runtime revision in the same transaction. `refreshScenarioBindings` explicitly requests that behavior for otherwise unchanged binding resource keys; include the same array in the apply request. Export followed by plan without refresh requests is a no-op.

        `scenarioImpactComplete` is false when ModernEDI could not safely determine every affected applied scenario. `affectedScenarios` distinguishes bindings refreshed by this apply (`REAPPLIED_BY_APPLY`), retired by it (`RETIRED_BY_APPLY`), or requiring a separate reapplication (`REAPPLY_REQUIRED`). `affectedRuns` identifies ACTIVE runs pinned to impacted binding revisions; those runs must be cancelled or completed before re-planning. `planSha256` is present only when the plan is applicable and binds the desired bundle, current snapshot, validation context, operations, and scenario impact. A later apply request must still prove that exact plan is current; this endpoint grants no mutation authority.

        Common planning diagnostics have deliberate recovery paths:

        - `BASE_SNAPSHOT_STALE` is a warning that the optional exported snapshot no longer matches the workspace. The returned plan still uses live current state.
        - `STAGED_CHANGE_REQUIRED` is an error when a natural identity such as an AS2 identifier or X12 sender identity belongs to another stable resource key. Release it from the current owner in a separate apply, export again, and then plan the transfer.
        - `ACTIVE_SCENARIO_RUNS_AFFECTED` is an error when a change would alter authority used by an ACTIVE scenario run. Complete or cancel every listed `affectedRuns` entry and plan again.

        Malformed envelopes, unsafe or duplicate paths, unsupported file roles, a noncanonical advisory `STATE` file, hash mismatches, and inconsistent manifests return `400 configuration_plan_invalid` with the same diagnostic shape in `error.details.diagnostics`. Request bodies may be at most 16 MiB (16,777,216 bytes).
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -X POST "https://api.modernedi.com/v1/configuration/plan" \
              -H "Content-Type: application/json" \
              -H "x-api-key: $MODERNEDI_INTEGRATION_API_KEY" \
              --data @examples/configuration-plan-request.json
        - lang: JavaScript
          label: JavaScript
          source: |
            const desired = JSON.parse(await fs.readFile("configuration-plan-request.json", "utf8"))
            const response = await fetch("https://api.modernedi.com/v1/configuration/plan", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "x-api-key": process.env.MODERNEDI_INTEGRATION_API_KEY,
              },
              body: JSON.stringify(desired),
            })
            const plan = await response.json()
            if (!response.ok) throw new Error(plan.error?.message ?? `Planning failed: ${response.status}`)
            console.log(plan.applicable, plan.summary, plan.diagnostics)
      security:
        - IntegrationApiKeyHeader: []
        - IntegrationApiKeyBearer: []
      requestBody:
        required: true
        description: Portable desired-state files, optionally accompanied by the one advisory `_state/snapshot.json` file returned by configuration export. The advisory file is never mutation authority.
        content:
