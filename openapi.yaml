openapi: 3.0.3
info:
  title: ModernEDI Integration API
  version: 1.35.0
  termsOfService: https://www.modernedi.com/terms
  contact:
    name: ModernEDI Integration Support
    url: https://www.modernedi.com/contact
    email: support@modernedi.com
  description: |
    Customer-facing integration endpoints for ModernEDI workspaces. Use this API when your ERP, WMS, integration service, or internal automation needs to export, plan, or apply workspace configuration, receive inbound partner documents as mapped business payloads, send XML/JSON/text source inputs that ModernEDI turns into outbound X12, send already-generated X12 without applying a map, validate X12, or inspect transaction activity across the whole exchange.

    ModernEDI keeps X12 at the trading-partner boundary instead of making it the shape your internal systems have to speak. Incoming maps translate partner X12 into JSON, XML, HTML, text, or another business format your system can process. Outgoing maps do the reverse: your system sends an XML, JSON, or text source document plus optional runtime params, and ModernEDI selects the matching outgoing map, generates the X12 transaction body, syntax-checks it, and sends it over AS2.

    ### Official SDKs

    ModernEDI-supported SDKs:

    - **TypeScript / JavaScript:** [`@modernedi/sdk` on npm](https://www.npmjs.com/package/@modernedi/sdk) — install with `npm install @modernedi/sdk`.

    Keep Integration API keys in a trusted server or backend-for-frontend; do not embed them in browser JavaScript or another client distribution that an end user can inspect.

    In the mapper editor, generated-X12 trace highlights can connect output values back to the map and source fixtures. XSLT maps trace generated values back to stylesheet instructions, source input values, and test params; JSLT maps use the same trace contract against ModernEDI's wrapper root, where source values live under `.input` and params under `.params`, including simple aliases such as `let po = .input`.

    A typical purchase-order-to-invoice round trip is:

    1. A partner sends an inbound 850 purchase order to ModernEDI.
    2. ModernEDI validates the inbound X12, applies the incoming map, and makes the mapped payload available through `GET /v1/mapped-outputs` or a mapped-output webhook.
    3. Call `POST /v1/mapped-outputs/{id}/ack` after your integration has durably stored the mapped output or enqueued it for reliable processing. This acknowledgment confirms custody, not later ERP or business processing.
    4. Your system builds an invoice, ASN, or other business reply as XML, JSON, or text.
    5. Call `POST /v1/as2/reply`; ModernEDI applies the matching outgoing map, generates X12, validates it, and sends the reply AS2 message.
    6. Use `/v1/integration/transactions` to confirm the inbound document, mapped output, generated outbound X12, AS2 receipts, 997 or 999 acknowledgments, and reply linkage.

    If you prefer push delivery, configure a per-partner mapped-output webhook in the ModernEDI workspace. ModernEDI sends the same mapped-output message shape to your HTTPS endpoint and automatically acknowledges the queue item only when your endpoint returns a 2xx response. Failed webhook attempts leave the message available through the pull API.

    Push webhook requests include `X-ModernEDI-Event`, `X-ModernEDI-Delivery-Id`, `X-ModernEDI-Timestamp`, and `X-ModernEDI-Signature`. `X-ModernEDI-Timestamp` is whole Unix epoch seconds. The signature is `sha256=<64 lowercase hexadecimal HMAC-SHA-256 characters>` over the exact bytes of `<timestamp>.<raw request body>` using the partner webhook signing secret. Verify the raw bytes with a constant-time comparison and reject timestamps outside a short freshness window before parsing or acting on the event. The official TypeScript SDK provides `verifyMappedOutputWebhook(...)` with a five-minute default tolerance. Timestamp freshness does not prevent replay within that window: after signature verification, durably record and reject duplicate `deliveryId` values. For production `mapped_output.available` processing, also use `message.id` as the durable business-processing idempotency key because a legitimate redelivery attempt receives a new `deliveryId`.

    `/v1/as2/send` is available when your system is first in the chain, such as sending a purchase order or another outbound document that is not replying to a received document. `/v1/as2/carbonCopy` uses the same outgoing-map selection as the original partner, then sends the generated X12 envelope to a second partner.

    Trading partner records can be created before an AS2 profile is known, which lets teams publish and test maps during migration. Use `GET /v1/partners` to list the partner ids your integration client can send as `partnerId` for exact outgoing-map selection. These AS2 endpoints require the matched destination partner to have a complete AS2 profile, destination URL, and X12 identity for the selected environment at send time; otherwise ModernEDI rejects the request before delivery.

    Key fields in the mapped-output and reply loop:

    - `id`: mapped output id used in the `/v1/mapped-outputs/{id}/ack` path.
    - `receiptHandle`: token from the latest poll, required when marking mapped output as received.
    - `messageId`: original inbound AS2 message id; use it as `originalMessageId` for `/v1/as2/reply`.
    - `transactionKey`: transaction identifier within the AS2 message, usually `GS06#ST02`.
    - `mappedOutputKey`: unique mapped-output key inside the transaction.
    - `purpose`: why the map result exists. `PROCESSING` is a normal mapped output for your application workflow, while `ACKNOWLEDGMENT` is an automatically generated response document such as a purchase order acknowledgment.
    - `payload`: mapped document body; parse it according to `contentType`.
    - `extraFields`: runtime routing metadata recorded by ModernEDI, such as `{"destination":"managedQueue"}`; it is not customer-selectable business metadata. Use an incoming mapping's closed `deliveredMetadata` object to include or omit the documented partner, transaction, X12, and map-source context fields.
    - `delivery`: stored transaction handoff state. `acknowledged` means acknowledged by your integration; it does not prove how another application handled the document afterward.
    - `replyToMessageId`: present on outbound replies and points back to the inbound message.

    For a transaction detail view, start with the metadata-first inbound transaction detail. Use its document index to discover retained X12, mapped output, MDN, 997, 999, and response artifacts, and fetch an individual document only when an operator opens it. Linked replies in `relatedTransactions` are compact summaries; fetch a reply's detail when selected.

    Common failures to handle include missing or invalid API keys, unknown partner names, missing outgoing maps, generated X12 syntax errors, `originalMessageId` not found, partner AS2 delivery failure, and mapped output returned again because it was not marked received before the visibility timeout.

    Every `/v1` response includes an `X-Request-Id` header. You may send a safe caller-generated `X-Request-Id` (1 to 128 characters using letters, numbers, `.`, `_`, `:`, `@`, `/`, `+`, `=`, or `-`); ModernEDI preserves it, or generates a replacement when it is absent or unsafe. Log the response value for both successful and failed calls so ModernEDI support can correlate the request with runtime logs. Error bodies repeat the same value as `error.requestId`.

    Integration API keys carry explicit least-privilege scopes. Read transaction history, mapped outputs, and usage or validate X12 without sending it with `transactions:read`; add or remove transactions from the operator watchlist with `transactions:write`; replay inbound transactions with `transactions:replay`; send messages and acknowledge mapped outputs with `messages:write`; export or plan aggregate configuration and read apply operations, partners, mappings, AS2 connections, the public AS2 profile, and webhook settings with `configuration:read`; and apply aggregate configuration, update webhook settings, or send webhook tests with `configuration:write`. Every operation below states its required scope. A valid key without that scope receives `403 insufficient_scope` with the required and granted scopes in `error.details`.

    Optional scenario automation has separate scopes: `scenario-runs:read` reads runs, timelines, and evidence reports; `scenario-runs:write` starts runs, attaches existing transactions, advances, and cancels. An advance that sends EDI additionally requires `messages:write`, using the same authenticated key. These permissions cover both Test and Production traffic in the workspace; they do not grant configuration changes. See the [scenario automation guide](https://www.modernedi.com/docs/scenarios/automation).

    Integration API keys are server-side credentials. Do not embed them in browser JavaScript, mobile applications, desktop binaries, or other distributions that an end user can inspect. A browser-based transaction viewer should call a customer-controlled backend or backend-for-frontend (BFF), and that server should call ModernEDI. CORS is a browser request policy, not protection for an exposed credential.

    Treat X12, MDN reports, raw HTTP response bodies, mapped outputs, and other partner-originated values as untrusted content. Escape them when displaying text, sanitize HTML against a narrow allowlist, or render active formats in a sandboxed frame. Do not insert these values directly into the DOM as trusted HTML.

    Structured JSON request bodies use strict schemas. Configuration bundles and transaction replay reject unknown fields at any documented object level rather than ignoring them, and scalar values must use the documented JSON type; for example, `"true"` is not accepted for a boolean and numeric ids are not accepted as strings. `null` is accepted only where the schema explicitly allows it. These failures return `400 invalid_request` with the offending JSON field path in the message.

    Public transaction timestamps are UTC instants formatted with exactly nine fractional digits and `Z`, for example `2026-07-15T18:30:00.000000000Z`. Transaction date-time filters must include an explicit RFC 3339 offset; date-only filters represent UTC calendar days. Offset-less date-times are rejected.

    While a workspace is active, ModernEDI normally keeps transaction documents and associated acknowledgements available in operational history for 12 months after processing. When both transaction `startDate` and `endDate` are omitted, ModernEDI queries that preceding 12-month window by default. Specify dates explicitly when a client requires a particular interval, and do not infer deletion merely because a record is absent from a response.

    For 90 days after a self-serve cancellation, authorized users can use read-only recovery mode to access records that remain within their applicable retention periods. Each transaction remains subject to its original 12-month window, which continues from its processing date and does not restart or extend at cancellation. An Enterprise order form may specify a different period. Content removed from the active service may remain in protected backup copies until those copies age out and is not ordinarily accessible through the workspace or Integration API.

    ModernEDI transaction history is intended for transaction operations, investigation, and recovery. It is not a legal archive, records-management service, or the customer's exclusive system of record. Export and independently retain records needed for business, tax, regulatory, contractual, or legal purposes.

    All customer-facing Integration API endpoints use `https://api.modernedi.com`. ModernEDI forwards outbound `/v1/as2/send`, `/v1/as2/reply`, `/v1/as2/carbonCopy`, and their `/v1/as2/x12/...` counterparts into the workspace AS2 runtime after authenticating the same Integration API key used by mapped-output and transaction-viewer endpoints.
servers:
  - url: https://api.modernedi.com
tags:
  - name: Scenario runs
    description: |
      Optional automation of the same evidence-bearing business conversations used in the browser. Mappings remain sufficient to process EDI; scenarios add conversation checks and proof, and Git is optional.

      Use scenario-runs:read for run state, timelines, and reports; scenario-runs:write for start, attach, advance, and cancel. Neither implies the other. Sending EDI also requires messages:write, including traffic initiated by a ModernEDI test partner. Configuration scopes are separate. These scopes cover both Test and Production traffic in the workspace; they are not Test-only credentials.

      See the [scenario automation guide](https://www.modernedi.com/docs/scenarios/automation) for the complete workflow, retry rules, and key setup.
  - name: Configuration as Code
    description: |
      Export deterministic workspace configuration, evaluate portable desired state, and apply one drift-checked aggregate change.

      The browser workspace remains the primary and simplest editing experience. Workspace owners may optionally open **Change history → External repository** and connect any private repository that supports authenticated HTTPS Git. ModernEDI then synchronizes the portable configuration directory in both directions about every 30 seconds. Browser or API changes are committed to the configured branch, while repository-only changes are planned and applied through the same aggregate write path.

      If the workspace and repository change differently after their last successful synchronization, ModernEDI pauses without overwriting either copy and asks the workspace owner which version to keep. Commits to the configured branch have workspace-configuration authority, so protect that branch and use a repository-specific, least-privilege token. The token is stored as an encrypted workspace secret and is never returned to the browser. Only the configured directory is managed, and ModernEDI never force-pushes.

      **Editing repository files.** Use ordinary JSON indentation, property order, and final newlines. Edit mapping source directly. ModernEDI derives mapping `transform.sourceSha256` and manifest `contentSha256` values from the selected commit before strict validation; do not maintain these checksums by hand. The configuration runner prepares local directories the same way. Keep stable resource keys and paths. When adding or removing files, update the explicit `modernedi.json` inventories too: missing inventoried files are errors, not implicit deletions. JSON formatting alone does not change desired configuration, but mapping source is hashed byte-for-byte. Direct API requests and reviewed apply plans still require exact checksums.

      Each remote operation is bounded to a 60-second elapsed-time budget, 64 MiB transferred, 16 MiB per Git object, 128 MiB expanded, and 20,000 checkout entries. These limits cover the whole selected branch, including files outside the managed directory. Use a configuration-focused repository. An oversized or slow repository stops synchronization without partially applying its contents.

      **Creating the repository access token.** This token comes from your Git provider; it is not a ModernEDI API key. Choose a private repository and confirm the exact branch name (for example, `main` or `master`) before connecting. An absent branch can be created by the first synchronization.

      - **GitHub:** follow [GitHub's fine-grained token guide](https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens). Select the repository owner, only the intended repository, and **Contents: read and write**. Use your GitHub username. Organization approval may be required before the token works.
      - **GitLab:** use a project-scoped token where available, or follow [GitLab's personal token guide](https://docs.gitlab.com/user/profile/personal_access_tokens/). Grant `write_repository` for HTTPS pull/push and use the token's Git username. A read-only deploy token cannot synchronize browser changes back to Git.
      - **Bitbucket Cloud:** follow [the repository token guide](https://support.atlassian.com/bitbucket-cloud/docs/create-a-repository-access-token/) and grant repository read/write. For this repository-token type, use `x-token-auth` as the Git username. Other Bitbucket token types have different username rules; follow their provider instructions.
      - **Other providers:** use their HTTPS Git credential instructions and restrict access to the selected repository. No provider-specific API integration is required.

      Set an expiration and retain the token in your password manager; never put it in the repository URL, bundle, or commit. Ensure the selected credential is allowed to push under the branch's protection rules. Revocation or expiry pauses successful synchronization without removing workspace configuration. To replace credentials with the current browser controls, disconnect and reconnect the same repository/branch/directory using the new token, compare any divergent copies before resolving, then revoke the old token. Browser editing remains available while synchronization is disconnected.
  - name: Partners
    description: Read workspace trading-partner records and stable partner ids.
  - name: AS2 Connections
    description: Read partner AS2 identifiers, destination URLs, public certificates, and transport settings.
  - name: Mappings
    description: Read incoming and outgoing mapping configuration and immutable mapping revisions.
  - name: Outbound AS2
    description: Send reply documents and standalone outbound AS2 messages through an existing ModernEDI partner connection.
  - name: Mapped Output Queue
    description: Receive mapped inbound documents by polling, or configure per-partner HTTPS push delivery in the workspace.
  - name: Transaction Viewer
    description: Read transaction history, documents, events, acknowledgements, linked replies, manage the operator watchlist, and perform safe response-only replays.
  - name: Mapping Runtime
    description: Inspect mapping health and safe failure diagnostics, including failures that occurred before a transaction could be created.
  - name: Integration Events
    description: Poll workspace-scoped invalidation events and refetch current transaction state after late acknowledgments or processing changes.
  - name: X12 Tools
    description: Validate X12 and discover the X12 versions and transaction sets available to the workspace.
  - name: Account
    description: Read current plan usage and enforcement status.
paths:
  /v1/scenario-runs:
    get:
      operationId: listScenarioRuns
      tags:
        - Scenario runs
      summary: List recent scenario conversations
      description: Returns a bounded workspace-scoped summary of recent runs for discovery and navigation without exposing fact values or evidence payloads.
      x-required-scope: scenario-runs:read
      security:
        - IntegrationApiKeyHeader: []
        - IntegrationApiKeyBearer: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum recent runs to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          example: 25
        - name: cursor
          in: query
          required: false
          description: Opaque tenant-bound keyset cursor returned as nextCursor by the preceding page. Return it unchanged.
          schema:
            type: string
            minLength: 1
            maxLength: 1024
            pattern: ^[A-Za-z0-9_-]+$
          example: eyJiZWZvcmVSdW5JZCI6InJ1bi01MDA3ZGJmMy1mMTE1LTRjYWMtODUzMC0xODhmYjQzMjZjNDUiLCJiZWZvcmVTdGFydGVkQXQiOiIyMDI2LTA4LTI0VDE4OjEwOjAwWiIsInRlbmFudElkIjo0MiwidiI6MX0
      responses:
        '200':
          description: The operation completed successfully.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              description: Private cache policy for tenant data.
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioRunCollection'
        '400':
          $ref: '#/components/responses/ScenarioRunError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/BillingInactiveError'
        '403':
          $ref: '#/components/responses/InsufficientScopeError'
        '500':
          $ref: '#/components/responses/ScenarioRunError'
    post:
      operationId: startScenarioRun
      tags:
        - Scenario runs
      summary: Start a run from an exact applied binding
      description: Starts a durable run from exact definition and binding hashes in the binding's production or test traffic environment. Both environments share deployed mappings, but transactions, dispatch, acknowledgments, and evidence remain in the selected environment. Optional typed parameters are checked against the definition before any operation is accepted. Registered adapter targets prepare their selected-profile runtime dependencies before the run is inserted; temporary preparation failures are retryable and return Retry-After. Does not send EDI. It uses an already applied binding and never publishes authored definitions or applies desired configuration. The reserved browser-managed binding cannot be selected here; apply your own binding (including one using a managed example). The key is scoped to operations in this workspace, not restricted to Test traffic.
      x-required-scope: scenario-runs:write
      security:
        - IntegrationApiKeyHeader: []
        - IntegrationApiKeyBearer: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Required command identity. Replays require byte-equivalent normalized input.
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: scenario-run-20260824-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartScenarioRunRequest'
            example:
              definition:
                namespace: acme
                key: retail-order-invoice
                version: 1.0.0
                contentSha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
              environment: production
              binding:
                id: retailOrderInvoice
                revision: 0
                contentSha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
              parameters: {}
      responses:
        '201':
          description: The immutable resource or durable run was created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Location:
              description: Canonical route for the created run.
              schema:
                type: string
                format: uri-reference
              example: /v1/scenario-runs/run-5007dbf3-f115-4cac-8530-188fb4326c45
            ETag:
              description: Opaque strong scenario-run entity tag. Return it unchanged as If-Match for the next run command.
              schema:
                type: string
              example: '"scenario-run:v1:42:cnVuLTUwMDdkYmYzLWYxMTUtNGNhYy04NTMwLTE4OGZiNDMyNmM0NQ:1"'
            Cache-Control:
              description: Private cache policy for tenant data.
              schema:
                type: string
              example: private, no-store
            Idempotency-Replayed:
              description: true when the response replays a prior result for the same key and request.
              schema:
                type: boolean
              example: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioRunCommandResponse'
        '400':
          $ref: '#/components/responses/ScenarioRunError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/BillingInactiveError'
        '403':
          $ref: '#/components/responses/InsufficientScopeError'
        '409':
          $ref: '#/components/responses/ScenarioRunError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '429':
          $ref: '#/components/responses/ScenarioRunError'
        '500':
          $ref: '#/components/responses/ScenarioRunError'
        '503':
          $ref: '#/components/responses/ScenarioRunError'
  /v1/scenario-runs/{runId}:
    get:
      operationId: getScenarioRun
      tags:
        - Scenario runs
      summary: Read current scenario run state and evidence
      description: Returns the current durable revision, evidence-bearing observations, checks, outcome, and strong ETag. Sensitive fact values are redacted from the public representation.
      x-required-scope: scenario-runs:read
      security:
        - IntegrationApiKeyHeader: []
        - IntegrationApiKeyBearer: []
      parameters:
        - name: runId
          in: path
          required: true
          description: Durable scenario run identifier.
          schema:
            type: string
            pattern: ^run-[0-9a-f-]+$
          example: run-5007dbf3-f115-4cac-8530-188fb4326c45
      responses:
        '200':
          description: The operation completed successfully.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              description: Opaque strong scenario-run entity tag. Return it unchanged as If-Match for the next run command.
              schema:
                type: string
              example: '"scenario-run:v1:42:cnVuLTUwMDdkYmYzLWYxMTUtNGNhYy04NTMwLTE4OGZiNDMyNmM0NQ:1"'
            Cache-Control:
              description: Private cache policy for tenant data.
              schema:
                type: string
              example: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioRunViewResponse'
        '400':
          $ref: '#/components/responses/ScenarioRunError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/BillingInactiveError'
        '403':
          $ref: '#/components/responses/InsufficientScopeError'
        '404':
          $ref: '#/components/responses/ScenarioRunError'
        '500':
          $ref: '#/components/responses/ScenarioRunError'
  /v1/scenario-runs/{runId}/advance:
    post:
      operationId: advanceScenarioRun
      tags:
        - Scenario runs
      summary: Advance adapter work or reevaluate graph deadlines
      description: 'Advances server-controlled adapter work or refreshes/re-evaluates the existing graph, using the same runtime as the browser. Every fresh external dispatch, including ModernEDI test-partner-originated traffic, additionally requires messages:write on the authenticated key. The same key is reused automatically; no second credential is accepted in the body. Reconciliation and observation-only evaluation need no send scope. retry.requiresApiKey describes the browser''s supplemental credential, not API authorization: false never exempts a dispatch from messages:write. A lost-response retry must reuse the original Idempotency-Key and If-Match. An already-recorded failed operation is replayed without another dispatch; to attempt a retryable failed action again, fetch the current ETag and use a fresh key. Follow structured guidance rather than hard-coding bundled step names.'
      x-required-scope: scenario-runs:write
      security:
        - IntegrationApiKeyHeader: []
        - IntegrationApiKeyBearer: []
      parameters:
        - name: runId
          in: path
          required: true
          description: Durable scenario run identifier.
          schema:
            type: string
            pattern: ^run-[0-9a-f-]+$
          example: run-5007dbf3-f115-4cac-8530-188fb4326c45
        - name: Idempotency-Key
          in: header
          required: true
          description: Required command identity. Replays require byte-equivalent normalized input.
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: scenario-run-20260824-001
        - name: If-Match
          in: header
          required: true
          description: Current strong run-revision ETag returned in the run body or ETag response header.
          schema:
            type: string
            description: Opaque strong scenario run ETag; return unchanged.
          example: '"scenario-run:v1:42:cnVuLTUwMDdkYmYzLWYxMTUtNGNhYy04NTMwLTE4OGZiNDMyNmM0NQ:1"'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdvanceScenarioRunRequest'
            example: {}
      responses:
        '200':
          description: The operation completed successfully.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              description: Opaque strong scenario-run entity tag. Return it unchanged as If-Match for the next run command.
              schema:
                type: string
              example: '"scenario-run:v1:42:cnVuLTUwMDdkYmYzLWYxMTUtNGNhYy04NTMwLTE4OGZiNDMyNmM0NQ:1"'
            Cache-Control:
              description: Private cache policy for tenant data.
              schema:
                type: string
              example: private, no-store
            Idempotency-Replayed:
              description: true when the response replays a prior result for the same key and request.
              schema:
                type: boolean
              example: false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioRunCommandResponse'
        '400':
          $ref: '#/components/responses/ScenarioRunError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/BillingInactiveError'
        '403':
          $ref: '#/components/responses/InsufficientScopeError'
        '404':
          $ref: '#/components/responses/ScenarioRunError'
        '409':
          $ref: '#/components/responses/ScenarioRunError'
        '412':
          $ref: '#/components/responses/ScenarioRunError'
        '413':
          $ref: '#/components/responses/PayloadTooLargeError'
        '428':
          $ref: '#/components/responses/ScenarioRunError'
        '500':
          $ref: '#/components/responses/ScenarioRunError'
        '503':
          $ref: '#/components/responses/ScenarioRunError'
  /v1/scenario-runs/{runId}/cancel:
    post:
      operationId: cancelScenarioRun
      tags:
        - Scenario runs
      summary: Cancel an active scenario run
      description: Records an actor-attributed operator cancellation as an inconclusive terminal result while preserving all evidence already gathered. Cancellation is optimistic-concurrency controlled and idempotent, and it does not interrupt a command that still owns the run. If a command stops without saving a result and its temporary ownership period expires, ModernEDI records that attempt as failed and claims cancellation as one durable change. If the abandoned command may already have affected an external system, its failed timeline entry remains available for manual reconciliation. Each run can store at most 256 command records. The initial start and all later ordinary commands share 253 records; the remaining three are held for one retry record, cancellation, and a retry of cancellation. Result documents for ordinary commands share a 32 MiB budget, with additional space held for those same three reserved records.
      x-required-scope: scenario-runs:write
      security:
        - IntegrationApiKeyHeader: []
        - IntegrationApiKeyBearer: []
      parameters:
        - name: runId
          in: path
          required: true
          description: Durable scenario run identifier.
          schema:
            type: string
            pattern: ^run-[0-9a-f-]+$
          example: run-5007dbf3-f115-4cac-8530-188fb4326c45
        - name: Idempotency-Key
          in: header
          required: true
          description: Required command identity. Replays require byte-equivalent normalized input.
          schema:
            type: string
            minLength: 1
            maxLength: 200
