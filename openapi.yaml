  /v1/mappings/{mappingId}/revisions:
    parameters:
      - $ref: '#/components/parameters/CallerRequestId'
      - name: mappingId
        in: path
        required: true
        description: Tenant-scoped mapping id.
        schema:
          type: integer
          minimum: 1
    get:
      operationId: listIntegrationMappingConfigurationRevisions
      tags:
        - Mappings
      summary: List a mapping's configuration history
      x-required-scope: configuration:read
      description: |
        **Required key scope:** `configuration:read`.

        Returns one page of immutable mapping-configuration revisions, newest first. A configuration-only change creates a distinct revision even when its transform source is unchanged. Page entries intentionally omit source text; fetch one revision by id to preview or diff its transform. Follow `nextCursor` while `hasMore` is true. Cursors are opaque and must be sent back unchanged.

        `currentRevision` always contains the complete currently published transform source and exact configuration identity, even when that configuration's chronological entry is outside this page. It and `currentEtag` are read from the same locked configuration snapshot, so clients can use them as an authoritative diff baseline. If `currentEtag` changes between page requests, restart from the first page before presenting a coherent history view.

        `sourceHash` identifies only transform text. `configurationSha256` identifies the complete immutable mapping configuration and may be `null` for a legacy revision recorded before exact configuration identities. `current` compares the complete configuration identity. The API exposes the retained transform and configuration for inspection, diffing, and reviewed desired-configuration workflows.
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl "https://api.modernedi.com/v1/mappings/31/revisions" \
              -H "x-api-key: $MODERNEDI_INTEGRATION_API_KEY"
      security:
        - IntegrationApiKeyHeader: []
        - IntegrationApiKeyBearer: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque `nextCursor` from the preceding configuration-history page. Omit for the first page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum chronological configuration-revision summaries to return. `currentRevision` is returned separately and does not count against this limit.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Mapping configuration history was returned. The response `ETag` matches `currentEtag` and protects the complete currently published mapping.
          headers:
            ETag:
              $ref: '#/components/headers/ConfigurationEtag'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MappingConfigurationRevisionListResponse'
        '400':
          $ref: '#/components/responses/InvalidRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/BillingInactiveError'
        '403':
          $ref: '#/components/responses/InsufficientScopeError'
        '404':
          $ref: '#/components/responses/ConfigurationNotFoundError'
        '414':
          $ref: '#/components/responses/QueryTooLargeError'
