          $ref: '#/components/responses/UnauthorizedError'
        '402':
          $ref: '#/components/responses/BillingInactiveError'
        '403':
          $ref: '#/components/responses/InsufficientScopeError'
        '414':
          $ref: '#/components/responses/QueryTooLargeError'
components:
  responses:
    ScenarioRunError:
      description: |
        Scenario request, binding, revision, or runtime failure. The stable error.code and error.retryable describe the failure; error.details may contain operationStatus, currentEtag, the current run, or a capacity limit. A failed durable operation must be retried with the current ETag and a fresh Idempotency-Key; reuse the original key only to recover its original outcome. Respect Retry-After. A 404 does not reveal whether a run belongs to another workspace.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        ETag:
          schema:
            type: string
          description: Current run revision when available.
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Seconds before retrying the indicated retryable operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedError:
      description: Missing or invalid integration API key.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
