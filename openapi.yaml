    parameters:
      - $ref: '#/components/parameters/CallerRequestId'
    get:
      operationId: listX12Versions
      tags:
        - X12 Tools
      summary: List available X12 versions
      x-required-scope: configuration:read
      description: |
        **Required key scope:** `configuration:read`.

        Returns X12 versions for which the tenant has reference syntax trees.
      security:
        - IntegrationApiKeyHeader: []
        - IntegrationApiKeyBearer: []
      responses:
        '200':
