    post:
      operationId: replyToInboundAs2Message
      tags:
        - Outbound AS2
      summary: Send a follow-up document tied to an inbound message
      x-required-scope: messages:write
      description: |
        **Required key scope:** `messages:write`.
        Sends a follow-up document such as an ASN or invoice in response to a previously received inbound message. Send the source XML, JSON, or text input as the HTTP request body. ModernEDI looks up the original message by `originalMessageId`, and uses unambiguous metadata from that inbound transaction to recover an omitted partner selector and `x12Version`. When the inbound AS2 message contains more than one transaction set, send `originalTransactionKey` to bind the reply to the exact `GS06#ST02` transaction. ModernEDI validates that composite reference before transforming or sending; an unknown or non-inbound reference returns `404`. When it is omitted, ModernEDI resolves and persists the key only if the message contains exactly one inbound transaction; an ambiguous multi-transaction message returns `400`. This lookup uses production transaction history by default; send `test=true` to infer from and link to isolated test history. ModernEDI uses the persisted `partnerId`, so the reply still selects the same partner after its configured name changes. Transactions without a persisted partner id do not supply inferred partner metadata. An explicit `partnerId` always overrides inferred partner metadata. After the partner id, X12 version, and request `Content-Type` are known, ModernEDI can also fill omitted `functionalGroupType` and `transactionGroupType` when those selectors match exactly one outgoing reply map. ModernEDI then selects the matching outgoing map by partner, X12 version, functional group, transaction set, and request `Content-Type`, generates and validates X12, then sends the reply through the configured AS2 connection. Send `x12Version` explicitly when a partner requires reply documents on a different X12 version than the one they send; explicit query parameters override inferred metadata. If multiple reply maps could match, send `functionalGroupType` and `transactionGroupType` explicitly. The original inbound document type is not reused as the reply type; these fields identify the generated reply document, such as `IN`/`810` for an invoice. JSON source maps can use XSLT with Saxon `json-to-xml($json)` or JSLT. For JSLT, ModernEDI sets the current input `.` to a wrapper object, so the source document is read through `.input` paths. If the outgoing map needs extra runtime parameters, send the JSON envelope shape with `input`, `contentType`, and `params`; XSLT maps receive those values as top-level stylesheet parameters, JSLT maps read them from `.params`, and mapper-editor params files are not used as live defaults. Use the envelope's optional `businessKey` field when the reply has a stable identifier, such as an invoice number, that should be stored on the outbound transaction record.
