        Returns the tenant's active configured trading partners in workspace order. Retired partners are excluded. Use `partnerId` from this response as the `partnerId` query parameter on `/v1/as2/send`, `/v1/as2/reply`, or `/v1/as2/carbonCopy` when your integration selects the outbound partner. The returned `name` is display metadata; use `copyToPartnerId` for the carbon-copy recipient. Partners can appear before their AS2 profile is complete so teams can publish and test maps during onboarding; `as2ConnectionConfigured` tells you whether live AS2 delivery can use that partner yet.
